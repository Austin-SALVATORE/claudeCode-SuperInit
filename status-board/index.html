<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>status board</title>
<style>
  :root{
    --bg:#16120f; --rail:#191512; --surface:#211c18; --raised:#2a241f;
    --line:#332c25; --line2:#463d34;
    --ink:#f2ede6; --ink2:#b6aca0; --ink3:#82786d;
    --amber:#d9a048; --green:#7fb069; --red:#d97757; --blue:#6a9bc3;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --sans:ui-sans-serif,-apple-system,system-ui,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}

  /* ── three temperatures: verified · moving · parked ───────────── */
  /* Three zones, three scrollbars — but the centre's belongs at the page's
     right edge, not inside the column.
     The rails scroll themselves (`.inner`, sticky + own overflow +
     overscroll-contain), so a gesture over a rail moves that rail and stops
     at its end. The centre deliberately does NOT get its own overflow: it
     drives the document, so its bar renders at the window edge where a page
     scrollbar belongs. Because the rails are sticky, the document scroll
     moves only the centre — the zone behaviour the owner asked for, without
     parking a second bar against the right rail's border.
     (Tried the other way first: giving `.moving` its own overflow put a 15px
     system bar exactly on the rail's edge. Correct zones, wrong furniture.) */
  .shell{display:grid;min-height:100dvh;
    grid-template-columns:var(--wl,292px) minmax(0,1fr) var(--wr,320px);
    grid-template-areas:"verified moving parked"}

  .rail{background:var(--rail);align-self:stretch;position:relative}

  /* Drag handles sit over the rail borders rather than in the grid, so
     resizing never reflows the track definition it is trying to change. */
  .grip{position:absolute;top:0;bottom:0;width:11px;cursor:col-resize;
    z-index:5;background:none;border:0;padding:0;touch-action:none}
  .grip-l{right:-6px} .grip-r{left:-6px}
  .grip::after{content:"";position:absolute;top:0;bottom:0;left:5px;width:1px;
    background:transparent;transition:background .12s}
  .grip:hover::after,.grip:focus-visible::after,.grip.dragging::after{
    background:var(--amber)}
  .grip:focus-visible{outline:none}
  body.resizing{cursor:col-resize;user-select:none}
  .inner{position:sticky;top:0;max-height:100dvh;overflow-y:auto;
    overscroll-behavior:contain;padding:22px 20px 40px}

  /* Giving a pane its own overflow also gives it the browser's default
     scrollbar — 15px of system grey, and in the centre column it lands
     exactly on the right rail's border with no gap. Thin, muted, inset, and
     the same on all three panes so the layout reads as one surface.
     `scrollbar-gutter: stable` reserves the space permanently so content does
     not shift sideways when a bar appears. */
  .inner{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
  .inner::-webkit-scrollbar{width:11px}
  .inner::-webkit-scrollbar-track{background:transparent}
  .inner::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;
    /* a transparent border plus content-box clipping insets the thumb, so it
       floats clear of the rail edge instead of butting against it */
    border:3px solid transparent;background-clip:content-box}
  .inner:hover::-webkit-scrollbar-thumb{background:var(--ink3);
    background-clip:content-box}
  .rail-v{grid-area:verified;border-right:1px solid var(--line)}
  .rail-p{grid-area:parked;border-left:1px solid var(--line)}
  /* The centre absorbs whatever the rails give up, but stays capped: past
     ~900px the card text stops being scannable and starts being prose. */
  .moving{grid-area:moving;padding:22px 34px 72px;max-width:900px;
    margin-inline:auto;width:100%;min-width:0}

  /* ── eyebrows ─────────────────────────────────────────────────── */
  .eyebrow{font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink3);margin:0 0 12px}
  .rail .eyebrow{padding-bottom:9px;border-bottom:1px solid var(--line)}
  .block{margin-bottom:30px}
  .block:last-child{margin-bottom:0}

  /* ── masthead ─────────────────────────────────────────────────── */
  .mark{font:600 13px/1 var(--mono);letter-spacing:.06em;color:var(--ink2);
    display:flex;align-items:center;gap:8px;margin-bottom:24px}
  .beacon{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
  .beacon.off{background:var(--red)}
  .mark .state{color:var(--ink3);font-weight:400;letter-spacing:.1em;font-size:10px;
    text-transform:uppercase;margin-left:auto}

  h1{font:600 27px/1.2 var(--sans);letter-spacing:-.018em;margin:0 0 6px;
    max-width:none;text-wrap:pretty}
  .stamp{font:12px/1.6 var(--mono);color:var(--ink3);margin:0 0 30px;letter-spacing:.02em}
  .stamp .stale{color:var(--amber)}
  .stamp i{font-style:normal;color:var(--line2);padding:0 7px}

  /* ── verified facts: everything a command could re-derive ─────── */
  .kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;
    font:12.5px/1.35 var(--mono);margin:0}
  .kv .k{color:var(--ink3);letter-spacing:.04em;min-width:0;overflow-wrap:anywhere}
  .kv .v{color:var(--ink);text-align:right;min-width:0;overflow-wrap:anywhere}
  .kv .v.ok{color:var(--green)}
  .kv .v.warn{color:var(--amber)}

  /* ── signature: the spine ─────────────────────────────────────── */
  .spine{list-style:none;margin:0;padding:0;position:relative}
  .spine::before{content:"";position:absolute;left:5px;top:12px;bottom:14px;
    width:1px;background:var(--line2)}
  .rung{position:relative;display:grid;grid-template-columns:11px 1fr;
    gap:0 13px;padding:5px 0 9px}
  .pip{width:11px;height:11px;border-radius:50%;margin-top:4px;
    background:var(--rail);border:1.5px solid var(--line2);z-index:1}
  .rung .nm{font:13px/1.35 var(--sans);color:var(--ink2)}
  .rung .st{grid-column:2;font:600 9.5px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink3);margin-top:4px}
  .rung.shipped .pip{background:var(--green);border-color:var(--green)}
  .rung.shipped .nm{color:var(--ink3)}
  .rung.shipped .st{color:var(--green)}
  .rung.held .pip{border-color:var(--amber);background:var(--amber)}
  .rung.held .nm{color:var(--ink)}
  .rung.held .st{color:var(--amber)}
  .rung.running .pip{border-color:var(--blue);background:var(--blue);
    animation:beat 2.4s ease-out infinite}
  .rung.running .nm{color:var(--ink)}
  .rung.running .st{color:var(--blue)}
  .rung.todo .nm{color:var(--ink3)}
  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(106,155,195,.5)}
    70%,100%{box-shadow:0 0 0 7px rgba(106,155,195,0)}}
  @media(prefers-reduced-motion:reduce){.rung.running .pip{animation:none}}

  /* who moved — machine-derived, so it lives with the verified half */
  .crew{list-style:none;margin:0;padding:0}
  .crew li{display:grid;grid-template-columns:1fr auto;gap:1px 8px;padding:7px 0;
    border-bottom:1px solid var(--line)}
  .crew li:last-child{border-bottom:0}
  .crew .nm{font:13px/1.3 var(--sans);color:var(--ink2)}
  .crew li.warm .nm{color:var(--ink)}
  .crew .mdl,.crew .last,.crew .knd{font:11px/1.3 var(--mono);color:var(--ink3)}
  .crew .mdl{text-align:right}
  .crew .last{color:var(--ink3)}
  .crew li.warm .last{color:var(--blue)}
  .crew .knd{text-align:right;letter-spacing:.06em}

  /* ── moving: cards ────────────────────────────────────────────── */
  /* Foldable centre sections. Native <details> so keyboard and screen
     readers work without a custom widget. */
  details.sec{margin-bottom:30px}
  details.sec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;
    gap:8px;margin-bottom:12px;font:600 10px/1 var(--mono);letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink3);padding:3px 0}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec>summary::before{content:"▸";font-size:11px;color:var(--ink3);
    transition:transform .14s;display:inline-block}
  details.sec[open]>summary::before{transform:rotate(90deg)}
  details.sec>summary:hover{color:var(--ink2)}
  details.sec>summary .n{margin-left:auto;color:var(--ink3);letter-spacing:.08em;
    border:1px solid var(--line);border-radius:20px;padding:3px 8px}
  @media(prefers-reduced-motion:reduce){details.sec>summary::before{transition:none}}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:15px 17px;margin-bottom:9px}
  .card .t{font:600 15px/1.4 var(--sans);margin-bottom:4px}
  .card .d{color:var(--ink2);font-size:14.5px}
  .card .n{color:var(--ink3);font-size:13px;margin-top:7px}
  /* An in-flight card's own age. Quiet while the claim is fresh, amber and
     bordered once it is past UNCONFIRMED_AFTER_MIN — the reader should be
     able to see doubt without reading the words. */
  .card .agechip{margin-left:9px;font:11px/1 var(--mono);letter-spacing:.06em;
    color:var(--ink3);white-space:nowrap}
  .card .agechip.stale{color:var(--amber)}
  /* Same `.agechip` element, reused outside a card — a pipeline's eyebrow
     or a fold's summary, both `text-transform:uppercase`, which the plain
     colored text above never had to contend with. Caught by loading the
     page, not by reading this file: unstyled here, it inherited that
     uppercase and sat flush against the label with only a flex gap
     between them, reading as one run-on phrase — "...UNCONFIRMED
     UNCHANGED FOR 5 H" — instead of two separate claims. A small bordered
     pill, matching `.n`'s own treatment two rules below in the same
     summary, reads as its own fact regardless of casing or spacing. */
  .eyebrow .agechip, summary .agechip{text-transform:none;font:600 10px/1 var(--mono);
    letter-spacing:.05em;color:var(--ink3);border:1px solid var(--line);
    border-radius:20px;padding:3px 8px;white-space:nowrap;flex:none;margin-left:2px}
  .eyebrow .agechip.stale, summary .agechip.stale{color:var(--amber);border-color:var(--amber)}
  .card.unconfirmed{border-color:var(--amber);border-style:dashed}
  /* A shot is evidence, not decoration: full width of its card, checkered so
     a transparent or white-on-white capture is still visibly an image, and
     clickable through to the original at full size. */
  .shotlink{display:block;margin-top:11px}
  .shot{display:block;width:100%;height:auto;border-radius:8px;
    border:1px solid var(--line);background:
      repeating-conic-gradient(#00000010 0% 25%, transparent 0% 50%) 50%/16px 16px}
  .shotlink:hover .shot{border-color:var(--amber)}

  .ask{border-color:var(--amber);background:#22190e}
  /* An answered question stays visible so the loop is seen to close —
     a decision that silently vanishes reads as a decision that was lost. */
  .done{border-color:#3d5236}
  .done .t{color:var(--ink2);font-weight:500}
  /* flex-start, not baseline: baseline alignment anchors to the first line
     only, which reads fine for a short answer but leaves the checkmark
     floating away from a multi-paragraph one. pre-wrap keeps the owner's own
     line breaks — the alternative, letting normal whitespace collapsing eat
     them, turns several paragraphs into one run-on line silently, which is
     the same shape of loss as the truncation this exists next to. */
  .done .chose{display:flex;align-items:flex-start;gap:9px;margin-top:8px;
    font:15px/1.4 var(--sans);color:var(--ink)}
  .done .chose::before{content:"✓";color:var(--green);font:13px var(--mono);
    margin-top:2px}
  /* min-width:0 on the text itself, not just the flex container: a flex
     item's default min-width is its content's min-content size, and text
     with no wrap opportunity (a long URL, a hash, CJK with no spaces) would
     rather overflow the card than shrink below that — this is the one line
     that stops it. overflow-wrap is the same guarantee for the rare word
     that is still too long to wrap normally. */
  /* max-height + its own scrollbar, not just wrapping: a full-length CJK
     answer near the 20,000-character cap measured 11,843px tall with no
     limit here, and five of them on one board made the page 30,969px — 34x
     the viewport, for a card whose entire point was to stay legible. This
     caps the box, not the content: nothing above is trimmed, the full text
     is still in the DOM and still reachable by scrolling inside the card,
     it just stops setting the height of the page around it. */
  .chosetxt{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;
    max-height:380px;overflow-y:auto}
  /* Same visual language as .card.unconfirmed's dashed amber border: doubt
     the reader should see without reading the words. This one says the text
     above it is known incomplete, not just possibly stale. */
  .done .trunc{color:var(--amber);font-size:12.5px;margin-top:7px;
    padding:6px 9px;border:1px dashed var(--amber);border-radius:8px}
  .done .when{font:11px var(--mono);color:var(--ink3);margin-top:6px;
    letter-spacing:.05em}
  .ask .t{font-size:16px}
  .opts{display:flex;flex-direction:column;gap:7px;margin-top:14px}
  .opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;
    gap:4px 11px;align-items:center;text-align:left;
    background:var(--raised);color:var(--ink);border:1px solid var(--line2);
    border-radius:9px;padding:12px 14px;font:14.5px/1.4 var(--sans);
    cursor:pointer;min-height:46px;transition:border-color .12s,color .12s}
  .opt::before{content:"↩";font:12px var(--mono);color:var(--ink3)}
  .opt:hover{border-color:var(--amber)}
  .opt.copied{border-color:var(--green);color:var(--green)}
  .opt.copied::before{content:"✓";color:var(--green)}
  .opt .rsn{grid-column:2/4;font-size:13px;color:var(--ink3);line-height:1.4}
  /* Quieter than the options — copying the question is a secondary move,
     and must not compete with actually answering it. */
  .copyq{margin-top:9px;width:100%;min-height:38px;border-radius:8px;
    background:none;color:var(--ink3);border:1px dashed var(--line2);
    font:12px var(--mono);letter-spacing:.04em;cursor:pointer}
  .copyq:hover{color:var(--ink2);border-color:var(--amber)}
  .opt.rec{border-color:var(--amber)}
  .pick{position:relative;font:600 9.5px/1 var(--mono);letter-spacing:.12em;
    text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);
    border-radius:20px;padding:4px 9px;white-space:nowrap;
    transition:color .14s,border-color .14s,background-color .14s}
  /* Clicking the recommended option confirms on the pill itself: it flips to
     green and says so. The label swaps via ::after so the pill keeps its
     original width and nothing shifts underneath it. */
  .opt.copied .pick{color:transparent;border-color:var(--green);
    background:var(--green);animation:pop .32s ease-out}
  .opt.copied .pick::after{content:attr(data-copied);position:absolute;inset:0;
    display:grid;place-items:center;color:#10210a;letter-spacing:.12em}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
  @media(prefers-reduced-motion:reduce){.opt.copied .pick{animation:none}}

  /* ── image-bearing decisions: look, then choose ─────────────────
     An option carrying `shot` used to render its preview INSIDE the
     button that records the answer — so examining it and choosing it
     were the same click. Split in two: a review list above (shot links
     out, never embeds a clickable preview inside a recording target)
     and a labelled choice row below. The identifier (a plain digit,
     matching the numbering `questionText` already puts in the copied
     clipboard text) appears in both places, so "option 2" means the
     same thing whether the reader is looking at the picture or the
     button. Text-only decisions never take this path — see `asks()`. */
  .optid{display:inline-grid;place-items:center;flex:none;min-width:22px;
    height:22px;padding:0 2px;border-radius:50%;background:var(--raised);
    border:1px solid var(--line2);font:600 11.5px/1 var(--mono);color:var(--ink2)}
  .optid.rec{border-color:var(--amber);color:var(--amber)}

  .optreview{list-style:none;margin:14px 0 0;padding:0;display:flex;
    flex-direction:column;gap:16px}
  .optreview li{display:flex;gap:11px;align-items:flex-start}
  .optreview .optid{margin-top:1px}
  .optreview-body{min-width:0;flex:1}
  .optreview-lab{font:14.5px/1.4 var(--sans);color:var(--ink)}
  .rectag{margin-left:8px;font:600 9.5px/1 var(--mono);letter-spacing:.1em;
    text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);
    border-radius:20px;padding:3px 7px;white-space:nowrap}
  .optreview .rsn{margin-top:4px}

  /* A bounded, UNIFORM box, not a faithful scaled render — these images
     (multi-page comparison sheets, several thousand px wide) are
     illegible at any inline size, so the thumbnail's job is identification,
     not review. Same box for every option in a card: a list of choices
     that all read the same height, not a gallery whose scroll cost varies
     with each image's aspect ratio. `object-fit:cover` crops rather than
     squashes, so identity (which one is this) survives even if the crop
     loses detail — the reader compares that against the full image behind
     the link, not against this box. */
  .optshotlink{position:relative;display:inline-block;margin-top:10px;
    border-radius:8px}
  .optshot{display:block;width:168px;height:104px;object-fit:cover;
    border-radius:8px;border:1px solid var(--line);background:
      repeating-conic-gradient(#00000010 0% 25%, transparent 0% 50%) 50%/16px 16px}
  .optshotlink:hover .optshot{border-color:var(--amber)}
  /* Opens in a new tab (rel="noopener", same as `shot()`) — the reader's
     place on THIS tab is never disturbed, which is the whole answer to
     "must not lose their place" for the look/back/compare round trip. */
  .optshot-badge{position:absolute;top:6px;left:6px;display:inline-grid;
    place-items:center;min-width:20px;height:20px;padding:0 5px;
    border-radius:20px;background:rgba(10,8,6,.78);color:#f2ede6;
    font:600 11px/1 var(--mono);border:1px solid rgba(255,255,255,.28)}
  .optshot-badge.rec{background:var(--amber);color:#1c1509;border-color:var(--amber)}

  .choicerow{margin-top:16px}
  .choicerow-label{margin:0 0 8px;font:600 10px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink3)}
  /* Same `.opt` button as a text-only decision uses — same click handler,
     same recommended-pill exemption, same confirm-on-divergence gate.
     Only the icon column differs: the decorative "↩" is replaced with the
     real `.optid` badge, so what recorded the answer is legible on its own
     even scrolled away from the review list above it. */
  .opt.idbtn::before{content:none}

  /* Diverging from the recommendation is confirmed on the page, not trusted
     to a stray tap. The recommended option is exempt: agreeing with a stated
     analysis needs no second signal. */
  /* Uses only variables this stylesheet actually defines — --bg/--surface/
     --raised/--ink/--ink2/--ink3/--line2. An invented name silently yields an
     invalid declaration, and for `background` that means a fully transparent
     dialog with the page legible through it. */
  dialog.confirm{border:1px solid var(--line2);border-radius:12px;padding:0;
    background:var(--surface);color:var(--ink);width:min(520px,92vw);
    font:15px/1.5 var(--sans);
    box-shadow:0 24px 60px rgba(0,0,0,.5)}
  dialog.confirm::backdrop{background:rgba(0,0,0,.6)}
  dialog.confirm form{margin:0;display:block}
  dialog.confirm .cbody{padding:22px 24px 4px}
  dialog.confirm .ceyebrow{display:block;font:11px/1.4 var(--mono);
    letter-spacing:.09em;text-transform:uppercase;color:var(--amber);
    margin:0 0 14px}
  dialog.confirm .cq{display:block;font-size:13px;color:var(--ink3);
    line-height:1.5;margin:0 0 16px}
  dialog.confirm .ca{display:block;font-size:17px;line-height:1.4;
    color:var(--ink);font-weight:600;margin:0 0 16px;
    padding:12px 14px;background:var(--raised);border-radius:8px;
    border-left:3px solid var(--amber)}
  dialog.confirm .cnote{display:block;font-size:12.5px;color:var(--ink3);
    line-height:1.55;margin:0}
  dialog.confirm .cinput{display:block;width:100%;box-sizing:border-box;
    font:inherit;font-size:15px;line-height:1.5;color:var(--ink);
    background:var(--raised);border:1px solid var(--line2);border-radius:8px;
    padding:11px 13px;margin:0 0 14px;resize:vertical;min-height:88px}
  dialog.confirm .cinput::placeholder{color:var(--ink3)}
  dialog.confirm .cinput:focus{outline:2px solid var(--amber);outline-offset:1px;
    border-color:var(--amber)}
  dialog.confirm button[disabled]{opacity:.45;cursor:not-allowed}
  dialog.confirm button.go[disabled]:hover{filter:none}
  /* The free-text entry is a peer of the options, not a lesser link — it is
     the only path that does not force the owner into the agent's framing. */
  .opt.other{border-style:dashed}
  .opt.other .lab{color:var(--ink2)}
  dialog.confirm .cbtns{display:flex;gap:10px;justify-content:flex-end;
    align-items:center;padding:20px 24px 20px;margin:0}
  dialog.confirm button{font:inherit;font-size:13.5px;line-height:1;
    padding:11px 18px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line2);background:transparent;color:var(--ink2);
    white-space:nowrap}
  dialog.confirm button:hover{border-color:var(--ink3);color:var(--ink)}
  dialog.confirm button.go{border-color:var(--amber);color:var(--bg);
    background:var(--amber);font-weight:600}
  dialog.confirm button.go:hover{filter:brightness(1.08);color:var(--bg)}
  dialog.confirm button:focus-visible{outline:2px solid var(--amber);
    outline-offset:2px}

  /* Motion is opt-in to the ABSENCE of the preference, so a declaration added
     later without the wrapper gets no animation rather than an unstoppable
     one. The dialog is legible and complete without any of this running. */
  @keyframes confirmIn{
    from{opacity:0;transform:translateY(10px) scale(.975)}
    to{opacity:1;transform:none}
  }
  @keyframes confirmBackdropIn{ from{opacity:0} to{opacity:1} }
  @media(prefers-reduced-motion:no-preference){
    dialog.confirm[open]{animation:confirmIn 190ms cubic-bezier(.2,.8,.2,1) both}
    dialog.confirm[open]::backdrop{animation:confirmBackdropIn 190ms ease both}
  }

  /* A handoff is content leaving the board for a third party — a coach, a
     colleague. Numbered because the owner will refer to items by number. */
  .ho{border-color:var(--blue)}
  .ho .to{font:600 9.5px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;
    color:var(--blue);margin-bottom:7px}
  .ho ol{margin:12px 0 0;padding:0;list-style:none;counter-reset:ho}
  .ho ol li{counter-increment:ho;display:grid;grid-template-columns:22px 1fr;
    gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .ho ol li::before{content:counter(ho);font:600 12px/1.5 var(--mono);color:var(--blue)}
  .ho .pt{font-weight:600;font-size:14.5px}
  .ho .pd{color:var(--ink2);font-size:14px;margin-top:2px}
  .ho .flag{margin-top:12px;padding-left:13px;border-left:2px solid var(--amber);
    color:var(--ink2);font-size:14px}
  .ho .send{margin-top:14px;width:100%;min-height:44px;border-radius:9px;
    background:var(--raised);color:var(--ink);border:1px solid var(--line2);
    font:600 14px var(--sans);cursor:pointer}
  .ho .send:hover{border-color:var(--blue)}
  /* A resolved handoff reads as done, not as a quieter version of
     outstanding — same green the answered-decision card already uses, and
     it must win over `.ho`'s own blue border despite arriving later in the
     cascade at equal specificity, so it is named explicitly rather than
     left to source order. */
  .ho.done{border-color:#3d5236}

  .sev{display:inline-block;width:7px;height:7px;border-radius:50%;
    margin-right:9px;vertical-align:.12em;flex:none}
  .sev.high{background:var(--red)}
  .sev.med{background:var(--amber)}
  .sev.low{background:var(--ink3)}

  /* held commits — mono, because a SHA is machine truth in a human list */
  .commits{list-style:none;margin:0;padding:0}
  .commits li{display:grid;grid-template-columns:auto 1fr;gap:12px;
    padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--ink2)}
  .commits li:last-child{border-bottom:0}
  .commits .sha{font:12.5px/1.5 var(--mono);color:var(--amber);letter-spacing:.02em}
  .why{color:var(--ink3);font-size:13.5px;margin-top:11px;
    border-left:2px solid var(--line2);padding-left:13px}

  /* ── backlog ──────────────────────────────────────────────────── */
  .bl-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;
    padding-bottom:9px;border-bottom:1px solid var(--line)}
  .bl-head .eyebrow{margin:0;padding:0;border:0;flex:1}
  .addbtn{background:var(--raised);color:var(--ink2);border:1px solid var(--line2);
    border-radius:7px;font:600 11px/1 var(--mono);letter-spacing:.06em;
    padding:7px 10px;cursor:pointer;min-height:30px}
  .addbtn:hover{border-color:var(--amber);color:var(--ink)}

  .compose{display:none;margin-bottom:18px}
  .compose.open{display:block}
  .compose input,.compose textarea,.compose select{width:100%;background:var(--bg);
    color:var(--ink);border:1px solid var(--line2);border-radius:8px;
    padding:9px 11px;font:14px/1.4 var(--sans);margin-bottom:7px}
  .compose textarea{resize:vertical;min-height:58px}
  .compose .row{display:flex;gap:7px}
  .compose .row button{flex:1;min-height:40px;border-radius:8px;cursor:pointer;
    font:600 13px var(--sans);border:1px solid var(--line2)}
  .compose .save{background:var(--amber);color:#1c1509;border-color:var(--amber)}
  .compose .cancel{background:transparent;color:var(--ink3)}
  .compose .err{color:var(--red);font-size:12.5px;min-height:1em;margin-bottom:4px}

  .grp{font:600 9.5px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink3);margin:18px 0 8px}
  .grp:first-child{margin-top:0}
  .bl{list-style:none;margin:0;padding:0}
  .bl li{padding:10px 0;border-bottom:1px solid var(--line)}
  .bl li:last-child{border-bottom:0}
  .bl .ttl{font-size:13.5px;line-height:1.45;color:var(--ink2)}
  .bl li.mine .ttl{color:var(--ink)}
  .bl .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;
    font:11px/1.4 var(--mono);color:var(--ink3);min-width:0}
  .bl .code{border:1px solid var(--line2);border-radius:4px;padding:1px 5px}
  .bl .from{color:var(--amber)}
  .bl .done{margin-left:auto;background:none;border:0;color:var(--ink3);
    cursor:pointer;font:11px var(--mono);padding:4px 2px}
  .bl .done:hover{color:var(--green)}

  code{background:var(--raised);border-radius:5px;padding:1px 6px;
    font:.86em var(--mono);color:var(--amber)}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;
    max-width:min(90vw,520px);text-align:center;
    background:var(--green);color:#101f0a;padding:11px 20px;border-radius:9px;
    font:600 14px var(--sans);opacity:0;transition:opacity .18s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  /* Distinct from the routine green "Copied" toast on purpose — this is the
     one that means "the thing you just did did not happen." */
  .toast.err{background:var(--red);color:#2a0d05}

  /* ── collapse ─────────────────────────────────────────────────── */
  @media(max-width:1160px){
    .shell{grid-template-columns:268px minmax(0,1fr);
      grid-template-areas:"verified moving" "verified parked"}
    .moving{padding:22px 26px 40px}
    .rail-p{border-left:0;border-top:1px solid var(--line)}
  }
  @media(max-width:820px){
    .shell{grid-template-columns:minmax(0,1fr);
      grid-template-areas:"moving" "verified" "parked"}
    .rail{border:0;border-top:1px solid var(--line)}
    .rail-v{border-right:0}
    .inner{position:static;max-height:none;padding:24px 20px 30px}
    .grip{display:none}   /* nothing to drag when the rails are stacked */
    .moving{padding:20px 20px 24px;max-width:none}
    h1{font-size:23px;max-width:none}
  }

  @media(prefers-color-scheme:light){
    :root{--bg:#f6f2ec;--rail:#fffdfa;--surface:#fff;--raised:#f1ece4;
      --line:#e2dbd0;--line2:#cfc5b7;--ink:#1c1815;--ink2:#4d453c;--ink3:#7d7367}
    .ask{background:#fdf5e6}
    .toast{color:#0e1c08}
  }
</style>
</head>
<body>
<div class="shell">

  <aside class="rail rail-v">
    <button class="grip grip-l" id="gripL" role="separator" aria-orientation="vertical"
      aria-label="Resize the verified column" title="Drag to resize · double-click to reset"></button>
    <div class="inner">
      <div class="mark"><span class="beacon" id="beacon"></span><span id="project">…</span>
        <span class="state" id="tick">live</span></div>
      <div class="block"><p class="eyebrow">Verified</p><dl class="kv" id="kv"></dl></div>
      <div class="block" id="pipeblock"></div>
      <div class="block" id="teamblock"></div>
    </div>
  </aside>

  <main class="moving">
    <h1 id="headline">…</h1>
    <p class="stamp" id="stamp"></p>
    <div id="body"></div>
  </main>

  <aside class="rail rail-p">
    <button class="grip grip-r" id="gripR" role="separator" aria-orientation="vertical"
      aria-label="Resize the backlog column" title="Drag to resize · double-click to reset"></button>
    <div class="inner" id="parked"></div>
  </aside>
</div>

<div class="toast" id="toast">Copied — paste it to me</div>

<script>
// ── resizable rails ──────────────────────────────────────────────────
// The centre column is the flex track (minmax(0,1fr)), so dragging either
// rail only ever takes from or gives to the reading column — the two rails
// can never fight each other, and nothing can be squeezed to zero.
const RAILS = {
  wl: { el: 'gripL', min: 190, max: 560, def: 292, from: 'left' },
  wr: { el: 'gripR', min: 190, max: 560, def: 320, from: 'right' },
}
const MIN_CENTRE = 380

function setRail(key, px){
  const { min, max } = RAILS[key]
  const other = parseInt(getComputedStyle(document.documentElement)
    .getPropertyValue(key === 'wl' ? '--wr' : '--wl')) || RAILS[key === 'wl' ? 'wr' : 'wl'].def
  // Never let a drag starve the middle column; that is the one you read.
  const ceiling = Math.min(max, window.innerWidth - other - MIN_CENTRE)
  const val = Math.round(Math.max(min, Math.min(ceiling, px)))
  document.documentElement.style.setProperty(`--${key}`, val + 'px')
  try { localStorage.setItem('board.' + key, val) } catch (e) {}
  return val
}

function initRails(){
  for(const [key, cfg] of Object.entries(RAILS)){
    let stored = null
    try { stored = parseInt(localStorage.getItem('board.' + key)) } catch (e) {}
    setRail(key, Number.isFinite(stored) ? stored : cfg.def)

    const grip = document.getElementById(cfg.el)
    const width = e => cfg.from === 'left' ? e.clientX : window.innerWidth - e.clientX

    // Explicit drag state rather than hasPointerCapture(): capture can be
    // refused or silently absent, and a divider that stops tracking mid-drag
    // is worse than one that never moved.
    let dragging = false
    grip.addEventListener('pointerdown', e => {
      e.preventDefault()
      dragging = true
      try { grip.setPointerCapture(e.pointerId) } catch (err) {}
      grip.classList.add('dragging'); document.body.classList.add('resizing')
    })
    grip.addEventListener('pointermove', e => { if(dragging) setRail(key, width(e)) })
    const stop = e => {
      if(!dragging) return
      dragging = false
      try { grip.releasePointerCapture(e.pointerId) } catch (err) {}
      grip.classList.remove('dragging'); document.body.classList.remove('resizing')
    }
    grip.addEventListener('pointerup', stop)
    grip.addEventListener('pointercancel', stop)
    // If the pointer is released off-element, capture may never fire pointerup.
    window.addEventListener('pointerup', stop)
    grip.addEventListener('dblclick', () => setRail(key, cfg.def))

    // Keyboard: a divider you can only reach with a mouse is not a control.
    grip.addEventListener('keydown', e => {
      const step = e.shiftKey ? 48 : 16
      const now = parseInt(getComputedStyle(document.documentElement)
        .getPropertyValue(`--${key}`)) || cfg.def
      const grow = cfg.from === 'left' ? 'ArrowRight' : 'ArrowLeft'
      const shrink = cfg.from === 'left' ? 'ArrowLeft' : 'ArrowRight'
      if(e.key === grow) setRail(key, now + step)
      else if(e.key === shrink) setRail(key, now - step)
      else if(e.key === 'Home') setRail(key, cfg.def)
      else return
      e.preventDefault()
    })
  }
  // A window that narrows must not leave a stored width starving the centre.
  window.addEventListener('resize', () => {
    for(const key of Object.keys(RAILS)){
      const now = parseInt(getComputedStyle(document.documentElement)
        .getPropertyValue(`--${key}`)) || RAILS[key].def
      setRail(key, now)
    }
  })
}

// Quotes are escaped too, not just tag characters: esc() output goes into
// HTML *attributes* (data-q="...", data-a="..."), where a raw `"` in a
// question or option label terminates the attribute early. Found live
// (11 Aug 2026): a decision whose question contained a quoted phrase
// recorded its answer under a truncated key — cut at the first inner
// quote — which the answered-filter then couldn't match, so the card
// never left "Needs you" on its own.
const esc = s => String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]))
// Two rules, applied to text that is ALREADY escaped — every character this
// function inserts into the DOM is either a literal tag we wrote ourselves
// (`<code>`, `<strong>`) or a captured group of already-`esc()`-ed content.
// $1 can never contain a raw `<`, `>` or `&` — esc() ran first, over the
// whole string, before either pattern gets to see it — so there is no
// position in the output where captured text can close a tag early or open
// a new one. A narrative string containing a literal `<script>` becomes
// inert text reading "<script>" on the page, bolded or coded like anything
// else, never a real element.
//
// Code spans are parsed FIRST and their content is placeholder-protected
// before the bold pattern ever runs, so `` `a ** glob **` `` cannot have its
// asterisks read as emphasis — same rule every other markdown implementation
// uses (a code span's content is literal to every other rule), and the
// concrete case this project actually writes: shell globs and CSS asterisks
// inside backticked spans, which would otherwise silently turn into bold
// mid-command. The placeholder is restored after the bold pass runs, so a
// code span always wins the argument over what it contains.
const md = s => {
  // A NUL char can't occur in text an agent authors into JSON, so it is a
  // safe placeholder delimiter — built via fromCharCode rather than typed as
  // a literal escape, and never a plain string like a space or a digit,
  // which ordinary prose ("step 0", a decimal) could collide with.
  const NUL = String.fromCharCode(0)
  const spans = []
  const withPlaceholders = esc(s).replace(/`([^`]+)`/g, (_, inner) => {
    spans.push(inner)
    return NUL + (spans.length - 1) + NUL
  })
  const bolded = withPlaceholders.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>')
  return bolded.replace(new RegExp(NUL + '(\\d+)' + NUL, 'g'), (_, i) => `<code>${spans[+i]}</code>`)
}
const has = a => Array.isArray(a) && a.length
// `chip` is pre-built, already-safe HTML (see `sectionChip()`, below the age
// helpers it depends on) — never raw label text, so it is appended after
// `esc(label)` rather than folded into the escaped string.
const block = (label, inner, chip = '') => inner ? `<div class="block"><p class="eyebrow">${esc(label)}${chip}</p>${inner}</div>` : ''

// Centre sections fold once they get long, so a growing history never pushes
// the live work off the screen. "Needs you" is never foldable — the one thing
// that must always be visible is the thing being asked of you.
const FOLD_OVER = 3
// `id`, when given, is a stable target for tickAges() to patch this
// section's own heading later without a full rebuild — separate from
// `label`, which changes text when the section's claim ages (inFlightLabel)
// and cannot itself be a stable lookup key. Every other section omits `id`
// and renders exactly as before: the wrapper span only appears when there
// is something outside a real render() that might need to reach in and
// change this heading's words.
function fold(label, inner, count, { never = false, openBelow = FOLD_OVER, id = null, chip = '' } = {}){
  if(!inner) return ''
  if(never) return `<div class="block"><p class="eyebrow">${esc(label)}${chip}</p>${inner}</div>`
  const key = 'board.open.' + label
  let stored = null
  try { stored = localStorage.getItem(key) } catch (e) {}
  // Remembered choice wins; otherwise short sections open, long ones fold.
  const open = stored === null ? count <= openBelow : stored === '1'
  const labelHtml = id ? `<span class="sec-label">${esc(label)}</span>` : esc(label)
  return `<details class="sec"${open ? ' open' : ''} data-sec="${esc(label)}"${id ? ` id="sec-${esc(id)}"` : ''}>
    <summary>${labelHtml}${chip}${count ? `<span class="n">${count}</span>` : ''}</summary>
    ${inner}</details>`
}

const tone = v => {
  const s = String(v).toLowerCase()
  if(['clean','none','ok','passing','green'].includes(s)) return 'ok'
  if(/dirty|commits?$|not run|unknown|\?/.test(s)) return 'warn'
  return ''
}

// How old a thing is, in words. Machine facts never reach this — they are
// re-derived per request — so anything shown here is judgement with an age.
// Always a point in the past — "written 4 min ago", "started 4 min ago" —
// which is why it always ends in "ago". Composing it after a preposition
// that wants a plain span instead ("unconfirmed for 34 min ago") produces
// broken English: see `duration` below, which exists for exactly that case
// and must not be confused with this one.
const ago = m => m == null ? null
  : m < 1.5 ? 'just now'
  : m < 60  ? `${Math.round(m)} min ago`
  : m < 1440 ? `${Math.round(m / 60)} h ago`
  : `${Math.round(m / 1440)} d ago`

// A bare span of time, with the same buckets as `ago` but none of the "ago"
// — for a sentence that already supplies the "for"/"waiting" that makes the
// duration make sense on its own ("unconfirmed for 34 min", "waiting 5 h").
// Shipped in 0.4.0 and inherited by the handoff chip as `${prefix}${ago(m)}`
// for both the fresh and the stale prefix, which is only correct for the
// fresh one ("started 4 min ago"). The stale one ("unconfirmed for",
// "waiting") wants a duration, not a point in time, and "for 34 min ago" is
// not English — found reading the *shipped* chip text during verification
// of a different fix, missed by two earlier passes that both checked the
// mechanism (does the number change) and not the words themselves.
// `just now`'s duration form is not empty or "0 min": a config with none of
// `ago`'s buckets skipped is worth less than one with the shortest bucket
// worded badly, and "under a minute" is the shape every other duration in
// this function already has (magnitude then unit), not a special case.
const duration = m => m == null ? null
  : m < 1.5 ? 'under a minute'
  : m < 60  ? `${Math.round(m)} min`
  : m < 1440 ? `${Math.round(m / 60)} h`
  : `${Math.round(m / 1440)} d`

// Minutes since an ISO timestamp, or null if absent/unparseable. Computed in
// the browser on every poll, so it keeps ticking without the agent writing
// anything — which is the entire point: see UNCONFIRMED_AFTER_MIN below.
const minsSince = iso => {
  if(!iso) return null
  const t = Date.parse(iso)
  return Number.isNaN(t) ? null : (Date.now() - t) / 60000
}

// "Running now" is the only present-tense claim on this page, and it is the
// one thing here that is neither derived nor dated. Machine facts are re-read
// per request so they cannot go stale; judgement is dated so the reader can
// see it aging. A hand-typed claim that an agent *is currently working* is
// neither — it was true when written, and nothing makes it false when the
// agent stops. The agent only rewrites the narrative when it next speaks to
// the owner, and agents start and stop precisely while the owner is silent,
// so the field most likely to be wrong is refreshed on the cadence least
// correlated with its changes.
//
// So it expires visually. Past this many minutes with no rewrite, the card
// stops asserting and starts asking — the spinner becomes a question mark.
// This does not make the claim true or false; it makes the *not knowing*
// visible, which is the only honest thing a page can do about a fact it
// cannot check.
const UNCONFIRMED_AFTER_MIN = 20

// A handoff waiting hours, not minutes, is unremarkable — it is a human
// errand, not a running process, and "still on my list" is a normal state
// for most of a day. 4 hours is chosen as roughly half a working day: long
// enough that a same-day deploy-checklist handoff has clearly had time to
// be carried, short enough to still catch one forgotten by evening.
const HANDOFF_STALE_AFTER_MIN = 240

// `pipeline`/`inFlight` are STATE, not accumulation — see `section_ages()`
// in serve.py for the split this threshold assumes. An accumulating
// section (`findings`, `answered`) being old is fine, expected, the normal
// case. A state section being unchanged for a long time is the specific
// defect this exists to catch, so — same reasoning as HANDOFF's "half a
// working day", not UNCONFIRMED_AFTER_MIN's fast loop: a pipeline step can
// legitimately take hours, and flagging that as stale would train the
// reader to ignore the chip before it ever caught a real one.
const SECTION_STALE_AFTER_MIN = 240

// One source of truth for an age chip's text and staleness, used both when
// building the initial HTML (cards/handoffs) and when a chip already on the
// page is patched in place with the time that has passed since (tickAges,
// below) — so the two paths cannot drift into disagreeing about a threshold
// or a word. `kind` selects which of the two claims this chip is making;
// each has its own threshold and its own before/after wording, because
// "unconfirmed" reads as an accusation on a human errand and "waiting"
// reads as too soft for a claim about whether an agent is still working.
//
// The fresh and stale prefixes take different grammar, not just different
// words: "started"/"logged" name a point in the past, so they take `ago`
// ("started 4 min ago"); "unconfirmed for"/"waiting" name a span, so they
// take `duration`, with no "ago" ("unconfirmed for 34 min"). Picking the
// wrong one for either prefix reads as broken English, not as a style
// choice — "unconfirmed for 34 min ago" and "started 4 min" are the same
// error in opposite directions.
const AGE_KINDS = {
  inflight: { thresholdMin: UNCONFIRMED_AFTER_MIN, freshPrefix: 'started ', stalePrefix: 'unconfirmed for ' },
  handoff:  { thresholdMin: HANDOFF_STALE_AFTER_MIN, freshPrefix: 'logged ', stalePrefix: 'waiting ' },
  // "updated"/"unchanged for": a section is a claim about current state,
  // not an event that happened at a point in time, so neither of the
  // other two kinds' vocabulary fit without borrowing one word from each.
  section:  { thresholdMin: SECTION_STALE_AFTER_MIN, freshPrefix: 'updated ', stalePrefix: 'unchanged for ' },
}
function ageChipState(kind, since){
  const m = minsSince(since)
  if(m == null) return null
  const { thresholdMin, freshPrefix, stalePrefix } = AGE_KINDS[kind]
  const old = m > thresholdMin
  const text = old ? `${stalePrefix}${duration(m)}` : `${freshPrefix}${ago(m)}`
  return { old, text }
}

// A section's own age chip — same `.agechip` element and the same
// `tickAges()` loop already re-dates every inFlight/handoff chip on every
// poll picks this up for free, because it matches on the class and
// `data-since` attribute alone; no section-specific code was added there.
// Returns '' when the server has no reading for this section yet (e.g. a
// key outside `Board.STATE_SECTIONS`), not a chip claiming zero age.
const sectionChip = (r, key) => {
  const iso = r.freshness && r.freshness.sections && r.freshness.sections[key]
  if(!iso) return ''
  const state = ageChipState('section', iso)
  if(!state) return ''
  return ` <span class="agechip${state.old ? ' stale' : ''}" data-since="${esc(iso)}" data-kind="section">${esc(state.text)}</span>`
}

// A picture, when prose cannot carry the thing.
//
// The board's own rule is that anything structured belongs on the page rather
// than in chat. A visual defect is the case where that rule was quietly
// impossible to follow: the board could hold a careful description and a
// filesystem path, and the reader still had to go and open the file. A
// wrapping-text bug was described in three paragraphs and read as minor; one
// screenshot made it obvious immediately. So the slot exists.
//
// `shot` is a bare filename living in the board's own shots/ directory — never
// a path. See send_shot() in serve.py for why that is not a limitation but the
// entire security model, and why it also stops boards rotting into broken
// images when a session scratchpad is cleaned up.
const shot = (name, alt) => name
  ? `<a class="shotlink" href="shot/${encodeURIComponent(name)}" target="_blank" rel="noopener">
       <img class="shot" src="shot/${encodeURIComponent(name)}" loading="lazy"
            alt="${esc(alt || 'screenshot')}"></a>`
  : ''

const inFlightLabel = list => has(list) && list.some(x => {
  const m = minsSince(x.since)
  return m != null && m > UNCONFIRMED_AFTER_MIN
}) ? 'Running now — some of this is unconfirmed' : 'Running now'

function cards(list, cls = ''){
  if(!has(list)) return ''
  return list.map(x => {
    // `since` on an in-flight entry is when the work was said to have started.
    // Falls back to nothing for every other card type, which are past-tense
    // and do not need it. `data-since`/`data-kind` are what let tickAges()
    // (below) find and re-date this exact chip later without a full rebuild.
    const state = ageChipState('inflight', x.since)
    const age = state
      ? `<span class="agechip${state.old ? ' stale' : ''}" data-since="${esc(x.since)}" data-kind="inflight">${esc(state.text)}</span>`
      : ''
    return `<div class="card ${cls}${state?.old ? ' unconfirmed' : ''}">
    <div class="t">${x.sev ? `<span class="sev ${esc(x.sev)}"></span>` : ''}${md(x.what || x.title || '')}${age}</div>
    ${x.detail || x.d ? `<div class="d">${md(x.detail || x.d)}</div>` : ''}
    ${shot(x.shot, x.what || x.title)}
    ${x.who ? `<div class="n">${md(x.who)}</div>` : ''}
    ${x.note ? `<div class="n">${md(x.note)}</div>` : ''}
  </div>`
  }).join('')
}

// An option is either a plain string, or {label, recommend, why} when there is
// a reason to prefer one. The recommendation is for reading, not for pasting.
//
// The clipboard payload carries the QUESTION as well as the answer, and names
// the project. A bare option label forces the reader on the other end to work
// out what it was an answer to — across several boards, it may not even be
// obvious which project it came from.
const replyText = (project, question, answer) =>
  `[${project} board] Re: ${question}\n→ ${answer}`

// Confirmation gate for any option that is NOT the recommended one.
//
// A tap records an answer server-side the instant it lands, and the agent acts
// on what it finds there — so a stray tap on a wrong option is indistinguishable
// from a considered ruling. The recommended option is deliberately exempt:
// agreeing with an analysis printed on the same screen carries its own context,
// and gating it would add friction to the common case to guard the rare one.
//
// Native <dialog> so Escape, focus trapping and the backdrop are the browser's
// job rather than ours. Resolves false on cancel, dismiss, or Escape.
// Free-text answer. Every question gets one, because the options are the
// agent's framing of the problem and the owner's answer is not obliged to fit
// it — the real answer is often a qualification ("yes, but only for X") that no
// option anticipated. Without this the board quietly converts "none of these"
// into whichever option was closest, which is worse than no answer.
function promptOther(question){
  return new Promise(resolve => {
    const d = document.createElement('dialog')
    d.className = 'confirm'
    d.innerHTML = `
      <form method="dialog">
        <div class="cbody">
          <div class="ceyebrow">Your own answer</div>
          <div class="cq">${md(question)}</div>
          <textarea class="cinput" rows="4" placeholder="Write it in your own words — a qualification, a different option, or a question back."></textarea>
          <div class="cnote">Recorded as your ruling exactly as written.
            Nothing happens if you cancel.</div>
        </div>
        <div class="cbtns">
          <button value="cancel">Cancel</button>
          <button value="confirm" class="go">Record this answer</button>
        </div>
      </form>`
    const ta = d.querySelector('textarea')
    const go = d.querySelector('button.go')
    // An empty answer is not an answer; keep the button inert until there is text.
    const sync = () => { go.disabled = !ta.value.trim() }
    ta.addEventListener('input', sync); sync()
    d.addEventListener('close', () => {
      const text = ta.value.trim()
      d.remove()
      resolve(d.returnValue === 'confirm' && text ? text : null)
    }, { once: true })
    document.body.appendChild(d)
    d.showModal()
    ta.focus()
  })
}

function confirmDivergence(question, answer){
  return new Promise(resolve => {
    const d = document.createElement('dialog')
    d.className = 'confirm'
    d.innerHTML = `
      <form method="dialog">
        <div class="cbody">
          <div class="ceyebrow">Not the recommended option</div>
          <div class="cq">${md(question)}</div>
          <div class="ca">→ ${md(answer)}</div>
          <div class="cnote">This is recorded as your ruling the moment you
            confirm, and acted on. Nothing happens if you cancel.</div>
        </div>
        <div class="cbtns">
          <button value="cancel">Cancel</button>
          <button value="confirm" class="go">Confirm this choice</button>
        </div>
      </form>`
    document.body.appendChild(d)
    // close fires for every dismissal path, including Escape, so one listener
    // covers cancel, confirm and dismiss without a second code path.
    d.addEventListener('close', () => {
      const ok = d.returnValue === 'confirm'
      d.remove()
      resolve(ok)
    }, { once: true })
    d.showModal()
    d.querySelector('button.go').focus()
  })
}

// This page appends a free-text escape hatch to every question, always. An
// agent that also writes one into narrative.json therefore renders it twice —
// which kept happening, because "offer a way out of my own options" is exactly
// the instinct a careful author has. Telling the author to stop is a rule they
// must remember on every question; dropping the duplicate here is a property
// of the board.
//
// The built-in one wins, and not arbitrarily: it carries `data-other="1"`, so
// it is the only one wired to the handler that actually opens the write-in
// prompt. An authored copy is an inert button that records its own label as
// the answer — so the duplicate is not merely ugly, it is the one a reader is
// most likely to press and the one that does the wrong thing.
// The two failure modes here are not symmetric, and that decides the rule.
// Leaving a duplicate is visible and merely untidy. Filtering a real option is
// SILENT — it removes a choice the owner was supposed to see, and nobody finds
// out. So this matches narrowly and deliberately under-reaches: a bare `other`
// prefix is not enough (an option like "Other agents should handle it" is a
// real answer), and anything long enough to be a genuine sentence is kept.
// A missed duplicate costs a redundant button; a false positive costs a
// decision.
const OTHER_PREFIXES = [
  'somethingelse', 'noneofthese', 'noneoftheabove', 'writemyown', 'letmewrite',
]
const normalise = s => String(s || '').toLowerCase().replace(/[^a-z]/g, '')
const isEscapeHatch = label => {
  const n = normalise(label)
  // 40 normalised characters is comfortably past "somethingelseletmewriteit"
  // (25) and short of any real sentence an author would write.
  return n.length <= 40 && OTHER_PREFIXES.some(p => n.startsWith(p))
}
const authoredOptions = q => (q.options || []).filter(raw =>
  !isEscapeHatch(typeof raw === 'string' ? raw : (raw && raw.label) || ''))

// The whole question, for thinking about away from the screen or forwarding
// to someone else. Options are numbered so they can be referred to by number,
// and the recommendation is carried across — it is part of the question.
const questionText = (project, q) => [
  `[${project} board] ${q.q}`,
  ...(q.why ? ['', q.why] : []),
  '',
  'Options:',
  ...authoredOptions(q).map((raw, i) => {
    const o = typeof raw === 'string' ? { label: raw } : raw
    const mark = o.recommend ? '  ← my pick' : ''
    const why = o.recommend && o.why ? `\n   ${o.why}` : ''
    return `${i + 1}. ${o.label}${mark}${why}`
  }),
].join('\n').trim()

// An image-bearing decision splits looking from choosing. `optReview` is
// pure information — nothing in it records an answer, so nothing in it
// needs a confirmation gate. `choiceButtons` is where a tap acts, and reuses
// `.opt` unchanged (same class the text-only path uses) so the existing
// click handler, the recommended-pill exemption and the divergence dialog
// all keep working without a single line of JS changing for this case. The
// only visual difference on the button is the icon column: `.opt.idbtn`
// swaps the decorative "↩" for the real `.optid` digit, so the answer that
// got recorded is still legible on its own, scrolled away from the picture
// that explained it.
function optReview(opts){
  return `<ol class="optreview">${opts.map((raw, i) => {
    const o = typeof raw === 'string' ? { label: raw } : raw
    const id = i + 1
    return `<li>
      <span class="optid${o.recommend ? ' rec' : ''}">${id}</span>
      <div class="optreview-body">
        <div class="optreview-lab">${md(o.label)}${o.recommend ? '<span class="rectag">Recommended</span>' : ''}</div>
        ${o.why ? `<div class="rsn">${md(o.why)}</div>` : ''}
        ${o.shot ? `<a class="optshotlink" href="shot/${encodeURIComponent(o.shot)}" target="_blank" rel="noopener">
          <img class="optshot" src="shot/${encodeURIComponent(o.shot)}" loading="lazy" alt="${esc(o.label)}">
          <span class="optshot-badge${o.recommend ? ' rec' : ''}">${id}</span>
        </a>` : ''}
      </div>
    </li>`
  }).join('')}</ol>`
}

function choiceButtons(q, opts, project){
  return `<div class="opts">${opts.map((raw, i) => {
    const o = typeof raw === 'string' ? { label: raw } : raw
    return `<button class="opt idbtn${o.recommend ? ' rec' : ''}"
        data-project="${esc(project)}" data-q="${esc(q.q)}" data-a="${esc(o.label)}"
        data-rec="${o.recommend ? '1' : '0'}">
      <span class="optid${o.recommend ? ' rec' : ''}">${i + 1}</span>
      <span class="lab">${md(o.label)}</span>
      ${o.recommend
        ? '<span class="pick" data-copied="Copied ✓" title="Records immediately — the only click that skips confirmation">I&rsquo;d pick this</span>'
        : '<span></span>'}
    </button>`
  }).join('')}<button class="opt other" data-rec="0" data-other="1"
      data-project="${esc(project)}" data-q="${esc(q.q)}" data-a="">
    <span class="lab">Something else — let me write it</span>
    <span></span>
    <span class="rsn">None of these fit, or the real answer is a
      qualification rather than a choice.</span>
  </button></div>`
}

function asks(list, project){
  if(!has(list)) return ''
  return list.map((q, qi) => {
    const opts = authoredOptions(q)
    const hasShots = opts.some(raw => (typeof raw === 'string' ? null : raw)?.shot)
    if(!hasShots){
      // Verbatim from before image-bearing decisions got a second layout —
      // not refactored to share code with the branch below, on purpose:
      // sharing a template across two different indentation contexts is
      // exactly how "semantically the same" quietly stops being "the same
      // bytes". A text-only decision must render identically to what
      // shipped before this redesign, so this stays a literal copy rather
      // than a call through a shared helper.
      return `<div class="card ask">
    <div class="t">${md(q.q)}</div>
    ${q.why ? `<div class="d">${md(q.why)}</div>` : ''}
    <div class="opts">${opts.map(raw => {
      const o = typeof raw === 'string' ? { label: raw } : raw
      // Question and answer ride as separate attributes and are joined on
      // click — a newline inside an HTML attribute does not survive reliably.
      return `<button class="opt${o.recommend ? ' rec' : ''}"
          data-project="${esc(project)}" data-q="${esc(q.q)}" data-a="${esc(o.label)}"
          data-rec="${o.recommend ? '1' : '0'}">
        <span class="lab">${md(o.label)}</span>
        ${o.recommend
          ? '<span class="pick" data-copied="Copied ✓" title="Records immediately — the only click that skips confirmation">I&rsquo;d pick this</span>'
          : '<span></span>'}
        ${o.why ? `<span class="rsn">${md(o.why)}</span>` : ''}
      </button>`
    }).join('')}<button class="opt other" data-rec="0" data-other="1"
        data-project="${esc(project)}" data-q="${esc(q.q)}" data-a="">
      <span class="lab">Something else — let me write it</span>
      <span></span>
      <span class="rsn">None of these fit, or the real answer is a
        qualification rather than a choice.</span>
    </button></div>
    <button class="copyq" data-question="${qi}">Copy the question with all ${opts.length} options</button>
  </div>`
    }
    // Image-bearing: look, then choose — see optReview()/choiceButtons() above.
    return `<div class="card ask">
    <div class="t">${md(q.q)}</div>
    ${q.why ? `<div class="d">${md(q.why)}</div>` : ''}
    ${optReview(opts)}
    <div class="choicerow">
      <p class="choicerow-label">Your choice</p>
      ${choiceButtons(q, opts, project)}
    </div>
    <button class="copyq" data-question="${qi}">Copy the question with all ${opts.length} options</button>
  </div>`
  }).join('')
}

// Plain text for a human who has never seen this board — no project tag, no
// arrows, nothing that reads as machine output. It is going into a message
// to a coach, not back into a CLI.
const handoffText = h => [
  h.subject || '',
  '',
  ...(h.points || []).map((p, i) => `${i + 1}. ${p.q}${p.detail ? ` — ${p.detail}` : ''}`),
  ...(h.flag ? ['', h.flag] : []),
].join('\n').trim()

// A handoff was the one section with no way to become false and no way to
// become finished — present-tense ("you still need to carry this"), with no
// `since`, no ageing, no resolved state. Everything else on the page is
// either derived per request (cannot go stale) or dated (visibly ages) or
// explicitly resolved (`decisions` -> `answered`, so a question cannot
// silently vanish or silently persist). This closes the same gap for an
// errand: `h.since` ages it live, the same mechanism as `inFlight`, and
// `h.resolved` lets it be finished without deleting the card — same
// argument as `answered`: a completed errand that just disappears reads as
// one that was lost, and the owner cannot tell whether it registered.
// (HANDOFF_STALE_AFTER_MIN's own value and reasoning live next to
// UNCONFIRMED_AFTER_MIN, above — both thresholds feed the one shared
// ageChipState() helper, so they are declared together.)

function handoffs(list){
  if(!has(list)) return ''
  return list.map((h, idx) => {
    if(h.resolved){
      return `<div class="card ho done">
        <div class="to">For ${esc(h.to || 'someone else')}</div>
        <div class="t">${md(h.subject || '')}</div>
        <div class="chose">${md(h.resolved.note || 'Done')}</div>
        ${h.resolved.when ? `<div class="when">${esc(h.resolved.when)}</div>` : ''}
      </div>`
    }
    // `since` is optional (old boards have handoffs with neither field),
    // so an absent one makes no age claim at all — same rule as inFlight's
    // `minsSince`, and for the same reason: silence beats a wrong guess.
    // `data-since`/`data-kind` are what let tickAges() re-date this exact
    // chip later without a full rebuild.
    const state = ageChipState('handoff', h.since)
    const age = state
      ? `<span class="agechip${state.old ? ' stale' : ''}" data-since="${esc(h.since)}" data-kind="handoff">${esc(state.text)}</span>`
      : ''
    return `<div class="card ho${state?.old ? ' unconfirmed' : ''}">
    <div class="to">For ${esc(h.to || 'someone else')}</div>
    <div class="t">${md(h.subject || '')}${age}</div>
    ${h.why ? `<div class="d">${md(h.why)}</div>` : ''}
    <ol>${(h.points || []).map(p => `<li><div>
      <div class="pt">${md(p.q)}</div>
      ${p.detail ? `<div class="pd">${md(p.detail)}</div>` : ''}
    </div></li>`).join('')}</ol>
    ${h.flag ? `<div class="flag">${md(h.flag)}</div>` : ''}
    <button class="send" data-handoff="${idx}">Copy as a message</button>
  </div>`
  }).join('')
}

// The ticking parts, refreshed every poll without touching anything the
// reader might be interacting with. No inputs live in here.
function renderClocks(r){
  const f = r.freshness || {}
  const written = ago(f.narrativeAgeMin)
  const measured = ago(f.checksAgeMin)
  const stale = c => (f.narrativeAgeMin ?? 0) > 25 ? `<span class="stale">${c}</span>` : c

  // Age is a hint; this is proof. Commits landing after the last narrative
  // rewrite mean the words below describe a repo that has since moved — and
  // the page is already showing that newer SHA a few lines up. Elapsed minutes
  // never caught this, because a narrative written two minutes ago can be
  // wrong the moment a teammate commits.
  const moved = f.commitsSinceNarrative
  const drift = moved && moved.commitsSince > 0
    ? `<span class="stale">· ${moved.commitsSince} commit${moved.commitsSince === 1 ? '' : 's'} since these words${moved.newest ? `: ${esc(moved.newest)}` : ''}</span>`
    : ''

  document.getElementById('stamp').innerHTML =
    (written ? stale(`written ${esc(written)}`) : 'written —') +
    (measured ? `<i>·</i>suite measured ${esc(measured)}` : '') +
    '<i>·</i>git read live' + drift

  // Who moved, and when — from transcript mtimes, so an agent that goes quiet
  // without reporting still shows up honestly as "quiet for 40 min".
  document.getElementById('teamblock').innerHTML = has(r.team) ? block('Who moved',
    `<ul class="crew">${r.team.map(t => `<li class="${t.lastMin < 5 ? 'warm' : ''}">
      <span class="nm">${esc(t.who)}</span>
      <span class="mdl">${esc(t.model)}</span>
      <span class="last">${esc(ago(t.lastMin))}</span>
      <span class="knd">${esc(t.kind)}</span>
    </li>`).join('')}</ul>`) : ''
}

// Ages tick from `since` alone, every poll, independent of whether anything
// else on the board changed — because "nothing else changed" is exactly the
// case this exists for: an idle board where an agent quietly stopped and no
// one is writing. `stableKey` deliberately skips a full render() when the
// JSON is byte-identical poll to poll (it exists so the server's own clock
// fields do not cause a pointless repaint — that protection stays, and this
// does not touch it). But an age chip lives inside a card render() built,
// so on an unchanging board it was going stale in the one silent way this
// entire mechanism exists to prevent: measured directly, not assumed — 10
// real seconds and three 3000ms poll cycles produced zero renders and a
// chip frozen at "logged 6 min ago" until an unrelated field changed on
// disk. This patches the chip's text and the card's stale styling in
// place, exactly like renderClocks patches the freshness stamp above:
// nothing is torn down, so scroll position, open/closed sections and any
// in-progress typing survive untouched — the cost this function must not
// have, which a render()-on-a-timer would.
function tickAges(r){
  document.querySelectorAll('.agechip[data-since]').forEach(chip => {
    const state = ageChipState(chip.dataset.kind, chip.dataset.since)
    if(!state) return
    chip.textContent = state.text
    chip.classList.toggle('stale', state.old)
    chip.closest('.card')?.classList.toggle('unconfirmed', state.old)
  })
  // The section heading is its own claim ("Running now"), not just a label
  // over the cards — 0.4.0's own point was that a confident header over
  // hedged cards is still a confident page. Recomputed from the real data
  // via the same inFlightLabel() render() itself uses, not re-derived from
  // the chips just patched above, so the two can never disagree.
  const sec = document.getElementById('sec-inflight')
  if(sec){
    const text = inFlightLabel(r.inFlight)
    const label = sec.querySelector('.sec-label')
    if(label) label.textContent = text
    sec.dataset.sec = text   // keeps the fold-open persistence key matching what is actually shown
  }
}

function render(r){
  document.getElementById('project').textContent = (r.project || 'project').toUpperCase()
  // The tab is how the owner tells two boards apart when both are open, so it
  // has to come from the report like everything else. It was static markup
  // until 1 Aug 2026 and named whichever project the board was built in.
  document.title = (r.project || 'status') + ' — status'
  document.getElementById('headline').textContent = r.headline || ''

  document.getElementById('kv').innerHTML = Object.entries(r.state || {}).map(([k, v]) =>
    `<dt class="k">${esc(k)}</dt><dd class="v ${tone(v)}">${esc(String(v))}</dd>`).join('')

  const p = r.pipeline
  document.getElementById('pipeblock').innerHTML = p ? block(p.title,
    `<ol class="spine">${p.steps.map(s => `<li class="rung ${esc(s.status)}">
        <span class="pip"></span><span class="nm">${md(s.name)}</span>
        <span class="st">${esc(s.status)}</span></li>`).join('')}</ol>`,
    sectionChip(r, 'pipeline')) : ''

  const commits = (r.held || []).map(c =>
    `<li><span class="sha">${esc(c.sha)}</span><span>${md(c.what)}</span></li>`).join('')

  const n = k => (r[k] || []).length

  document.getElementById('body').innerHTML =
    (r.error ? `<div class="card ask"><div class="t">The board could not build its report</div>
      <div class="d">${md(r.error)}</div>
      <div class="n">Fix the narrative file or restart <code>serve.py</code>. Everything below may be out of date.</div></div>` : '') +
    fold('Needs you — tap to copy the question and your answer',
         asks(r.decisions, r.project || 'project'), n('decisions'), { never: true }) +
    fold('To take elsewhere', handoffs(r.handoffs), n('handoffs')) +
    // The heading changes with the claim's age, because "Running now" is a
    // present-tense assertion the page has no way to check. Once entries go
    // unconfirmed the section stops asserting in its own title too — a
    // confident header above hedged cards is still a confident page.
    fold(inFlightLabel(r.inFlight), cards(r.inFlight), n('inFlight'), { id: 'inflight', chip: sectionChip(r, 'inFlight') }) +
    fold('Held, unpushed', commits
      ? `<ul class="commits">${commits}</ul>` +
        (r.whyHeld ? `<div class="why">${md(r.whyHeld)}</div>` : '') : '', n('held')) +
    fold('Worth knowing', cards(r.findings), n('findings')) +
    // Decided folds soonest — it only grows, and it is history, not work.
    fold('Decided', (r.answered || []).map(a => `<div class="card done">
      <div class="t">${md(a.q)}</div>
      <div class="chose"><span class="chosetxt">${md(a.chose)}</span></div>
      ${a.truncated ? `<div class="trunc">⚠ cut at ${esc(String(a.truncatedAt))} of
        ${esc(String(a.originalLength))} characters — this is not the whole
        answer, read it from <code>answers.json</code></div>` : ''}
      ${a.note ? `<div class="n">${md(a.note)}</div>` : ''}
      ${a.when ? `<div class="when">${esc(a.when)}</div>` : ''}
    </div>`).join(''), n('answered'), { openBelow: 1 })

  // Remember what the reader opened; re-renders happen every few seconds and
  // must not snap a section shut under them.
  document.querySelectorAll('details.sec').forEach(d => {
    d.addEventListener('toggle', () => {
      try { localStorage.setItem('board.open.' + d.dataset.sec, d.open ? '1' : '0') } catch (e) {}
    })
  })

  renderBacklog(r)

  document.querySelectorAll('[data-question]').forEach(b => {
    b.onclick = async () => {
      const q = (r.decisions || [])[+b.dataset.question]
      let ok = true
      try {
        await navigator.clipboard.writeText(questionText(r.project || 'project', q))
      } catch (e) { ok = false }
      toast(ok ? 'Question and options copied' : 'Copy blocked by the browser')
    }
  })

  document.querySelectorAll('[data-handoff]').forEach(b => {
    b.onclick = async () => {
      const text = handoffText((r.handoffs || [])[+b.dataset.handoff] || {})
      let ok = true
      try { await navigator.clipboard.writeText(text) } catch (e) { ok = false }
      toast(ok ? 'Copied — ready to send' : 'Copy blocked by the browser')
    }
  })

  document.querySelectorAll('.opt').forEach(b => {
    b.onclick = async (ev) => {
      // The exemption belongs to the PILL, not to the option.
      //
      // Recording an answer is consequential — the agent acts on it — so the
      // only click that skips confirmation is one that cannot plausibly be an
      // accident: a hit on the small "I'd pick this" pill of the recommended
      // option. The row around it is a large target; landing on its label,
      // its reason text or its padding confirms like any other choice.
      //
      // Owner's rule, 1 Aug 2026. The earlier version exempted the whole
      // recommended row, which made the easiest thing to hit by mistake also
      // the only thing that recorded without asking.
      const viaPill = ev.target instanceof Element && !!ev.target.closest('.pick')
      const instant = b.dataset.rec === '1' && viaPill

      let answer = b.dataset.a
      if (b.dataset.other === '1') {
        answer = await promptOther(b.dataset.q)
        if (!answer) return          // cancelled, or nothing typed
      } else if (!instant && !(await confirmDivergence(b.dataset.q, answer))) {
        return
      }

      const text = replyText(b.dataset.project, b.dataset.q, answer)
      let ok = true
      try { await navigator.clipboard.writeText(text) } catch (e) { ok = false }
      if(!ok){
        // Clipboard can be blocked. Select the text so it is still copyable
        // by hand rather than claiming a copy that never happened.
        const ta = document.createElement('textarea')
        ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'
        document.body.appendChild(ta); ta.select()
        try { ok = document.execCommand('copy') } catch (e) { ok = false }
        ta.remove()
      }
      b.classList.add('copied')
      toast(ok ? 'Copied with the question — just paste it' : 'Copy blocked — select the text by hand')
      setTimeout(() => b.classList.remove('copied'), 1700)

      // Record it server-side too, so the question leaves "Needs you" on the
      // next poll whether or not I remember to move it. The copy is for me;
      // this is so the board stops asking you something you have answered.
      //
      // A non-2xx response does NOT throw — fetch() only rejects on a
      // network failure, so a bare `try { await fetch(...) } catch {}`
      // treats a rejected answer exactly like a recorded one: nothing tells
      // the owner it did not stick. Verified live (2 Aug 2026): the server's
      // own body-size cap rejected a real answer with a 400, and this code,
      // unchanged, proceeded as if it had succeeded — the question would
      // have kept reappearing as "Needs you" with no explanation. The
      // clipboard copy above is not a substitute for this check; it is the
      // fallback THIS failure needs, and it only works if the owner is told
      // to use it.
      try {
        const res = await fetch('answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ q: b.dataset.q, answer }),
        })
        if (res.ok) {
          last = ''
          setTimeout(poll, 1800)
        } else {
          // The server's own error strings (record_answer's ValueErrors) are
          // already full sentences ending in a period; the generic
          // `HTTP ${status}` fallback is not. Stripping any trailing period
          // before adding our own avoids "...bytes.. Still on your
          // clipboard" — caught by actually reading the rendered toast, not
          // by inspecting the template.
          let reason = `HTTP ${res.status}`
          try { const j = await res.json(); if (j && j.error) reason = j.error } catch (e) {}
          reason = reason.replace(/\.+$/, '')
          toast(`NOT recorded on the board — ${reason}. Still on your clipboard — paste it into chat so it is not lost.`, 'error')
        }
      } catch (e) {
        toast('NOT recorded — could not reach the board server. Still on your clipboard — paste it into chat so it is not lost.', 'error')
      }
    }
  })
}

// Every field on this page is re-fetched on a 3s tick, so a commit by any
// teammate, or a narrative I rewrite, appears without anyone refreshing. The
// server re-derives git per request; nothing here is cached.
//   - `updatedAt` changes every request, so it is stripped before comparing;
//     otherwise the page would re-render 20 times a minute and lose focus.
//   - Coming back to the tab re-reads immediately rather than waiting out
//     the tick, and browsers throttle timers in hidden tabs anyway.
const POLL_MS = 3000

// Fields that change on EVERY request because they are ages in minutes.
// Comparing raw text meant the key never matched, so the whole board was
// rebuilt every 3s — which wiped the compose form mid-typing. Strip the
// clocks; rebuild only when something real changes.
function stableKey(txt){
  try {
    const c = JSON.parse(txt)
    delete c.updatedAt
    delete c.freshness
    ;(c.team || []).forEach(t => { delete t.lastMin })
    ;(c.backlog || []).forEach(b => { delete b.ageDays })
    return JSON.stringify(c)
  } catch (e) {
    return txt   // unparseable: fall back to text, so errors still surface
  }
}

// Grouped by what the item is waiting on, because that is what decides
// whether you can act on it — not by which document it came from.
const GROUPS = [
  ['needs-triage', 'Added by you'],
  ['needs-you',    'Waiting on you'],
  ['ready',        'Ready to pick up'],
  ['unverified',   'Nobody has looked'],
  ['unowned',      'No owner'],
]
const agedays = d => d == null ? '' : d < 1 ? 'today' : `${Math.round(d)}d old`

function renderBacklog(r){
  const items = r.backlog || []

  // A real content change (someone adds an item) still rebuilds this rail.
  // Carry the compose box across it: an open form and half-typed text must
  // survive, or the board eats your work while you are writing it.
  const prev = document.getElementById('compose')
  const keep = prev ? {
    open:  prev.classList.contains('open'),
    title: document.getElementById('ttl')?.value || '',
    kind:  document.getElementById('kind')?.value || 'task',
    notes: document.getElementById('notes')?.value || '',
    focus: document.activeElement?.id || null,
  } : null
  const groups = GROUPS.map(([key, label]) => {
    const rows = items.filter(i => (i.state || 'unowned') === key)
    if(!rows.length) return ''
    return `<p class="grp">${esc(label)} · ${rows.length}</p><ul class="bl">${rows.map(i => `
      <li class="${i.source === 'you' ? 'mine' : ''}">
        <div class="ttl">${md(i.title || '')}</div>
        <div class="meta">
          ${i.code ? `<span class="code">${esc(i.code)}</span>` : ''}
          ${i.source === 'you' ? '<span class="from">from you</span>' : ''}
          ${i.notes ? `<span>${md(i.notes)}</span>` : ''}
          <span>${esc(agedays(i.ageDays))}</span>
          ${i.source === 'you' ? `<button class="done" data-done="${esc(i.id)}"
              title="Mark done">done</button>` : ''}
        </div>
      </li>`).join('')}</ul>`
  }).join('')

  document.getElementById('parked').innerHTML = `
    <div class="bl-head">
      <p class="eyebrow">Backlog · ${items.length}</p>
      <button class="addbtn" id="addtoggle">+ Add</button>
    </div>
    <form class="compose" id="compose">
      <div class="err" id="composeErr"></div>
      <input id="ttl" placeholder="What needs doing?" maxlength="300" required>
      <select id="kind">
        <option value="task">Task</option>
        <option value="bug">Bug</option>
        <option value="idea">Idea</option>
        <option value="question">Question</option>
      </select>
      <textarea id="notes" placeholder="Anything I would need to know (optional)"></textarea>
      <div class="row">
        <button type="submit" class="save">Add to backlog</button>
        <button type="button" class="cancel" id="composeCancel">Cancel</button>
      </div>
    </form>
    ${groups || '<p class="grp">Nothing parked</p>'}`

  const form = document.getElementById('compose')

  if(keep && (keep.open || keep.title || keep.notes)){
    form.classList.toggle('open', keep.open)
    document.getElementById('ttl').value = keep.title
    document.getElementById('kind').value = keep.kind
    document.getElementById('notes').value = keep.notes
    if(keep.focus) document.getElementById(keep.focus)?.focus()
  }

  document.getElementById('addtoggle').onclick = () => {
    form.classList.toggle('open')
    if(form.classList.contains('open')) document.getElementById('ttl').focus()
  }
  document.getElementById('composeCancel').onclick = () => form.classList.remove('open')

  form.onsubmit = async e => {
    e.preventDefault()
    const err = document.getElementById('composeErr')
    err.textContent = ''
    try {
      const res = await fetch('backlog', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: document.getElementById('ttl').value,
          kind:  document.getElementById('kind').value,
          notes: document.getElementById('notes').value,
        }),
      })
      const out = await res.json()
      if(!out.ok) throw new Error(out.error || 'The board would not save it.')
      form.reset(); form.classList.remove('open')
      last = ''; poll()   // force a re-render; the new item is on disk now
      toast('Added — I read this file, no need to paste it')
    } catch (ex) {
      err.textContent = ex.message   // say what went wrong, keep what was typed
    }
  }

  document.querySelectorAll('[data-done]').forEach(b => {
    b.onclick = async () => {
      await fetch('backlog', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: b.dataset.done, state: 'done' }),
      })
      last = ''; poll()
    }
  })
}

// kind: 'error' gets the red styling and a longer display — a failed
// recording is the one toast on this page that must not be missed, and it
// carries more to read (the reason, plus what to do about it) than "Copied".
//
// A single tracked timer, not a bare setTimeout: the "Copied..." toast for
// this same click already fires before the fetch that can produce an error
// toast, so on every failed submission two toast() calls land close
// together. Two independent setTimeouts each hide the class on their own
// clock — the first one's (2200ms, scheduled at the earlier call) would fire
// while the second, longer-lived error toast is still supposed to be
// showing, cutting it short. Clearing the previous timer on every call makes
// only the latest call's duration win, which is what "the owner must be
// told" requires in practice, not just as a claim.
let toastTimer = null
function toast(msg, kind){
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.toggle('err', kind === 'error')
  t.classList.add('on')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => t.classList.remove('on'), kind === 'error' ? 5000 : 2200)
}

let last = ''
let inflight = false

async function poll(){
  if(inflight) return
  inflight = true
  const tick = document.getElementById('tick'), beacon = document.getElementById('beacon')
  try {
    const res = await fetch('report.json?t=' + Date.now(), { cache: 'no-store' })
    const txt = await res.text()
    const data = JSON.parse(txt)
    const key = stableKey(txt)
    if(key !== last){ last = key; render(data) }
    renderClocks(data)   // ages tick every poll; the rest only when it changes
    tickAges(data)        // same reason: an idle board is exactly when a card's own age must not freeze
    tick.textContent = res.ok ? 'live' : 'error'
    beacon.classList.toggle('off', !res.ok)
  } catch (e) {
    tick.textContent = 'offline'; beacon.classList.add('off')
  } finally {
    inflight = false
  }
}

initRails()
poll()
setInterval(poll, POLL_MS)
document.addEventListener('visibilitychange', () => { if(!document.hidden) poll() })
window.addEventListener('focus', poll)
</script>
</body>
</html>
