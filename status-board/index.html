    row.n += 1
    seen.set(key, row)
  }
  return [...seen.values()].sort((a, b) =>
    KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind) || a.word.localeCompare(b.word))
}

function workerChips(workers){
  return workers.map(t => `<span class="wchip">${dot(t)}<b>${esc(t.who)}</b>${esc(t.state || '')} ${movedSpan(t)}</span>`).join('')
}

function wsDetail(item, workers, r){
  const row = (label, text, quiet) => text
    ? `<div><dt>${esc(label)}</dt><dd${quiet ? ' class="quiet"' : ''}>${mdBlock(text)}</dd></div>` : ''
  const kind = statusKind(item.status)
  const orcaKnown = r.orca && r.orca.known
  let crew = ''
  if(workers.length){
    crew = `<div><dt>Workers on it</dt><dd>${workers.map(t =>
      `${esc(t.who)}, ${esc(t.state || 'state unknown')}, ${movedSpan(t)}${t.title ? `<br><span class="quiet">${esc(t.title)}</span>` : ''}`).join('<br>')}
      ${kind !== 'active' ? '<br><span class="quiet">A worker carries this id, and the status above is not Active.</span>' : ''}</dd></div>`
  } else if(kind === 'active' && orcaKnown && item.id){
    crew = `<div><dt>Workers on it</dt><dd class="quiet">No Orca worker carries ${esc(item.id)} in its task title. The coordinator may be working on it itself.</dd></div>`
  }
  return `<dl class="ws-detail">
    ${row('Goal', item.goal)}
    ${row('Where it stands', item.stands)}
    ${row('Next step', item.next)}
    ${row('Forecast', item.forecast)}
    ${(item.details || []).map(d => row(d.label, d.text)).join('')}
    ${row('Record', item.record, true)}
    ${crew}
  </dl>`
}

function wsHtml(r){
  const w = r.workstreams
  if(!w) return ''
  const groups = w.groups || []
  const items = groups.flatMap(g => g.items || [])
  const stats = statusStats(items)
  const filter = stats.some(s => s.key === ui.wsFilter) ? ui.wsFilter : ''
  const team = r.team || []
  const onIt = item => item.id ? team.filter(t => (t.ws || []).includes(item.id)) : []

  const drift = w.sourceCheck && w.sourceCheck.aheadMin > 0
    ? `<p class="warnnote"><code>${esc(w.source)}</code> changed ${esc(duration(w.sourceCheck.aheadMin))} after this board was last written. The list below may be behind it.</p>` : ''
  const unread = has(w.unread)
    ? `<p class="warnnote">This list carries fields the page does not read: ${w.unread.map(k => `<code>${esc(k)}</code>`).join(', ')}. See the skill for the names it does.</p>` : ''
  const skipped = w.skipped
    ? `<p class="warnnote">${plural(w.skipped, 'row')} in this list ${w.skipped === 1 ? 'has' : 'have'} neither an <code>id</code> nor a <code>name</code> and ${w.skipped === 1 ? 'is' : 'are'} not shown.</p>` : ''
  const lostGroups = w.skippedGroups
    ? `<p class="warnnote">${plural(w.skippedGroups, 'group')} in this list could not be read: a group is an object with an <code>items</code> list.</p>` : ''
  const error = w.error ? `<p class="warnnote">${md(w.error)}</p>` : ''
  // How old the list is and where it is copied from: a caption under the
  // title, so the title row is the same height in both panels.
  const caption = `${sectionChip(r, 'workstreams', 'list')}${w.source ? `<span>from <code>${esc(w.source)}</code></span>` : ''}`

  const body = groups.map(g => {
    const shown = (g.items || []).filter(i => !filter || statusKey(i.status) === filter)
    if(!shown.length) return ''
    return `<section class="ws-group">
      ${g.name ? `<h3>${md(g.name)}</h3>` : ''}
      ${g.note && !filter ? `<p class="ws-gnote${ui.noteOpen.has(g.name) ? '' : ' clamp'}" data-clamp="note">${mdl(g.note)}</p>
        <button class="linkish gnote-more" data-note="${esc(g.name)}"${ui.noteOpen.has(g.name) ? '' : ' hidden'}>${ui.noteOpen.has(g.name) ? 'Show less' : 'Read the note'}</button>` : ''}
      <ul class="ws-list">${shown.map(item => {
        const key = wsKey(item)
        const open = ui.wsOpen.has(key)
        const workers = onIt(item)
        return `<li class="ws k-${statusKind(item.status)}${open ? ' open' : ''}" data-ws="${esc(key)}">
          <button class="ws-row" data-openws="${esc(key)}" aria-expanded="${open}">
            <span class="ws-id">${esc(item.id || '')}</span>
            <span class="ws-name">${md(item.name || item.id)}</span>
            ${statusTag(item.status)}
            <span class="ws-chev" aria-hidden="true"></span>
            ${item.next ? `<span class="ws-next"><b>Next</b>${md(item.next)}</span>` : ''}
            ${workers.length ? `<span class="ws-crew">${workerChips(workers)}</span>` : ''}
          </button>
          ${open ? wsDetail(item, workers, r) : ''}
        </li>`
      }).join('')}</ul>
    </section>`
  }).join('')

  return `<header class="pane-head">
      <span class="pane-title"><h2>${esc(w.title || 'Workstreams')}</h2><span class="count">${items.length}</span></span>
    </header>
    ${caption ? `<p class="pane-extra">${caption}</p>` : ''}
    ${items.length ? `<div class="ws-top">
      <div class="meter" aria-hidden="true">${stats.map(s => `<i class="k-${s.kind}" style="flex:${s.n} 1 0" title="${esc(s.word)}: ${s.n}"></i>`).join('')}</div>
      <div class="filters" role="group" aria-label="Show workstreams by status">
        <button class="fchip" data-status="" aria-pressed="${!filter}">All <b>${items.length}</b></button>
        ${stats.map(s => `<button class="fchip k-${s.kind}" data-status="${esc(s.key)}" aria-pressed="${filter === s.key}">${GLYPH[s.kind]}${esc(s.word)} <b>${s.n}</b></button>`).join('')}
      </div>
      ${w.note ? `<p class="ws-note${ui.listNoteOpen ? '' : ' clamp'}" data-clamp="note">${mdl(w.note)}</p>
        <button class="linkish" data-listnote${ui.listNoteOpen ? '' : ' hidden'}>${ui.listNoteOpen ? 'Show less' : 'Read the note'}</button>` : ''}
      ${drift}${unread}${skipped}${lostGroups}
    </div>` : ''}
    ${error ? `<div class="ws-top">${error}${unread}${skipped}${lostGroups}</div>` : ''}
    ${body}`
}

// ── second rank ───────────────────────────────────────────────────────
const SEV = { high: ['blocked', 'high'], med: ['waiting', 'medium'], medium: ['waiting', 'medium'],
  warn: ['waiting', 'warning'], ok: ['done', 'ok'], info: ['active', 'info'] }

// What the reader unfolded is remembered by section, by title and, among
// entries of one title, by place. Two cards with no title, or one title in
// two sections, used to share a key, and opening one opened the other.
const foldKeys = (section, list, titleOf) => {
  const seen = new Map()
  return list.map(x => {
    const title = String(titleOf(x) || ''), nth = seen.get(title) || 0
    seen.set(title, nth + 1)
    return `${section}:${nth}:${title}`
  })
}

function cards(list, cls = '', section = ''){
  if(!has(list)) return ''
  const keys = foldKeys('card:' + section, list, x => x.what || x.title)
  return list.map((x, at) => {
    // `since` on an in-flight entry is when the work was said to have started.
    const sev = x.sev && SEV[String(x.sev).toLowerCase()]
    return `<div class="card ${cls}">
    <div class="t">${sev ? `<span class="sevtag k-${sev[0]}">${sev[1]}</span>` : ''}${md(x.what || x.title || '')}${ageChip('inflight', x.since)}</div>
    ${x.detail || x.d ? fold(keys[at], mdBlock(x.detail || x.d), 'd') : ''}
    ${shot(x.shot, x.what || x.title)}
    ${x.who ? `<div class="n">${mdBlock(x.who)}</div>` : ''}
    ${x.note ? `<div class="n">${mdBlock(x.note)}</div>` : ''}
  </div>`
  }).join('')
}

// Plain text for a human who has never seen this board: no project tag, no
// arrows, nothing that reads as machine output.
// The page numbers the points. A point an agent already numbered ("1. Sign
// in") would read "1. 1. Sign in", on the page and in the copied message.
const pointText = (text, i) => String(text == null ? '' : text)
  .replace(/^\s*(\d+)[.)]\s+/, (typed, n) => +n === i + 1 ? '' : typed)
// A point with no text is not a point. It used to be an empty row on the
// page and "3. null" in the copied message; it is now left out of both, and
// the page says how many were left out, the way it does for a question it
// cannot read. The points that remain are numbered in the order they are
// shown, the same on the page and in the message.
const hasText = v => v != null && String(v).trim() !== ''
const pointsOf = h => (h.points || []).filter(p => p && (hasText(p.q) || hasText(p.detail)))
const lostPoints = h => {
  const lost = (h.points || []).length - pointsOf(h).length
  return lost ? `<p class="warnnote">${plural(lost, 'point')} of this handoff ${lost === 1 ? 'has' : 'have'} no text and ${lost === 1 ? 'is' : 'are'} neither shown nor copied: each needs a <code>q</code>, written as text.</p>` : ''
}
const handoffText = h => [
  h.subject || '',
  '',
  ...pointsOf(h).map((p, i) => `${i + 1}. ${hasText(p.q) ? pointText(p.q, i) : ''}${p.detail ? `${hasText(p.q) ? ' — ' : ''}${p.detail}` : ''}`),
  ...(h.flag ? ['', h.flag] : []),
].join('\n').trim()

// `since` ages a handoff live and `resolved` closes it without deleting the
// card: a finished errand that just disappears reads as one that was lost.
function handoffs(list){
  if(!has(list)) return ''
  return list.map((h, idx) => {
    if(h.resolved){
      return `<div class="card ho done">
        <div class="to">For ${esc(h.to || 'someone else')}</div>
        <div class="t">${md(h.subject || '')}</div>
        <div class="chose">${mdBlock(h.resolved.note || 'Done')}</div>
        ${h.resolved.when ? `<div class="when">${esc(h.resolved.when)}</div>` : ''}
      </div>`
    }
    return `<div class="card ho">
    <div class="to">For ${esc(h.to || 'someone else')}</div>
    <div class="t">${md(h.subject || '')}${ageChip('handoff', h.since)}</div>
    ${h.why ? `<div class="d">${mdBlock(h.why)}</div>` : ''}
    <ol class="pts">${pointsOf(h).map((p, i) => `<li><div>
      ${hasText(p.q) ? `<div class="pt">${mdl(pointText(p.q, i))}</div>` : ''}
      ${p.detail ? `<div class="pd">${mdBlock(p.detail)}</div>` : ''}
    </div></li>`).join('')}</ol>
    ${lostPoints(h)}
    ${h.flag ? `<div class="flag">${mdBlock(h.flag)}</div>` : ''}
    <button class="btn send" data-handoff="${idx}">Copy as a message</button>
  </div>`
  }).join('')
}

// Grouped by what the item is waiting on, because that is what decides
// whether you can act on it — not by which document it came from.
const GROUPS = [
  ['needs-triage', 'Added by you'],
  ['needs-you',    'Waiting on you'],
  ['ready',        'Ready to pick up'],
  ['unverified',   'Nobody has looked'],
  ['unowned',      'No owner'],
]
const agedays = d => d == null ? '' : d < 1 ? 'today' : `${Math.round(d)}d old`

function backlogHtml(r){
  const items = r.backlog || []
  const known = GROUPS.map(g => g[0])
  // A state outside the five the board knows used to drop its row from the
  // list without a word. It now lands under its own name.
  // A state is a word. One that is a number, a list or an object is read
  // as the text it was written as, so its row is grouped and shown like any
  // other. (14 Nov 2026: `"state": 3` stopped the whole section from being
  // drawn, the owner's own items and "Add an item" with it.)
  const stateOf = i => {
    const s = i.state || 'unowned'
    return typeof s === 'string' ? s : typeof s === 'object' ? JSON.stringify(s) : String(s)
  }
  const foldKey = new Map(foldKeys('backlog', items, i => (i.id ? 'id ' : 'title ') + (i.id || i.title || ''))
    .map((key, at) => [items[at], key]))
  const others = [...new Set(items.map(stateOf).filter(s => !known.includes(s)))]
  const groups = [...GROUPS, ...others.map(s => [s, s])].map(([key, label]) => {
    const rows = items.filter(i => stateOf(i) === key)
    if(!rows.length) return ''
    // A state an agent made up is printed as it wrote it, with a capital.
    const name = label.charAt(0).toUpperCase() + label.slice(1)
    return `<p class="grp"><span>${esc(name)}</span><span class="count">${rows.length}</span></p><ul class="bl">${rows.map(i => `
      <li class="${i.source === 'you' ? 'mine' : ''}">
        <div class="ttl">${mdl(i.title || '')}</div>
        ${i.notes ? fold(foldKey.get(i), mdBlock(i.notes), 'note') : ''}
        <div class="meta">
          ${i.code ? `<span class="code">${esc(i.code)}</span>` : ''}
          ${i.source === 'you' ? '<span class="from">from you</span>' : ''}
          <span>${esc(agedays(i.ageDays))}</span>
          ${i.source === 'you' ? `<button class="donebtn" data-done="${esc(i.id)}">Mark done</button>` : ''}
        </div>
      </li>`).join('')}</ul>`
  }).join('')
  return `<div class="bl-head"><p>What is parked, and what you add yourself.</p>
      <button class="btn" id="addtoggle">Add an item</button></div>
    <form class="compose" id="compose">
      <div class="err" id="composeErr"></div>
      <input id="ttl" placeholder="What needs doing?" maxlength="300" required aria-label="What needs doing?">
      <select id="kind" aria-label="Kind of item">
        <option value="task">Task</option>
        <option value="bug">Bug</option>
        <option value="idea">Idea</option>
        <option value="question">Question</option>
      </select>
      <textarea id="notes" placeholder="Anything I would need to know (optional)" aria-label="Notes"></textarea>
      <div class="row">
        <button type="submit" class="btn go">Add to backlog</button>
        <button type="button" class="btn" id="composeCancel">Cancel</button>
      </div>
    </form>
    ${groups || '<p class="empty" style="padding:6px 0">Nothing parked.</p>'}`
}

// A <details> on this page is built once and owns its own open state from
// then on; only its summary and its body are painted. So opening a section
// repaints nothing, and a repaint never snaps one shut. The first time it has
// something to show it opens by the reader's remembered choice, or else by
// `defaultOpen`.
function paintDetails(d, [summary, body], defaultOpen){
  d.hidden = !summary
  if(!summary) return false
  if(!d.dataset.ready){
    d.dataset.ready = '1'
    const pref = store.get('sec.' + d.dataset.sec)
    d.open = pref === null ? !!defaultOpen : pref === '1'
  }
  paint(d.querySelector('summary'), summary)
  // Like the two panels: "Read all of it" in a card is replaced by "Show
  // less" when it is pressed, and the keyboard goes to the new button
  // instead of the top of the page.
  return paintKeepingFocus(d.querySelector('.body'), body)
}

// Second-rank sections start folded, so history never pushes the two main
// lists around. "Running now" is the exception while it is short: it is the
// one present-tense claim on the page, and it should be seen ageing.
const FOLD_OVER = 3
const secHead = (title, count, chip = '') =>
  `<span class="sec-label">${md(title)}</span><span class="sec-aside">${count ? `<span class="count">${count}</span>` : ''}${chip}</span>`

function paintMore(r){
  const n = k => (r[k] || []).length
  const p = r.pipeline
  // A contradiction, not an age: work is running while no pipeline step says
  // `running`. (12 Aug 2026: a new milestone started, inFlight was current,
  // and the rail went on describing yesterday's shipped work.)
  const railBlind = p && n('inFlight') > 0 && !(p.steps || []).some(s => s.status === 'running')
    ? `<p class="warnnote" style="margin:0 0 10px">${n('inFlight') === 1 ? '1 task is' : `${n('inFlight')} tasks are`} running,
        but no step here is. This list may describe an older milestone: rewrite the pipeline.</p>` : ''
  const PIPE = { shipped: 'done', held: 'waiting', running: 'active', todo: 'todo' }
  const pipe = p && has(p.steps) ? railBlind + `<ol class="spine">${p.steps.map(s => `<li class="rung ${esc(s.status || '')}">
      <span class="nm">${md(s.name)}</span>
      <span class="status k-${PIPE[s.status] || 'other'}">${GLYPH[PIPE[s.status] || 'other']}${esc(s.status || 'no status')}</span></li>`).join('')}</ol>` : ''

  const commits = (r.held || []).map(c =>
    `<li><span class="sha">${esc(c.sha)}</span><span>${md(c.what)}</span></li>`).join('')
  const findings = r.findings || []
  const someFindings = ui.all.has('findings') ? findings : findings.slice(0, SHORT_LIST)
  const facts = Object.entries(r.state || {}).map(([k, v]) =>
    `<dt>${esc(k)}</dt><dd class="${tone(v)}">${esc(String(v))}</dd>`).join('')

  const part = (title, count, inner, chip) => inner ? [secHead(title, count, chip), inner] : ['', '']
  const carried = (r.handoffs || []).filter(h => h && h.resolved).length
  paintDetails($('sec-inflight'),
    part(inFlightLabel(r.inFlight), n('inFlight'), cards(r.inFlight, '', 'inflight'), sectionChip(r, 'inFlight')),
    n('inFlight') <= FOLD_OVER)
  paintDetails($('sec-handoffs'), part('To take elsewhere', n('handoffs') - carried, handoffs(r.handoffs),
    carried ? `<span class="agechip">${carried} done</span>` : ''), false)
  paintDetails($('sec-held'), part('Held, unpushed', n('held'), commits
    ? `<ul class="commits">${commits}</ul>` + (r.whyHeld ? `<div class="why">${mdBlock(r.whyHeld)}</div>` : '') : ''), false)
  paintDetails($('sec-findings'), part('Worth knowing', findings.length, cards(someFindings, '', 'findings') +
    (findings.length > someFindings.length ? `<button class="linkish" data-all="findings">Show all ${findings.length}</button>` : '')),
    false)
  paintDetails($('sec-pipeline'),
    part(p && p.title ? p.title : 'Pipeline', p && p.steps ? p.steps.length : 0, pipe, sectionChip(r, 'pipeline')), false)
  paintDetails($('sec-facts'), part('Read from git, just now', 0, facts ? `<dl class="kv">${facts}</dl>` : ''), false)

  // The backlog holds the one form on the page. A repaint of it must carry an
  // open form and half-typed text across, or the board eats the owner's work
  // while they are writing it.
  const prev = $('compose')
  const keep = prev ? {
    open:  prev.classList.contains('open'),
    title: $('ttl').value, kind: $('kind').value, notes: $('notes').value,
    focus: document.activeElement && document.activeElement.id,
  } : null
  const repainted = paintDetails($('sec-backlog'), [secHead('Backlog', (r.backlog || []).length), backlogHtml(r)], false)
  if(repainted && keep && (keep.open || keep.title || keep.notes)){
    $('compose').classList.toggle('open', keep.open)
    $('ttl').value = keep.title
    $('kind').value = keep.kind
    $('notes').value = keep.notes
    if(keep.focus && $(keep.focus)) $(keep.focus).focus()
  }
  $('more-title').hidden = ![...document.querySelectorAll('#more details.sec')].some(d => !d.hidden)
}

// ── what is pressed stays where it was pressed ────────────────────────
// The owner, 14 Nov 2026: "when I click on a collapsed need-for-you item, it
// doesn't focus on the item I just clicked, it scrolls to I don't know the
// next item or next next item". One question is open at a time, so a press
// on a closed one closes the open one. When that one was above, some 450px
// left the list above the pressed row, the window stayed where it was, and
// the row slid up and out from under the pointer: in 630 of 1,323 presses
// measured on the owner's board, by up to 634px. The same fault, smaller,
// sat in every control that folds something above itself, and in every
// repaint that changed a list above the line being read.
//
// The rule, for the whole page: a press does not move the line it was made
// on. What it adds or takes away is added or taken away below that line, and
// the window is moved, at once and without animation, by exactly what the
// page gained or lost above it. Two things may then still move it, by the
// least that does the job: what was opened is brought into the window when
// its end is cut off, and a pressed line under the bar is brought out from
// under it. "Read the rest" is the one control whose line is not its own:
// it continues a text, so the start of that text is the line that stays.
//
// Where the page cannot be scrolled far enough, because it ends, the missing
// height is kept as empty space under it for as long as it is needed. At
// the very top there is nothing to scroll back into: there the pressed row
// goes up with the list, as before, and stays whole on the screen.
//
// A repaint nobody pressed for (a poll, an answer coming back) keeps the row
// under the pointer where it is, or else the first row on screen.
//
// None of this arms the pill. Every move happens inside the drawing that
// guardPill() measures, so a pill it carries along is held like any other;
// the moves made outside a drawing hold it themselves; and after a press,
// a pill found under the point that was pressed is held whatever happened.
const PRESSABLE = '[data-openq],[data-openws],[data-why],[data-lede],[data-listnote],[data-fold],[data-note],[data-status],[data-all],.tab[data-tab]'
const PRESS_ATTRS = ['data-openq', 'data-openws', 'data-why', 'data-lede', 'data-listnote', 'data-fold', 'data-note', 'data-status', 'data-all', 'data-tab']
const CONTINUES_A_TEXT = ['data-why', 'data-lede', 'data-listnote', 'data-fold', 'data-note']
const EDGE_GAP = 12, FOOT_GAP = 16, PILL_REACH = 12
let press = null          // the control pressed in the click being handled
let pointerAt = null      // where the pointer was last seen, while it is over the page
let slack = 0             // px of empty space kept under the page (see moveBy)
const tabPlace = {}       // narrow pane: how far down each of the two lists was left
const shownRecorded = new Set()

const byAttr = (attr, value) => [...document.querySelectorAll(`[${attr}]`)].find(n => n.getAttribute(attr) === value) || null
const topOf = el => el.getBoundingClientRect().top
// The height of what sticks to the top of the window: the bar from 1100px,
// the two tabs under it.
const topEdge = () => Math.max(0, ...[...document.querySelectorAll('.bar,.tabs')]
  .filter(n => n.getClientRects().length && getComputedStyle(n).position === 'sticky').map(n => n.offsetHeight))
// The line a press is made on: the control itself, or the start of the text
// that a "Read the rest" continues.
const lineOf = (el, continues) => !continues ? el : el.hasAttribute('data-lede') ? $('headline') : el.previousElementSibling || el

function setSlack(px){
  slack = Math.max(0, Math.ceil(px))
  document.body.style.paddingBottom = slack ? slack + 'px' : ''
}
// Space that is no longer needed goes, without moving anything: only what is
// below the window is ever taken away.
function trimSlack(){
  if(!slack) return
  const de = document.documentElement
  setSlack(slack - (de.scrollHeight - de.clientHeight - window.scrollY))
}
// Moves the window by `dy`, at once. Says whether it moved.
function moveBy(dy){
  if(Math.abs(dy) < 0.5) return false
  const de = document.documentElement, from = window.scrollY
  const want = Math.max(0, from + dy)
  const short = want - (de.scrollHeight - de.clientHeight)
  if(short > 0) setSlack(slack + short)
  window.scrollTo(window.scrollX, want)
  const moved = Math.abs(window.scrollY - from) >= 0.5
  if(moved) holdRecords()   // round 4: what it brought under the pointer cannot be worked by the same press
  return moved
}
// Brings `el` into the window by the least that shows it. `whole`: its end
// too, as far as its start can stay under the bar. `y`: where the pointer
// is, when a pointer made the press; the start never passes below it.
function show(el, whole, y = null){
  const box = el.getBoundingClientRect()
  const top = topEdge() + EDGE_GAP, foot = document.documentElement.clientHeight - FOOT_GAP
  if(box.top < top - EDGE_GAP) return moveBy(box.top - (y === null ? top : Math.max(box.top, Math.min(top, y - 2))))
  const end = whole ? box.bottom : box.top + Math.min(box.height, 48)
  return end > foot && box.top > top ? moveBy(Math.min(end - foot, box.top - top)) : false
}

// A row a repaint replaces is found again by what it is, not by its node.
function rowOf(el){
  const q = el.closest('li.q')
  if(q){
    const head = q.querySelector('[data-openq]'), text = q.querySelector('.q-text')
    return { el: q, q: head ? head.dataset.openq : null, text: text ? text.textContent : '' }
  }
  const ws = el.closest('li.ws')
  if(ws) return { el: ws, ws: ws.dataset.ws }
  const kept = el.closest('details[id],#headline,#needs-main,#pane-ws,#more')
  return kept ? { el: kept, node: kept } : null
}
function findRow(row){
  if(row.node) return row.node.isConnected && row.node.getClientRects().length ? row.node : null
  if(row.ws !== undefined) return [...document.querySelectorAll('li.ws')].find(n => n.dataset.ws === row.ws) || null
  const head = row.q === null ? null : byAttr('data-openq', row.q)
  if(head) return head.closest('li.q')
  // A question answered a moment ago is a row with no button, and the same words.
  return [...document.querySelectorAll('li.q')].find(n => { const t = n.querySelector('.q-text'); return t && t.textContent === row.text }) || null
}

// Before a drawing: what must be where it is afterwards.
function placeBefore(){
  const act = document.activeElement
  const inRow = act && act !== document.body && act.closest('#needs-main li.q') ? rowOf(act) : null
  const focus = inRow ? { row: inRow, a: act.dataset.a, opt: act.classList.contains('opt') } : null
  if(press) return { press, focus }
  const marks = [], edge = topEdge(), foot = document.documentElement.clientHeight
  const mark = (el, answered = false) => {
    const row = el && rowOf(el)
    if(row && row.el.getClientRects().length) marks.push({ row, top: topOf(row.el), answered })
  }
  // The question being answered: the owner's eyes are on it.
  for(const key of [...ui.sending, ...ui.recent.keys()]) mark(byAttr('data-openq', key), true)
  if(pointerAt) mark(document.elementFromPoint(pointerAt.x, pointerAt.y))
  // With no pointer to go by, a page at its top stays at its top.
  if(window.scrollY > 0){
    const onScreen = el => { const b = el.getBoundingClientRect(); return b.height && b.bottom > edge && b.top < foot }
    const starts = el => { const b = el.getBoundingClientRect(); return b.height && b.top >= edge && b.top < foot - 40 }
    mark([...document.querySelectorAll('li.q.open')].find(onScreen))
    mark([...document.querySelectorAll('li.q,li.ws')].find(starts))
    mark([...document.querySelectorAll('details[id]')].find(starts))
  }
  return { marks, focus }
}

// After it: put it back there.
function placeAfter(place){
  if(place.press) settlePress(place.press)
  else for(const m of place.marks){
    const el = findRow(m.row)
    if(!el) continue
    moveBy(topOf(el) - m.top)
    // The row just answered is shown with its stamp, once: a tall card that
    // was scrolled past its header would otherwise fold away above the window.
    if(m.answered && el.classList.contains('recorded') && !shownRecorded.has(m.row.text)){
      shownRecorded.add(m.row.text)
      show(el, false)
    }
    break
  }
  if(place.focus) keepFocus(place.focus)
  trimSlack()
}

function settlePress(p){
  if(p.attr === 'data-tab') return settleTab(p)
  const again = byAttr(p.attr, p.value)
  if(!again || !again.getClientRects().length){
    // The control is not there any more. "Show all N" is replaced by the
    // rest of its list; a fold that no longer cuts anything (the window was
    // widened since) has no control to show. Nothing above it moved. The
    // keyboard goes to what took its place: the first entry the list
    // brought, or the text of the fold.
    const next = again ? again.previousElementSibling : p.parent && p.parent.isConnected ? p.parent.children[p.index] : null
    if(next && (!document.activeElement || document.activeElement === document.body)){ next.tabIndex = -1; next.focus({ preventScroll: true }) }
    return
  }
  const line = lineOf(again, p.continues)
  moveBy(topOf(line) - p.top)
  if(p.continues) return
  const open = again.getAttribute('aria-expanded') === 'true' ? again.closest('li.q,li.ws') : null
  show(open || again, !!open, p.pointer ? p.y : null)
}

// The two lists of a narrow pane are two places. Each is found again where
// it was left; one not seen yet starts at its top. The tabs are stuck to the
// top of the window whenever this moves anything, so the one pressed stays
// under the finger.
function settleTab(p){
  const to = $('work').dataset.view
  if(to === p.from) return
  tabPlace[p.from] = p.scrollY
  const layout = $('layout'), de = document.documentElement
  const start = window.scrollY + topOf(layout) - parseFloat(getComputedStyle(layout).marginTop) - $('tabs').offsetHeight
  if(p.scrollY <= start) return
  const end = de.scrollHeight - slack - de.clientHeight
  moveBy(Math.max(start, Math.min(tabPlace[to] === undefined ? start : tabPlace[to], end)) - window.scrollY)
}

// A <details> is opened and shut by the browser, after the click and with no
// drawing of ours: its line is put back in the frame that follows, before
// that frame is shown.
function settleSummary(p){
  if(!p.el.isConnected) return
  fitClamps()
  const d = p.el.parentElement
  const a = moveBy(topOf(p.el) - p.top)
  const b = show(d.open ? d : p.el, d.open, p.pointer ? p.y : null)
  if(a || b) holdPill(PILL_SETTLE_MS)
  trimSlack()
}

// A repaint of the questions replaces the button the keyboard was on. It goes
// back to the same option, or to its question's header; when that question
// has just been answered, to the header of the one after it. (answer() gives
// it to the first question of the list only if nobody else has taken it.)
function keepFocus(f){
  if(document.activeElement && document.activeElement !== document.body) return
  const row = findRow(f.row)
  if(!row) return
  const heads = [...document.querySelectorAll('#needs-main button.q-head')]
  let to = null
  if(row.classList.contains('recorded')){
    to = heads.find(h => row.compareDocumentPosition(h) & Node.DOCUMENT_POSITION_FOLLOWING) || heads[heads.length - 1]
  } else {
    if(f.opt) to = [...row.querySelectorAll('.opt')].find(o => o.dataset.a === f.a && !o.disabled)
    to = to || row.querySelector('button.q-head')
  }
  if(to) to.focus({ preventScroll: true })
}

// ── the pill must be where the owner last saw it ──────────────────────
// The pill is the one target that records without asking, on the argument
// that it cannot be hit by accident. That holds only while it stays put. A
// repaint can move it under a pointer that was aimed at something else (a
// question added above it, a line of the stamp appearing), or leave it in
// place with a different answer under it (the agent moved its recommendation).
// So every repaint is measured: where the pill is and what it would record,
// before and after. If the page moved it, a hit on it asks to confirm for a
// moment, long enough to stop a click already under way. If the page changed
// what it records, it asks for longer, long enough to read the new label.
//
// The owner opening a question arms its pill at once, on one condition: the
// header they tapped is still where they tapped it. Opening a question
// closes the one that was open; when that one was above, the tapped question
// jumps up and its body, pill included, arrives under the pointer, where the
// second click of a double-click lands (re-check of 13 Nov 2026). Then the
// open has moved the pill like any repaint, and it holds like any repaint.
const PILL_SETTLE_MS = 1200
const PILL_REREAD_MS = 5000
function pillBox(){
  const pill = document.querySelector('.q.open .opt.rec .pick')
  if(!pill) return null
  const opt = pill.closest('.opt'), box = pill.getBoundingClientRect()
  return { q: opt.dataset.q, a: opt.dataset.a, x: box.left, y: box.top }
}
// Addition to round 4 (finding 4 of the review of round 3). The hold was
// counted from the moment the press was handled, before the browser had
// drawn the moved pill, and it was read against the clock when the next
// press was handled: on a page that stalled for 1.3 s between two presses,
// the second one recorded at once on a pill nobody had seen arrive. Now the
// hold is taken again once that frame is on the screen, the pill asks for as
// long as the frame is not, and a press counts from when it was made.
const afterPaint = fn => requestAnimationFrame(() => setTimeout(fn, 0))
let pillUnpainted = 0
//
// One clock (14 Nov 2026, the review of the addition). The hold was written
// with Date.now() and a press was read as performance.timeOrigin +
// ev.timeStamp: two clocks. Where they are apart (the wall clock set forward,
// a machine that slept with the board open), every press was read as older
// than the hold and the pill asked for ever. A hold is now written in the
// page's own clock, performance.now(), which the wall clock cannot move, and
// a press is read on that same clock (`pressTime`, in round 4's block).
const holdPill = ms => {
  const hold = () => { ui.pillHeldUntil = Math.max(ui.pillHeldUntil, performance.now() + ms) }
  hold(); pillUnpainted++
  afterPaint(() => { pillUnpainted--; hold() })
}
// May this press on the pill record at once? `wasBusy()` says that the page
// has just been stuck (round 4's block, below): a page that was stuck asks.
const pillFree = ev => pillUnpainted === 0 && !wasBusy() && Math.min(pressTime(ev), pressBegan) >= ui.pillHeldUntil
const headerTop = key => {
  const head = [...document.querySelectorAll('[data-openq]')].find(n => n.dataset.openq === key)
  return head ? head.getBoundingClientRect().top : null
}
// `openedKey` is the question the owner has just tapped open, or null for
// every other repaint.
function guardPill(paintFn, openedKey = null){
  const before = pillBox()
  const headBefore = openedKey === null ? null : headerTop(openedKey)
  paintFn()
  const after = pillBox()
  if(!after) return
  if(openedKey !== null){
    const headAfter = headerTop(openedKey)
    const stayed = headBefore !== null && headAfter !== null && Math.abs(headAfter - headBefore) <= 2
    // A new question, opened on purpose: an older hold was about another
    // card and no longer applies either way.
    ui.pillHeldUntil = stayed ? 0 : performance.now() + PILL_SETTLE_MS   // one clock: was Date.now()
    return
  }
  if(before && (before.q !== after.q || before.a !== after.a)) holdPill(PILL_REREAD_MS)
  else if(!before || Math.abs(before.x - after.x) > 2 || Math.abs(before.y - after.y) > 2) holdPill(PILL_SETTLE_MS)
}

// ── render: everything that is not a clock ────────────────────────────
// Each part of the page is drawn in its own try. One entry the page cannot
// draw (13 Nov 2026: a question whose `options` was a sentence, not a list)
// used to stop the whole render, which emptied both main lists and, because
// the same catch also handled a failed fetch, showed the server as offline.
// A fault now costs its own part, and the page says which.
let faults = []
function part(name, fn){
  try { fn() } catch (e) {
    faults.push(`${name}: ${e && e.message ? e.message : e}`)
    console.error(`status board: could not draw "${name}"`, e)
  }
}
function render(openedKey = null){ guardPill(draw, openedKey) }

function draw(){
  // round 3. What was pressed, or what is being read, is noted before the
  // page is drawn and put back where it was afterwards. Both happen inside
  // the drawing, so guardPill() above sees the page as the owner will.
  const place = placeBefore()
  drawParts()
  placeAfter(place)
}

function drawParts(){
  if(keyClosed){ paint($('alert'), closedHtml()); return }
  const r = current
  if(!r) return
  faults = []
  const project = r.project || 'project'
  const open = (r.decisions || []).filter(q => q && q.q && !ui.recent.has(q.q)).length
  const streams = r.workstreams
  const nWs = streams ? (streams.groups || []).reduce((n, g) => n + (g.items || []).length, 0) : 0

  $('project').textContent = project
  // The tab is how the owner tells two boards apart, and now also how many
  // questions wait: it has to come from the report like everything else.
  document.title = `${open ? `(${open}) ` : ''}${project} — status`

  part('headline', () => {
    const [head, rest] = splitHeadline(r.headline)
    paint($('headline'), md(head))
    $('headline').classList.toggle('clamp', !ui.ledeOpen)
    // One control for both: it shows when the headline or the line under it
    // is cut (see fitClamps), and opens the two together.
    paintKeepingFocus($('lede'), `<div class="lede-row${ui.ledeOpen ? ' open' : ''}">${rest
      ? `<p class="lede${ui.ledeOpen ? '' : ' clamp'}">${mdl(rest)}</p>` : ''}<button class="linkish" data-lede${ui.ledeOpen ? '' : ' hidden'}>${ui.ledeOpen ? 'Show less' : 'Read the rest'}</button></div>`)
  })
  // One line until the owner opens it, at every width: who is at work, and
  // when the lead last moved, are already on that line. Opened by itself it
  // took 120px beside the headline and pushed both lists down.
  part('who is at work', () => paintDetails($('crew'), crewParts(r), false))

  // Two functions, two buttons that say which one a narrow pane shows. They
  // are plain pressed-or-not buttons, not a tab widget: from 1100px both
  // lists are on screen and the buttons are gone, which a tablist with its
  // panels cannot describe. With no workstream list there is one function
  // and no buttons.
  const tab = !streams ? 'needs' : (ui.tab || (open || !nWs ? 'needs' : 'ws'))
  paintKeepingFocus($('tabs'), streams ? `
    <button class="tab" id="tab-needs" data-tab="needs" aria-controls="pane-needs" aria-pressed="${tab === 'needs'}">
      <span>Needs you</span><span class="n${open ? ' hot' : ''}">${open}</span></button>
    <button class="tab" id="tab-ws" data-tab="ws" aria-controls="pane-ws" aria-pressed="${tab === 'ws'}">
      <span>${esc(streams.title || 'Workstreams')}</span><span class="n">${nWs}</span></button>` : '')
  const work = $('work')
  work.dataset.view = tab
  work.classList.toggle('has-tabs', !!streams)
  $('layout').className = 'layout ' + (streams ? 'duo' : 'solo')

  part('Needs you', () => paintKeepingFocus($('needs-main'), needsHtml(r)))
  part('Answered', () => paintDetails($('answered'), answeredParts(r), false))
  part('Workstreams', () => paintKeepingFocus($('pane-ws'), wsHtml(r)))
  part('Also on this board', () => paintMore(r))
  // The clock texts first: an age chip beside a section's title changes
  // where the title wraps, and so whether it is cut.
  part('ages', () => { tick(); fitClamps() })

  const notes = []
  if(r.error) notes.push(`<div class="alert"><b>The board could not build its report</b>
    <p>${md(r.error)}</p><p>Fix the narrative file or restart <code>serve.py</code>. Everything below may be out of date.</p></div>`)
  if(faults.length) notes.push(`<div class="alert"><b>Part of this page could not be drawn</b>
    <p>${faults.map(esc).join('<br>')}</p><p>The rest of the page is as reported. The server is running: this is the page failing on something in the narrative.</p></div>`)
  paint($('alert'), notes.join(''))
}

// A repaint replaces the element the keyboard was on. Put the focus back on
// its successor, found by the same data attribute, so it is not thrown to the
// top of the page.
function paintKeepingFocus(el, html){
  const active = document.activeElement
  const hold = active && el.contains(active)
    ? ['data-openq', 'data-openws', 'data-status', 'data-why', 'data-note', 'data-listnote', 'data-fold', 'data-lede', 'data-tab']
      .map(a => [a, active.getAttribute(a)]).find(p => p[1] !== null)
    : null
  const repainted = paint(el, html)
  if(!repainted || !hold) return repainted
  const again = [...el.querySelectorAll(`[${hold[0]}]`)].find(n => n.getAttribute(hold[0]) === hold[1])
  // A fold's control is written hidden and shown by fitClamps where its text
  // is cut. After "Show less" the successor is such a control: fit the folds
  // first, or the focus is offered to a button that is not there yet.
  if(again && again.hidden) fitClamps()
  if(again) again.focus({ preventScroll: true })
  return true
}

// A "read more" control is offered only where text is actually cut.
function fitClamps(){
  document.querySelectorAll('[data-clamp]').forEach(el => {
    const toggle = el.nextElementSibling
    if(!toggle || !el.classList.contains('clamp')) return
    toggle.hidden = el.scrollHeight <= el.clientHeight + 1
  })
  // The headline and the line under it share one control.
  const more = document.querySelector('[data-lede]')
  if(more && !ui.ledeOpen){
    const head = $('headline'), lede = document.querySelector('.lede')
    // A display face overhangs its line box by a pixel or two: only a whole
    // hidden line counts as cut.
    more.hidden = !(head.scrollHeight > head.clientHeight + 8 || (lede && lede.scrollHeight > lede.clientHeight + 1))
  }
  // round 2, item 8. A link in the part of a fold that is cut off is not
  // drawn, so it is not a stop for the Tab key either, until the fold is
  // opened or a wider window brings its line back. (A block that is not
  // drawn at all, in a section that is shut, has no stops to begin with.)
  document.querySelectorAll('.clamp a[href]').forEach(a => {
    const box = a.closest('.clamp').getBoundingClientRect()
    if(box.height && a.getBoundingClientRect().top >= box.bottom - 1) a.tabIndex = -1
    else a.removeAttribute('tabindex')
  })
  // round 2, item 2. A section's title holds two lines while its section is
  // shut and is whole once it is open (see the stylesheet). Where it is cut,
  // pointing at it shows the rest. Half a line of slack, as for the headline:
  // the display face overhangs its box.
  document.querySelectorAll('.sec-label').forEach(el => {
    if(el.scrollHeight > el.clientHeight + 8) el.title = el.textContent
    else el.removeAttribute('title')
  })
}

// ── tick: everything that is a clock ──────────────────────────────────
// Runs on every poll, whether or not anything else changed, because "nothing
// else changed" is exactly when an age must not freeze: an idle board where
// an agent quietly stopped. It patches text in place; nothing is rebuilt.
function tick(){
  const r = current
  if(!r) return
  const f = r.freshness || {}
  const written = ago(f.narrativeAgeMin)
  const measured = ago(f.checksAgeMin)
  const old = (f.narrativeAgeMin == null ? 0 : f.narrativeAgeMin) > 25
  // Age is a hint; this is proof. Commits that landed after the last rewrite
  // mean the words describe a repository that has since moved.
  const moved = f.commitsSinceNarrative
  const drift = moved && moved.commitsSince > 0
    ? `<span class="stale drift">${plural(moved.commitsSince, 'commit')} since these words${moved.newest ? `: ${esc(moved.newest)}` : ''}</span>` : ''
  const stamp =
    `<span${old ? ' class="stale"' : ''}>${written ? `written ${esc(written)}` : 'not dated'}</span>` +
    (measured ? `<span>suite measured ${esc(measured)}</span>` : '') +
    '<span>git read live</span>' + drift
  paint($('stamp'), stamp)
  paint($('barstamp'), stamp)

  const rows = new Map((r.team || []).map(t => [String(t.id || t.who), t]))
  document.querySelectorAll('[data-moved]').forEach(el => {
    const t = rows.get(el.dataset.moved)
    const text = !t ? '' : t.lastMin == null ? 'last move unknown'
      : t.lastMin < 1.5 ? 'moved just now' : `moved ${ago(t.lastMin)}`
    if(el.textContent !== text) el.textContent = text
  })

  document.querySelectorAll('.agechip[data-since]').forEach(chip => {
    const state = ageChipState(chip.dataset.kind, chip.dataset.since)
    if(!state) return
    if(chip.textContent !== state.text) chip.textContent = state.text
    chip.classList.toggle('stale', state.old)
    const card = chip.closest('.card')
    if(card) card.classList.toggle('unconfirmed', state.old)
  })
  // The section heading is its own claim. A confident header over hedged
  // cards is still a confident page.
  const label = document.querySelector('#sec-inflight .sec-label')
  if(label) label.textContent = inFlightLabel(r.inFlight)
}

// ── confirmation and free text ────────────────────────────────────────
// Free-text answer. Every question gets one, because the options are the
// agent's framing of the problem and the owner's answer is not obliged to fit
// it. Native <dialog>, so Escape, focus trapping and the backdrop are the
// browser's job. Resolves null on cancel, dismiss, Escape or empty text.
function promptOther(question){
  return new Promise(resolve => {
    const d = document.createElement('dialog')
    d.className = 'confirm'
    d.innerHTML = `
      <form method="dialog">
        <div class="cbody">
          <p class="ceyebrow">Your own answer</p>
          <p class="cq">${md(question)}</p>
          <textarea class="cinput" rows="4" aria-label="Your answer" placeholder="Write it in your own words: a qualification, a different option, or a question back."></textarea>
          <p class="cnote">Recorded as your ruling exactly as written.
            Nothing happens if you cancel.</p>
        </div>
        <div class="cbtns">
          <button class="btn" value="cancel">Cancel</button>
          <button class="btn go" value="confirm">Record this answer</button>
        </div>
      </form>`
    const ta = d.querySelector('textarea')
    const go = d.querySelector('button.go')
    // An empty answer is not an answer; keep the button inert until there is text.
    // round 4: nor while the press that opened the dialog could still reach it.
    const sync = () => { go.disabled = !ta.value.trim() || performance.now() < recordHeldUntil }
    ta.addEventListener('input', sync); sync()
    whenRecordsFree(sync)
    d.addEventListener('close', () => {
      const text = ta.value.trim()
      d.remove()
      resolve(d.returnValue === 'confirm' && text ? text : null)
    }, { once: true })
    document.body.appendChild(d)
    d.showModal()
    ta.focus()
  })
}

// Confirmation gate for everything that is NOT a hit on the recommended
// option's pill. A tap records an answer server-side the instant it lands and
// the agent acts on what it finds there, so a stray tap is indistinguishable
// from a considered ruling. Resolves false on cancel, dismiss or Escape.
function confirmDivergence(question, answer, recommended){
  return new Promise(resolve => {
    const d = document.createElement('dialog')
    d.className = 'confirm'
    d.innerHTML = `
      <form method="dialog">
        <div class="cbody">
          <p class="ceyebrow">${recommended ? 'Record this answer?' : 'Not the option I would pick'}</p>
          <p class="cq">${md(question)}</p>
          <p class="ca">${md(answer)}</p>
          <p class="cnote">This is recorded as your ruling the moment you
            confirm, and acted on. Nothing happens if you cancel.</p>
        </div>
        <div class="cbtns">
          <button class="btn" value="cancel">Cancel</button>
          <button class="btn go" value="confirm">Confirm this choice</button>
        </div>
      </form>`
    document.body.appendChild(d)
    // close fires for every dismissal path, including Escape, so one listener
    // covers cancel, confirm and dismiss without a second code path.
    d.addEventListener('close', () => {
      const ok = d.returnValue === 'confirm'
      d.remove()
      resolve(ok)
    }, { once: true })
    d.showModal()
    // round 4: it started on Confirm, and the press that opened the dialog
    // could go on to confirm it.
    settleConfirm(d)
  })
}

// The last resort when an answer was not recorded and could not be copied:
// the text itself, in a field the owner can select and copy by hand. The
// question stays open behind it.
function showUnsaved(why, text){
  const d = document.createElement('dialog')
  d.className = 'confirm'
  d.innerHTML = `
    <form method="dialog">
      <div class="cbody">
        <p class="ceyebrow">Your answer was not recorded</p>
        <p class="cq">${esc(why)} It could not be copied for you either, so it is kept here. Select it, copy it and paste it into chat.</p>
        <textarea class="cinput" rows="5" readonly aria-label="Your answer, not recorded"></textarea>
        <p class="cnote">The question is still open on the board.</p>
      </div>
      <div class="cbtns"><button class="btn go" value="close">Close</button></div>
    </form>`
  const ta = d.querySelector('textarea')
  ta.value = text
  d.addEventListener('close', () => d.remove(), { once: true })
  document.body.appendChild(d)
  d.showModal()
  ta.focus(); ta.select()
}

async function copyText(text){
  let ok = true
  try { await navigator.clipboard.writeText(text) } catch (e) { ok = false }
  if(!ok){
    // Clipboard can be blocked. Select the text so it is still copyable by
    // hand rather than claiming a copy that never happened.
    const ta = document.createElement('textarea')
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'
    document.body.appendChild(ta); ta.select()
    try { ok = document.execCommand('copy') } catch (e) { ok = false }
    ta.remove()
  }
  return ok
}

// ── answering ─────────────────────────────────────────────────────────
async function answer(b, ev){
  // The exemption belongs to the PILL, not to the option.
  //
  // Recording an answer is consequential — the agent acts on it — so the
  // only click that skips confirmation is one that cannot plausibly be an
  // accident: a hit on the small "I'd pick this" pill of the recommended
  // option. The row around it is a large target; landing on its label, its
  // reason text or its padding confirms like any other choice. Keyboard
  // activation confirms too: the pill is not separately focusable.
  //
  // Owner's rule, 1 Aug 2026. The earlier version exempted the whole
  // recommended row, which made the easiest thing to hit by mistake also the
  // only thing that recorded without asking.
  const viaPill = ev.target instanceof Element && !!ev.target.closest('.pick')
  const recommended = b.dataset.rec === '1'
  // ...and it belongs to a pill that has stayed where the owner saw it. A
  // pill the page has just moved, or just put a different answer under,
  // asks like everything else until the hold runs out: see guardPill().
  const instant = recommended && viaPill && pillFree(ev)
  // Read everything off the button now: a poll can repaint this card while a
  // dialog is open, and the button in hand would then be a detached node.
  const question = b.dataset.q, project = b.dataset.project
  if(ui.sending.has(question)) return

  let choice = b.dataset.a
  if (b.dataset.other === '1') {
    choice = await promptOther(question)
    if (!choice) return          // cancelled, or nothing typed
  } else if (!instant && !(await confirmDivergence(question, choice, recommended))) {
    return
  }

  // Record FIRST: recording is the tap's whole job. The clipboard is used
  // only when recording FAILS, so the answer is not lost.
  //
  // A non-2xx response does NOT throw — fetch() only rejects on a network
  // failure — so the status is checked, never assumed. (2 Aug 2026: the
  // server rejected a real answer with a 400 and the page carried on as if
  // it had been recorded.)
  const pending = (current && current.decisions || []).filter(q => q && q.q && !ui.recent.has(q.q))
  const index = Math.max(0, pending.findIndex(q => q.q === question))
  ui.sending.add(question)
  render()
  const lost = async why => {
    const text = replyText(project, question, choice)
    if(await copyText(text)){
      return toast(`${why} Copied to your clipboard: paste it into chat so it is not lost.`, 'error')
    }
    // Neither recorded nor copied. The words are the owner's, typed or
    // chosen, and they exist nowhere else: keep them on screen, selected.
    toast(why, 'error')
    showUnsaved(why, text)
  }
  try {
    const usedToken = readToken()
    const res = await boardFetch('answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q: question, answer: choice }),
    })
    if (res.ok) {
      ui.recent.set(question, { answer: choice, at: Date.now(), index })
      ui.openQ = null
      toast('Recorded. The agent picks it up in seconds.')
      last = ''
      setTimeout(poll, 700)
    } else {
      // The server's own error strings are full sentences ending in a period;
      // the generic `HTTP ${status}` fallback is not. Strip, then add ours.
      let reason = `HTTP ${res.status}`
      let closed = false
      try { const j = await res.json(); if (j && j.error) reason = j.error; closed = !!(j && j.code === 'key') } catch (e) {}
      if (closed) { if (readToken() === usedToken) dropToken(); showClosed(reason) }   // the board has closed itself to this tab: the banner, nothing else
      await lost(`NOT recorded on the board: ${reason.replace(/\.+$/, '')}.`)
    }
  } catch (e) {
    await lost('NOT recorded: could not reach the board server.')
  } finally {
    ui.sending.delete(question)
    render()
    // Hand the keyboard to the next question's header rather than leaving it
    // on a button that no longer exists. Opening it is still the owner's act.
    if(!document.activeElement || document.activeElement === document.body){
      const next = document.querySelector('button.q-head')
      if(next) next.focus({ preventScroll: true })
    }
  }
}

function gotoWorkstream(id){
  const streams = current && current.workstreams
  if(!streams) return
  ui.tab = 'ws'; store.set('tab', 'ws')
  ui.wsFilter = ''; store.set('wsFilter', '')
  ui.wsOpen.add(id)
  render()
  const row = [...document.querySelectorAll('.ws')].find(n => n.dataset.ws === id)
  if(row){
    // round 3: at once. A glide moved the page for half a second after
    // guardPill() had measured it, and could carry the pill under a pointer
    // that was waiting for its second click.
    row.scrollIntoView({ block: 'center' })
    holdPill(PILL_SETTLE_MS)
    const btn = row.querySelector('.ws-row')
    if(btn) btn.focus({ preventScroll: true })
  }
}

// ── a press that brings up a control that records cannot also work it ──
// Found by the review of 14 Nov 2026: a double click or a double tap on an
// option that is not the pill recorded it. The confirmation came up with the
// keyboard already on "Confirm this choice", in a narrow window also under
// the pointer, and the second press of the same gesture landed on it. Enter
// twice, Enter held down and Space twice did the same at every width. The
// dialog exists so that a stray press records nothing, and one stray gesture
// went through it.
//
// The rule, for every control that sends something to the server: the press
// that brings it up, or brings it under the pointer, is never the press that
// works it. A press on a button or on a section's line holds every such
// control for 600 ms, and a held control takes only a press that BEGAN after
// the hold ran out: the pointer went down, or the key did. A key that is
// held down began once, so its repeats work nothing. The owner who means it
// waits six tenths of a second, which is less than reading the dialog takes.
//
// The pill is not in this list: it records without asking, and its own code
// says when (see "the pill must be where the owner last saw it"). Since the
// addition to round 4 the same rule is kept for it there: every press on a
// control holds the pill for these 600 ms too.
const RECORD_SETTLE_MS = 600
const RECORDS = 'dialog.confirm button.go[value="confirm"],[data-done],#compose button[type="submit"]'
let pressBegan = 0          // when the press now under way began (not a key's repeats)
// One clock (14 Nov 2026). Every hold on this page is written in the page's
// own clock, performance.now(), and a press is read on it. An event carries
// the moment it was made, and that is the moment wanted: a press that waited
// its turn, in the page or on its way to the page, was made earlier than it
// is handled. So an event's stamp is believed whenever it can be this clock's:
// not later than now, and less than five seconds old. Within those five
// seconds a press is never read as made later than it was made.
// A stamp outside them is not a press that waited: it is a browser that
// stamps events on another clock (the time since 1970, or a clock that went
// on while the machine slept and this one did not). To believe it would hold
// for ever, or never. Such a press is read as made 100 ms before it is
// handled, which is as early as it can be known to have been made.
// (A first version, on the preview from 21:39 to the next one, believed a
// stamp only up to half a second old, and read an older one as made just
// before it was handled: later than it was made. Input that reached the page
// 0.7 s late, the page itself free, got through a hold. Found by the review.)
const STAMP_BOUND_MS = 5000, STAMP_SLACK_MS = 100
const pressTime = ev => {
  const now = performance.now(), made = ev.timeStamp
  return made <= now + 5 && now - made < STAMP_BOUND_MS ? made : now - STAMP_SLACK_MS
}
let recordHeldUntil = 0
// Addition to round 4. The hold is taken when the press is handled, and taken
// again once the frame that shows its result is on the screen: on a page
// that stalls, the six tenths of a second begin when the owner can see what
// came up, not before. Until that frame, everything that records is held.
let recordsUnpainted = 0
const holdRecords = () => {
  const hold = () => { recordHeldUntil = Math.max(recordHeldUntil, performance.now() + RECORD_SETTLE_MS) }
  hold(); recordsUnpainted++
  afterPaint(() => { recordsUnpainted--; hold() })
}
const tooEarly = () => recordsUnpainted > 0 || wasBusy() || pressBegan < recordHeldUntil
// A page that is stuck shows the owner nothing, and its clock runs on all the
// same. So the page takes its own pulse ten times a second. A beat that comes
// late means it was stuck: everything that records, the pill too, is then
// held for 0.6 s from the moment it is free again, and until that late beat
// has come, a press is taken as too early.
const BUSY_MS = 300
let beat = performance.now()
const wasBusy = () => performance.now() - beat > BUSY_MS
setInterval(() => {
  if(wasBusy()){ holdRecords(); holdPill(RECORD_SETTLE_MS) }
  beat = performance.now()
}, 100)
// Runs `fn` once nothing holds what records any more.
const whenRecordsFree = fn => {
  const wait = recordsUnpainted > 0 ? RECORD_SETTLE_MS : recordHeldUntil - performance.now()
  wait > 0 ? setTimeout(() => whenRecordsFree(fn), wait + 20) : fn()
}

document.addEventListener('pointerdown', ev => { pressBegan = pressTime(ev) }, true)
document.addEventListener('keydown', ev => {
  if(!ev.repeat){ pressBegan = pressTime(ev); return }
  // A key held down does not press a button a second time, or send the form.
  if((ev.key === 'Enter' || ev.key === ' ') && ev.target instanceof Element && ev.target.closest('button,summary,#compose input')) ev.preventDefault()
}, true)
// Before every other listener: a press that came too early is not seen by any
// of them, and does nothing of its own either.
document.addEventListener('click', ev => {
  const t = ev.target instanceof Element ? ev.target : null
  if(!t) return
  if(t.closest(RECORDS)){
    if(tooEarly()){ ev.preventDefault(); ev.stopImmediatePropagation(); return notSent() }
    // It worked. What it leaves under the pointer is held in its turn, once
    // this press is through (a form is sent after the click, in the same press).
    setTimeout(holdRecords, 0)
  // "Add an item" holds nothing: the form it opens refuses an empty title,
  // so the press that opens it cannot send it, and a title typed or pasted
  // straight away is sent at the first Enter.
  } else if(t.closest('button,summary') && !t.closest('#addtoggle')) holdRecords()
}, true)
document.addEventListener('submit', ev => {
  if(ev.target instanceof HTMLFormElement && ev.target.id === 'compose' && tooEarly()){ ev.preventDefault(); ev.stopImmediatePropagation(); notSent() }
}, true)
// A press that was stopped says so. In a dialog the button is shown as not
// ready and takes no press at all; a button in the page has no such look.
const notSent = () => toast('That press came too soon after the last one, so nothing was sent. Press again if you meant it.')
// The confirmation comes up with the keyboard on Cancel, so a second Enter or
// Space cancels, and with its Confirm shown as not yet ready for as long as
// it is held.
function settleConfirm(d){
  const go = d.querySelector('button.go')
  go.disabled = true
  whenRecordsFree(() => { go.disabled = false })
  d.querySelector('button[value="cancel"]').focus()
}

// One listener for the whole page. Sections are repainted from strings, so
// handlers bound to their elements would have to be bound again after every
// paint; a click is instead matched against what it landed on.
document.addEventListener('click', async ev => {
  const t = ev.target instanceof Element ? ev.target : null
  if(!t) return
  let el
  // A click on a summary is about to flip its <details>. Recorded here, from
  // the reader's own act, rather than from `toggle`, which also fires for a
  // section the page opened by itself.
  if((el = t.closest('summary')) && el.parentElement.dataset.sec){
    return store.set('sec.' + el.parentElement.dataset.sec, el.parentElement.open ? '0' : '1')
  }
  if((el = t.closest('.opt'))) return answer(el, ev)
  if((el = t.closest('.tab[data-tab]'))){
    ui.tab = el.dataset.tab; store.set('tab', ui.tab)
    return render()
  }
  if((el = t.closest('[data-openq]'))){
    const key = el.dataset.openq
    const openNow = el.getAttribute('aria-expanded') === 'true'
    ui.openQ = openNow ? null : key
    return render(openNow ? null : key)
  }
  if((el = t.closest('[data-why]'))){
    const key = el.dataset.why
    ui.whyOpen.has(key) ? ui.whyOpen.delete(key) : ui.whyOpen.add(key)
    return render()
  }
  if((el = t.closest('[data-lede]'))){ ui.ledeOpen = !ui.ledeOpen; return render() }
  if((el = t.closest('[data-listnote]'))){ ui.listNoteOpen = !ui.listNoteOpen; return render() }
  if((el = t.closest('[data-fold]'))){
    const key = el.dataset.fold
    ui.unfolded.has(key) ? ui.unfolded.delete(key) : ui.unfolded.add(key)
    return render()
  }
  if((el = t.closest('[data-note]'))){
    const key = el.dataset.note
    ui.noteOpen.has(key) ? ui.noteOpen.delete(key) : ui.noteOpen.add(key)
    return render()
  }
  if((el = t.closest('[data-copyq]'))){
    const q = (current.decisions || []).find(d => d.q === el.dataset.copyq)
    if(!q) return
    const ok = await copyText(questionText(current.project || 'project', q))
    return toast(ok ? 'Question and options copied' : 'Copy blocked by the browser', ok ? '' : 'error')
  }
  if((el = t.closest('[data-handoff]'))){
    const ok = await copyText(handoffText((current.handoffs || [])[+el.dataset.handoff] || {}))
    return toast(ok ? 'Copied. Ready to send.' : 'Copy blocked by the browser', ok ? '' : 'error')
  }
  if((el = t.closest('[data-status]'))){
    ui.wsFilter = el.dataset.status; store.set('wsFilter', ui.wsFilter)
    return render()
  }
  if((el = t.closest('[data-openws]'))){
    const key = el.dataset.openws
    ui.wsOpen.has(key) ? ui.wsOpen.delete(key) : ui.wsOpen.add(key)
    return render()
  }
  if((el = t.closest('[data-goto]'))){ ev.preventDefault(); return gotoWorkstream(el.dataset.goto) }
  if((el = t.closest('[data-all]'))){ ui.all.add(el.dataset.all); return render() }
  if(t.closest('#addtoggle')){
    const form = $('compose')
    form.classList.toggle('open')
    if(form.classList.contains('open')) $('ttl').focus()
    return
  }
  if(t.closest('#composeCancel')) return $('compose').classList.remove('open')
  if((el = t.closest('[data-done]'))){
    await boardFetch('backlog', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: el.dataset.done, state: 'done' }),
    })
    last = ''; return poll()
  }
})

// round 3. Two more listeners around the one above, which is left as it was.
// The first runs before it (capture): it notes what was pressed and where
// its line is, while the page is still as the owner saw it. draw() puts the
// line back. The second runs after it, in the same click: a pill that is now
// under the point that was pressed is held, however it came to be there. The
// second click of a double-click lands on that point. A press made with the
// keyboard has no point: the pointer's resting place stands in for it.
document.addEventListener('click', ev => {
  press = null
  const t = ev.target instanceof Element ? ev.target : null
  if(!t) return
  // A press in a dialog closes it and uncovers the page under the pointer.
  if(t.closest('dialog')) return holdPill(PILL_SETTLE_MS)
  const summary = t.closest('summary')
  const el = summary && summary.parentElement.dataset.sec ? summary : t.closest('.opt') ? null : t.closest(PRESSABLE)
  if(!el) return
  const attr = el === summary ? 'summary' : PRESS_ATTRS.find(a => el.hasAttribute(a))
  const continues = CONTINUES_A_TEXT.includes(attr) && el.textContent.trim() !== 'Show less'
  const p = { attr, value: el.getAttribute(attr), el, continues, top: topOf(lineOf(el, continues)),
    x: ev.clientX, y: ev.clientY, pointer: ev.detail > 0, scrollY: window.scrollY, from: $('work').dataset.view,
    parent: el.parentElement, index: [...el.parentElement.children].indexOf(el) }
  if(attr === 'summary') requestAnimationFrame(() => settleSummary(p))
  else press = p
}, true)
document.addEventListener('click', () => {
  const p = press
  press = null
  // Addition to round 4 (finding 3 of the review of round 3): round 4's rule,
  // kept for the pill. A press that opens a question arms its pill at 0 when
  // the header stayed (guardPill), and the check below held it only within 12
  // px of the point pressed: a second press landing 31 to 60 px lower recorded
  // at once. Now every press on a control holds the pill for 0.6 s.
  if(p) holdPill(RECORD_SETTLE_MS)
  const at = !p ? null : p.pointer ? p : pointerAt
  const pill = at && document.querySelector('.q.open .opt.rec .pick')
  if(!pill) return
  const b = pill.getBoundingClientRect()
  if(at.x >= b.left - PILL_REACH && at.x <= b.right + PILL_REACH && at.y >= b.top - PILL_REACH && at.y <= b.bottom + PILL_REACH) holdPill(PILL_SETTLE_MS)
})
// Where the pointer is, for a repaint nobody pressed for. A finger is not
// there once it is lifted.
const seePointer = ev => { pointerAt = { x: ev.clientX, y: ev.clientY } }
document.addEventListener('pointermove', seePointer, { passive: true })
document.addEventListener('pointerdown', seePointer, { passive: true })
document.addEventListener('pointerup', ev => { if(ev.pointerType !== 'mouse') pointerAt = null }, { passive: true })
document.addEventListener('pointercancel', () => { pointerAt = null }, { passive: true })
document.documentElement.addEventListener('pointerleave', () => { pointerAt = null })
for(const what of ['scroll', 'resize']) window.addEventListener(what, trimSlack, { passive: true })

document.addEventListener('submit', async ev => {
  if(!(ev.target instanceof HTMLFormElement) || ev.target.id !== 'compose') return
  ev.preventDefault()
  const err = $('composeErr')
  err.textContent = ''
  try {
    const res = await boardFetch('backlog', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: $('ttl').value, kind: $('kind').value, notes: $('notes').value }),
    })
    const out = await res.json()
    if(!out.ok) throw new Error(out.error || 'The board would not save it.')
    ev.target.reset(); ev.target.classList.remove('open')
    last = ''; poll()   // force a re-render; the new item is on disk now
    toast('Added. I read this file, no need to paste it.')
  } catch (ex) {
    err.textContent = ex.message   // say what went wrong, keep what was typed
  }
})

window.addEventListener('resize', () => { fitClamps(); holdPill(PILL_SETTLE_MS) })
// A section opened or shut above the pill moves it too. `toggle` does not
// bubble, hence the capture. Only <details>: a confirmation dialog closing
// fires the same event and moves nothing.
document.addEventListener('toggle', ev => {
  if(ev.target instanceof HTMLDetailsElement){ holdPill(PILL_SETTLE_MS); fitClamps() }
}, true)

// kind: 'error' gets the red styling and a longer display — a failed
// recording is the one toast on this page that must not be missed. A single
// tracked timer, so a second toast is never cut short by the first one's.
let toastTimer = null
function toast(msg, kind){
  const t = $('toast')
  t.textContent = msg
  t.classList.toggle('err', kind === 'error')
  t.classList.add('on')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => t.classList.remove('on'), kind === 'error' ? 6000 : 2400)
}

// ── polling ───────────────────────────────────────────────────────────
// Every field is re-fetched on a 3s tick, so a commit by anyone, or a
// narrative rewritten by the agent, appears without anyone refreshing.
// Coming back to the tab re-reads at once: browsers throttle hidden tabs.
const POLL_MS = 3000

// Fields that change on EVERY request because they are ages. With them in the
// comparison the page would repaint twenty times a minute; they are stripped,
// and tick() shows them instead.
function stableKey(txt){
  try {
    const c = JSON.parse(txt)
    delete c.updatedAt
    delete c.freshness
    delete c.shotLinks   // new signed addresses at every poll: not a change of what the board says
    if(c.orca) delete c.orca.ageSec
    ;(c.team || []).forEach(t => { delete t.lastMin })
    ;(c.backlog || []).forEach(b => { delete b.ageDays })
    return JSON.stringify(c)
  } catch (e) {
    return txt   // unparseable: fall back to text, so errors still surface
  }
}

let last = ''
let inflight = false
let keyClosed = false
let closedWhy = ''
const closedHtml = () => `<div class="alert"><b>This board is closed to this browser</b><p>${esc(closedWhy)}</p></div>`
// The board answered `code: 'key'` (no token, or the token of a run that has ended): only the banner is on screen. The old board is not
// kept under it (it may be the page of a program that held the port meanwhile) and no option can be tapped: the panes are cleared, the
// body says `closed` (which hides what is left), and `drawParts` paints the banner and returns while this lasts, so that a repaint, or a
// refused tap, cannot blank it.
const showClosed = why => {
  keyClosed = true
  closedWhy = why || ''
  current = null
  document.body.classList.add('closed')
  for(const id of ['lede', 'stamp', 'tabs', 'needs-main', 'pane-ws']) paint($(id), '')
  for(const d of document.querySelectorAll('#crew, #answered, #more .sec')){   // <details>: emptied inside, as paintDetails fills them again
    d.hidden = true
    paint(d.querySelector('summary'), ''); paint(d.querySelector('.body'), '')
  }
  $('headline').textContent = '…'
  document.title = 'status board'
  $('tick').textContent = 'closed'; $('beacon').classList.add('off')
  paint($('alert'), closedHtml())
}

async function poll(){
  if(inflight) return
  inflight = true
  const tickEl = $('tick'), beacon = $('beacon')
  let txt = null, ok = false
  // Only a report that did not arrive, or is not JSON, means "offline".
  try {
    const used = readToken()   // the token this request carries (boardFetch reads the same one in the same tick)
    const res = await boardFetch('report.json?t=' + Date.now(), { cache: 'no-store' })
    txt = await res.text()
    const body = JSON.parse(txt)
    // 2.4.0: the board gives its report only to a browser that holds a token for it. Without one, or with one it no longer takes
    // (30 days old, or from another key), say so in place of the board, forget the token, and keep asking: once the browser has been
    // let in (the opener), the next poll draws the board. A forbidden answer from another machine says the same in its own words.
    if((res.status === 401 || res.status === 403) && body && body.code === 'key'){
      if(readToken() === used) dropToken()   // not a token that arrived while this request was out (the opener's, or a renewal)
      showClosed(body.error)
      inflight = false
      return
    }
    if(keyClosed){ keyClosed = false; last = ''; document.body.classList.remove('closed') }   // it was closed and is not now: draw it again, whatever it holds
    const renewed = res.ok && res.headers.get('X-Board-Token')   // a token a day old is replaced by the board: 30 days from the last visit
    if(renewed) writeToken(renewed)
    current = body
    ok = res.ok
  } catch (e) {
    tickEl.textContent = 'offline'; beacon.classList.add('off')
    inflight = false
    return
  }
  tickEl.textContent = ok ? 'live' : 'error'
  beacon.classList.toggle('off', !ok)
  // Drawing it is a separate matter: a fault here is the page's, and the
  // page says so itself (see part()).
  try {
    const key = stableKey(txt)
    if(key !== last){ last = key; render() }
    else guardPill(() => part('ages', tick))
    // Orca's answer was still on its way when this report was built (the
    // first load, or the first after the page was closed for a while). Ask
    // again shortly instead of showing an empty crew for a whole tick.
    if(current && current.orca && current.orca.state === 'checking') setTimeout(poll, 900)
  } finally {
    inflight = false
  }
}

poll()
setInterval(poll, POLL_MS)
document.addEventListener('visibilitychange', () => { if(!document.hidden) poll() })
window.addEventListener('focus', poll)

// 2.4.0: a signed shot address lives ten minutes (see shotUrl). A picture that fails to load (its address expired before a lazy
// load) is asked for again once, with the newest address the poll has; a link to a picture gets the newest address when it is
// pressed. Plain listeners: the page's policy allows no inline handler.
document.addEventListener('error', ev => {
  const img = ev.target
  if(!(img instanceof HTMLImageElement) || !img.dataset.shot || img.dataset.retried) return
  img.dataset.retried = '1'
  img.src = shotUrl(img.dataset.shot)
}, true)
const freshShotLink = ev => {
  const link = ev.target instanceof Element ? ev.target.closest('a[data-shot]') : null
  if(link) link.href = shotUrl(link.dataset.shot)
}
document.addEventListener('click', freshShotLink, true)
document.addEventListener('auxclick', freshShotLink, true)
</script>
</body>
</html>
