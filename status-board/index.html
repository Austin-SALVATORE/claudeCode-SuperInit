<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>status board</title>
<meta name="color-scheme" content="light dark">
<!-- The <title> above stays on line 6 and reads exactly "status board":
     hooks/revive-board.py looks for it in the first 4 KB to tell this page
     from whatever else might be listening on the port.
     The icon is inline so the page stays one file, and so a browser does not
     ask the server for a favicon it does not have. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2316120f'/%3E%3Cpath d='M4 5h8M4 8h8M4 11h5' stroke='%23d9a048' stroke-width='1.7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  /* ── tokens ────────────────────────────────────────────────────────
     The old board's colours: cream ink on near-black brown by night, dark
     brown ink on cream by day. Amber makes two claims, as it did there, and
     its form tells them apart. Filled, with dark ink on it, it means "your
     move": the open question, the pill, the count, a workstream that waits
     on the owner. As text or a dashed outline it means "the page is not
     sure this is still true". Teal and violet are new, drawn to sit with it.
     No web font: the page must work offline. Avenir Next ships with
     macOS in two widths, and width is the role here: condensed for
     numbers, ids, tags and titles, regular for sentences. Elsewhere the
     stacks fall back to the system sans and the layout does not depend
     on the narrower face. */
  :root{
    --paper:#f6f2ec; --sheet:#ffffff; --sunk:#f1ece4; --rule:#e2dbd0; --rule2:#cfc5b7;
    --ink:#1c1815; --ink2:#4d453c; --ink3:#72685c;
    --mark:#ba8224; --mark-ink:#1c1509; --mark-wash:#fdf5e6;
    --blue:#3f6e94; --blue-bg:#e7eff5;
    --teal:#27736d; --teal-bg:#e4f2f1;
    --red:#ab4e2e; --red-bg:#f9e9e4;
    --violet:#815c8d; --violet-bg:#f3ecf5;
    --green:#477530; --green-bg:#ebf2e7;
    --grey:#5f564c; --grey-bg:#ece6dd;
    --warn:#8f6004; --warn-bg:#f9f0e2;
    --shade:0 22px 60px rgba(28,24,21,.22);
    --disp:"Avenir Next Condensed","Bahnschrift","Roboto Condensed","Arial Narrow","Avenir Next","Segoe UI",system-ui,sans-serif;
    --text:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --gut:18px; --maxw:2280px;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --paper:#16120f; --sheet:#211c18; --sunk:#2a241f; --rule:#332c25; --rule2:#463d34;
      --ink:#f2ede6; --ink2:#b6aca0; --ink3:#968c80;
      --mark:#d9a048; --mark-ink:#1c1509; --mark-wash:#2e2212;
      --blue:#6a9bc3; --blue-bg:#202f3b;
      --teal:#58b0aa; --teal-bg:#243532;
      --red:#d97757; --red-bg:#36261f;
      --violet:#b28bbe; --violet-bg:#372c3b;
      --green:#7fb069; --green-bg:#303425;
      --grey:#a69c90; --grey-bg:#322c27;
      --warn:#d9a048; --warn-bg:#3e3120;
      --shade:0 22px 60px rgba(0,0,0,.5);
    }
  }

  /* ── measure ───────────────────────────────────────────────────────
     The colours above are the theme; nothing in this block touches them.
     This is the page's measure, set after the UX review of 14 Nov 2026. The
     owner found the board hard to read and gave one example, two panels 18px
     apart. The cause was wider than a margin: eighteen text sizes, most of
     them under 15px; a line cap written in `ch`, which is the width of a
     zero, so that "78ch" let a hundred characters through; and spacing that
     was the same between two panels as inside one.
     So: four text sizes and a headline. One spacing scale. A line of prose is
     capped in `em`. The space between panels is always wider than the padding
     inside them. And the condensed face is display only now: the headline,
     panel and section titles, and numerals (counts, question numbers,
     workstream ids). Every label, tag and button is in the text face, where a
     14px word can be read. */
  :root{
    --t-meta:14px; --t-body:16px; --t-row:17px; --t-title:22px;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
    --pad:16px;          /* inside a panel, left and right: one left edge for everything in it */
    --gut:16px;          /* the page's own edge */
    --gap:24px;          /* between panels */
    --measure:34em;      /* a line of prose: 70 characters on average, 80 at most, in this face */
    --maxw:2560px;
    --numcol:28px; --idcol:56px; --chev:20px;
    --bar-h:48px;
  }
  @media(min-width:700px){ :root{ --pad:24px; --gut:24px } }
  @media(min-width:1100px){
    :root{ --pad:20px; --gut:clamp(28px,2.2vw,56px); --gap:clamp(32px,2.8vw,56px) }
  }
  @media(min-width:1280px){ :root{ --pad:24px } }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--bar-h) + 28px)}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--t-body)/1.5 var(--text)}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
  strong{font-weight:600}
  em{font-style:italic}
  code{background:var(--sunk);border:1px solid var(--rule);border-radius:4px;padding:0 4px;
    font:max(.875em,14px)/1.3 var(--mono);overflow-wrap:anywhere}
  a{color:var(--blue);text-underline-offset:3px;overflow-wrap:anywhere}
  a:hover{color:var(--ink)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  /* `hidden` means hidden, whatever display a class gives the element. */
  [hidden]{display:none !important}

  /* Long text is folded, never dropped: a few lines, and the rest one tap
     away. The control appears only where something is actually cut. */
  h1.clamp,.lede.clamp,.q-why.clamp,.ws-next,.ws-note.clamp,.ws-gnote.clamp,.q-meta,.sec-label,.fold.clamp{
    display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
  h1.clamp{-webkit-line-clamp:3}
  .lede.clamp{-webkit-line-clamp:1}
  .ws-note.clamp,.ws-gnote.clamp,.q-meta,.ws-next,.sec-label{-webkit-line-clamp:2}
  .q-why.clamp{-webkit-line-clamp:3}
  .fold.clamp{-webkit-line-clamp:var(--fold,5)}
  @media(min-width:700px){ h1.clamp{-webkit-line-clamp:2} }
  /* round 2. A section's title is cut at two lines only while its section is
     shut. Opening the section shows the whole title: it has no control of its
     own, and without this a long one could be read nowhere. */
  details.sec[open]>summary .sec-label{display:block;-webkit-line-clamp:unset}
  .linkish{background:none;border:0;padding:var(--s2) 0;min-height:40px;color:var(--blue);
    font:500 var(--t-body)/1.3 var(--text);text-decoration:underline;text-underline-offset:3px;text-align:left}
  .linkish:hover{color:var(--ink)}

  /* What an agent typed as a list is set as one. */
  .mdp{margin:0}
  .mdp + .mdp,.mdl + .mdp{margin-top:var(--s2)}
  .mdl{margin:var(--s1) 0;padding:0 0 0 1.3em}
  .mdl li{margin:2px 0;padding-left:2px}
  .mdl li::marker{color:var(--ink3)}
  ul.mdl{list-style-type:disc}
  ol.mdl{list-style-type:decimal}

  /* ── top bar: which project, and whether the page is alive ───────── */
  .bar{background:var(--paper);border-bottom:1px solid var(--rule)}
  .bar-in{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut);display:flex;
    align-items:center;gap:var(--s3);min-height:var(--bar-h)}
  .beacon{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none}
  .beacon.off{background:var(--red)}
  .proj{font:600 var(--t-row)/1.2 var(--disp);letter-spacing:.01em;min-width:0;overflow-wrap:anywhere}
  .live{font:400 var(--t-meta)/1.2 var(--text);color:var(--ink3)}

  /* ── page ──────────────────────────────────────────────────────────
     The band above the two lists is as short as its content allows: the two
     lists are what the board is for, and they used to start a third of the
     way down the screen. */
  .page{max-width:var(--maxw);margin:0 auto;padding:var(--s5) var(--gut) 96px}
  .hero{display:grid;gap:var(--s1) var(--s6);grid-template-columns:minmax(0,1fr)}
  .hero-main{min-width:0}
  h1{font:600 clamp(22px,1vw + 14px,30px)/1.2 var(--disp);letter-spacing:.005em;margin:0;
    max-width:30em;text-wrap:pretty;overflow-wrap:anywhere}
  .lede-row{display:flex;align-items:baseline;gap:var(--s3);margin-top:var(--s1)}
  .lede-row:empty{display:none}
  .lede{margin:0;color:var(--ink2);min-width:0;max-width:var(--measure);overflow-wrap:anywhere}
  .lede-row .linkish{flex:none}
  .lede-row.open{display:block}
  /* round 2. In a narrow pane the line under the headline keeps its whole
     width, and "Read the rest" goes under it: side by side, the control took
     a third of a line of 33 characters. */
  @media(max-width:699.98px){ .lede-row{display:block} }

  /* The staleness stamp: judgement dated, machine facts read live. */
  .stamp{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);margin:var(--s2) 0 0;
    font:400 var(--t-meta)/1.45 var(--text);color:var(--ink3)}
  .stamp .stale{color:var(--warn);font-weight:600}
  .stamp .drift{flex-basis:100%;overflow-wrap:anywhere}
  /* The stamp lives in one place: under the headline in a narrow pane, in
     the bar that stays on screen once there is room for it. */
  .bar-stamp{display:none}

  /* Who is at work: one line, the detail on demand. */
  details.crew{margin-top:var(--s1);min-width:0}
  details.crew>summary{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s3);
    cursor:pointer;list-style:none;min-height:40px;font:400 var(--t-meta)/1.4 var(--text);color:var(--ink2)}
  details.crew>summary::-webkit-details-marker{display:none}
  details.crew>summary::after{content:"";width:8px;height:8px;border-right:1.6px solid var(--ink3);
    border-bottom:1.6px solid var(--ink3);transform:rotate(45deg) translateY(-2px);flex:none}
  details.crew[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
  .crew-n{font-weight:600;color:var(--ink)}
  .crew-names{min-width:0;overflow-wrap:anywhere}
  .crew-lead{color:var(--ink3)}
  details.crew[open] .crew-lead{display:none}
  /* A coordinator can run eight workers. The list is capped at about three
     rows and scrolls inside itself, so however many are at work the two main
     lists stay on the first screen. */
  .crew-rows{list-style:none;margin:var(--s1) 0 0;padding:0;border:1px solid var(--rule);border-radius:10px;
    background:var(--sheet);max-height:236px;overflow-y:auto;overscroll-behavior:contain;
    scrollbar-width:thin}
  .crew-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:var(--s1) var(--s4);align-items:center;
    padding:var(--s3) var(--s4);border-bottom:1px solid var(--rule)}
  .crew-row:last-child{border-bottom:0}
  .cw-who{display:flex;align-items:center;gap:var(--s2);min-width:0;flex-wrap:wrap}
  .cw-who b{font:600 var(--t-body)/1.3 var(--text);overflow-wrap:anywhere}
  .cw-kind{font:400 var(--t-meta)/1.3 var(--text);color:var(--ink3)}
  .cw-state{font:600 var(--t-meta)/1.3 var(--text);color:var(--ink2);white-space:nowrap}
  .crew-row.live .cw-state{color:var(--blue)}
  .moved{font:400 var(--t-meta)/1.3 var(--text);color:var(--ink3);white-space:nowrap}
  .cw-title{grid-column:1/-1;font:400 var(--t-meta)/1.45 var(--text);color:var(--ink3);overflow-wrap:anywhere}
  .cw-title i{font-style:normal;color:var(--ink2)}
  .crew-note{margin:var(--s2) 0 0;font:400 var(--t-meta)/1.45 var(--text);color:var(--ink3);max-width:var(--measure)}
  .wslink{background:var(--sunk);border:1px solid var(--rule2);border-radius:6px;padding:var(--s1) var(--s2);
    margin-right:var(--s2);font:600 var(--t-meta)/1.3 var(--disp);color:var(--ink2)}
  .wslink:hover{border-color:var(--ink);color:var(--ink)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--cs,var(--ink3));flex:none}
  .dot.hollow{background:none;border:1.6px solid var(--cs,var(--ink3))}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--cs) 55%,transparent)}
    70%,100%{box-shadow:0 0 0 7px transparent}}
  @media(prefers-reduced-motion:no-preference){ .dot.pulse{animation:pulse 2.4s ease-out infinite} }

  .alert{margin-top:var(--s4);border:1.5px solid var(--red);background:var(--red-bg);border-radius:10px;
    padding:var(--s4);max-width:calc(var(--measure) + 4em)}
  .alert b{display:block;font:600 var(--t-row)/1.3 var(--text)}
  .alert p{margin:var(--s1) 0 0;color:var(--ink2);overflow-wrap:anywhere}

  /* ── the two functions ─────────────────────────────────────────────
     Under 1100px they share the column as two tabs, so each one starts at
     the top of a narrow pane instead of a thousand pixels down. From
     1100px both are on screen side by side and the tabs are gone. The one
     that is showing is filled, like a pressed filter: a darker border alone
     did not say which of two white buttons was on. */
  .tabs{display:flex;gap:var(--s2);position:sticky;top:0;z-index:15;
    background:var(--paper);padding:var(--s3) 0;margin-top:var(--s2)}
  .tabs:empty{display:none}
  .tab{flex:1 1 auto;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:48px;
    padding:var(--s2) var(--s4);border:1px solid var(--rule2);border-radius:10px;background:var(--sheet);
    color:var(--ink2);font:600 var(--t-row)/1.15 var(--disp);text-align:left;min-width:0}
  .tab span:first-child{min-width:0;overflow-wrap:anywhere}
  .tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
  .tab .n{font:700 var(--t-body)/1 var(--disp);font-variant-numeric:tabular-nums;padding:5px 8px;
    border-radius:6px;background:var(--sunk);color:var(--ink2);flex:none}
  .tab[aria-pressed="true"] .n{background:var(--sheet);color:var(--ink)}
  .tab .n.hot,.tab[aria-pressed="true"] .n.hot{background:var(--mark);color:var(--mark-ink)}

  /* The space between the two panels is the widest space on the row: wider
     than the padding inside either, so each reads as one thing and the two
     as two. Below them, the second rank starts after a clear break. */
  .layout{display:grid;gap:var(--s7) var(--gap);grid-template-columns:minmax(0,1fr);margin-top:var(--s2)}
  .work{display:grid;gap:var(--gap);grid-template-columns:minmax(0,1fr);align-items:start;min-width:0}
  @media(max-width:1099.98px){
    .work[data-view="ws"] #pane-needs,.work[data-view="needs"] #pane-ws{display:none}
    .work.has-tabs .pane-title{position:absolute;width:1px;height:1px;overflow:hidden;
      clip-path:inset(50%);white-space:nowrap}
    .work.has-tabs .pane-head:not(:has(.pane-extra)){display:none}
    .work.has-tabs .pane-head{min-height:0}
  }
  @media(min-width:1100px){
    .bar{position:sticky;top:0;z-index:20}
    .bar-stamp{display:flex;margin:0 0 0 auto;justify-content:flex-end;min-width:0}
    .bar-stamp .drift{flex-basis:auto}
    .hero .hero-main .stamp{display:none}
    .hero{grid-template-columns:minmax(0,1fr) auto;align-items:start}
    .hero:has(details.crew[open]){grid-template-columns:minmax(0,1fr) minmax(0,34rem)}
    .hero details.crew{margin-top:0}
    .hero details.crew>summary{justify-content:flex-end}
    .tabs{display:none}
    .layout{margin-top:var(--s5)}
    .work.has-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
    .layout.solo{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
  }

  /* Each panel is a container: its rows are laid out by the panel's own
     width, not the window's, so a panel reads the same at 660px whether the
     window is 1440 wide or it is alone in a 700px pane. */
  .pane{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;min-width:0;
    container:pane / inline-size}
  .pane:empty{display:none}
  details[hidden]{display:none}
  .pane-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s4);min-height:64px;
    padding:var(--s3) var(--pad);border-bottom:1px solid var(--rule)}
  .pane-title{display:flex;align-items:center;gap:var(--s3)}
  .pane-head h2{font:600 var(--t-title)/1.15 var(--disp);margin:0}
  /* A count is a number in a box. Amber when it counts what waits for the
     owner; it never carries a word, so it is not mistaken for the pill. */
  .count{font:700 var(--t-body)/1 var(--disp);font-variant-numeric:tabular-nums;padding:5px 8px;border-radius:6px;
    background:var(--sunk);color:var(--ink2);border:1px solid var(--rule);flex:none}
  .count.hot{background:var(--mark);color:var(--mark-ink);border-color:transparent}
  /* A caption under a panel's title: how old the list is, where it comes from. */
  .pane-extra{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s3);margin:0;
    padding:var(--s3) var(--pad) 0;font:400 var(--t-meta)/1.4 var(--text);color:var(--ink3);min-width:0;
    overflow-wrap:anywhere}
  .pane-extra + .ws-top{padding-top:var(--s3)}
  .empty{margin:0;padding:var(--s5) var(--pad);color:var(--ink3)}
  .empty b{display:block;color:var(--ink);font:600 var(--t-row)/1.3 var(--text);margin-bottom:var(--s1)}

  /* ── Needs you: a queue, one question open at a time ───────────────
     Only the open question has anything that records an answer. A closed
     row is the question and my pick, to read down the list; opening it is
     always safe. So when a card closes after an answer and the rows under
     it move up, nothing that records can slide under the pointer. */
  .queue{list-style:none;margin:0;padding:0}
  .q{border-bottom:1px solid var(--rule)}
  .q:last-child{border-bottom:0}
  .q-head{display:grid;grid-template-columns:var(--numcol) minmax(0,1fr) var(--chev);gap:0 var(--s3);
    align-items:start;width:100%;text-align:left;background:none;border:0;border-radius:0;
    padding:var(--s4) var(--pad)}
  button.q-head:hover,.ws-row:hover{background:var(--sunk)}
  .q-num{font:700 var(--t-row)/1.4 var(--disp);font-variant-numeric:tabular-nums;color:var(--ink3);
    border-radius:6px}
  .q-text{grid-column:2;font:500 var(--t-row)/1.4 var(--text);max-width:var(--measure);overflow-wrap:anywhere}
  /* My pick is what the owner reads down the list to decide which question
     to open. It is set as text to be read, not as a caption. */
  .q-meta{grid-column:2;margin-top:var(--s1);color:var(--ink2);line-height:1.45;max-width:var(--measure);
    overflow-wrap:anywhere}
  .q-pick{font:600 var(--t-meta)/1 var(--text);color:var(--ink3);margin-right:var(--s2)}
  .q-chev,.ws-chev{grid-column:-2/-1;grid-row:1;justify-self:end;width:9px;height:9px;margin:5px 4px 0 0;
    border-right:1.6px solid var(--ink3);border-bottom:1.6px solid var(--ink3);transform:rotate(45deg)}
  .q.open{background:var(--mark-wash);box-shadow:inset 4px 0 0 var(--mark)}
  .q.open button.q-head:hover{background:none}
  .q.open .q-num{background:var(--mark);color:var(--mark-ink);text-align:center}
  .q.open .q-text{font-weight:600}
  .q.open .q-chev,.ws.open .ws-chev{transform:rotate(-135deg);margin-top:10px}
  .q-body{padding:0 var(--pad) var(--s5) calc(var(--pad) + var(--numcol) + var(--s3))}
  .q-why{color:var(--ink2);line-height:1.55;max-width:var(--measure);overflow-wrap:anywhere}
  .q-hint{margin:var(--s3) 0 0;font:400 var(--t-meta)/1.45 var(--text);color:var(--ink3)}

  /* The options are laid out by the width they are given, which is a whole
     panel in a narrow window and half of one in a wide window. */
  .q-act{container:act / inline-size;min-width:0}
  .opts{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s3);max-width:calc(var(--measure) + 2em)}
  .q-act>.opts:first-child{margin-top:var(--s1)}
  .opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s1) var(--s3);align-items:center;
    text-align:left;background:var(--sheet);color:var(--ink);border:1px solid var(--rule2);
    border-radius:10px;padding:var(--s3) var(--s4);font:500 var(--t-body)/1.4 var(--text);min-height:52px;
    transition:border-color .12s}
  .opt:hover{border-color:var(--ink)}
  .opt .lab{min-width:0;overflow-wrap:anywhere}
  .opt .rsn{grid-column:2/4;font-weight:400;line-height:1.45;color:var(--ink2);overflow-wrap:anywhere}
  .opt .rsn.hint{font-size:var(--t-meta);color:var(--ink3)}
  .opt.rec{border-color:var(--ink);box-shadow:inset 0 0 0 .5px var(--ink)}
  .opt.other{border-style:dashed}
  .opt.other .lab{color:var(--ink2)}
  .opt[disabled]{opacity:.55;cursor:progress}
  .optid{display:inline-grid;place-items:center;flex:none;min-width:26px;height:26px;padding:0 3px;
    border-radius:50%;background:var(--sunk);border:1px solid var(--rule2);
    font:700 var(--t-meta)/1 var(--disp);color:var(--ink2)}
  .optid.rec{background:var(--mark);border-color:transparent;color:var(--mark-ink)}
  /* The pill is the only target on the page that records without asking.
     Small on purpose, but not so small that hitting it takes aim. It is also
     the only amber shape with words on it: a status and a tag used to wear
     the same fill, and the one thing that acts at once looked like a label. */
  .pick{font:600 var(--t-meta)/1 var(--text);color:var(--mark-ink);background:var(--mark);
    border-radius:999px;padding:10px 14px;white-space:nowrap;box-shadow:0 0 0 1px rgba(28,21,9,.18)}
  .pick:hover{box-shadow:0 0 0 2px var(--ink)}

  /* An answer that has just been recorded stays where the question was,
     stamped, until the page is reloaded. */
  .q.recorded .q-num{color:var(--green)}
  .q.recorded .q-text{color:var(--ink3);font-weight:400}
  .q-ans{grid-column:2;margin-top:var(--s1);font:500 var(--t-body)/1.45 var(--text);max-width:var(--measure);
    overflow-wrap:anywhere}
  .stampmark{display:inline-block;margin-right:var(--s2);padding:2px 7px;border:1.6px solid var(--green);
    border-radius:4px;color:var(--green);font:700 var(--t-meta)/1.25 var(--disp);letter-spacing:.03em;
    transform:rotate(-2deg);white-space:nowrap}
  @keyframes stamp{0%{transform:scale(1.9) rotate(-9deg);opacity:0}
    55%{transform:scale(.94) rotate(-2deg);opacity:1}100%{transform:scale(1) rotate(-2deg)}}
  @media(prefers-reduced-motion:no-preference){
    .stampmark.fresh{animation:stamp .42s cubic-bezier(.2,.9,.3,1.2) both}
  }

  /* image-bearing questions: look first, then choose */
  .optreview{list-style:none;margin:var(--s4) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--s4)}
  .optreview li{display:flex;gap:var(--s3);align-items:flex-start}
  .optreview-body{min-width:0;flex:1}
  .optreview-lab{font:500 var(--t-body)/1.4 var(--text);overflow-wrap:anywhere}
  /* "My pick" beside a picture is a label and records nothing, so it does
     not look like the pill: a mark and a word. */
  .rectag{margin-left:var(--s2);font:600 var(--t-meta)/1 var(--text);color:var(--ink2);white-space:nowrap}
  .rectag::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;
    background:var(--mark);transform:rotate(45deg)}
  .optreview .rsn{margin-top:var(--s1);color:var(--ink2);line-height:1.45;max-width:var(--measure)}
  .optshotlink{position:relative;display:inline-block;margin-top:var(--s3);border-radius:8px}
  .optshot{display:block;width:168px;height:104px;object-fit:cover;border-radius:8px;
    border:1px solid var(--rule2);background:
      repeating-conic-gradient(rgba(130,120,109,.14) 0% 25%,transparent 0% 50%) 50%/16px 16px}
  .optshotlink:hover .optshot{border-color:var(--ink)}
  .optshot-badge{position:absolute;top:6px;left:6px;display:inline-grid;place-items:center;
    min-width:24px;height:24px;padding:0 5px;border-radius:20px;background:rgba(10,8,6,.78);
    color:#f2ede6;font:700 var(--t-meta)/1 var(--disp)}
  .optshot-badge.rec{background:var(--mark);color:var(--mark-ink)}
  .choicerow{margin-top:var(--s4)}
  .choicerow-label{margin:0;font:600 var(--t-meta)/1.2 var(--text);color:var(--ink2)}
  .choicerow .opts{margin-top:var(--s2)}

  /* answered: within reach, out of the way */
  details.drawer{border-top:1px solid var(--rule)}
  details.drawer>summary{display:flex;align-items:center;gap:var(--s1) var(--s3);flex-wrap:wrap;cursor:pointer;
    list-style:none;position:relative;min-height:56px;
    padding:var(--s3) var(--pad) var(--s3) calc(var(--pad) + var(--numcol) + var(--s3));
    font:600 var(--t-row)/1.3 var(--text);color:var(--ink2)}
  details.drawer>summary::-webkit-details-marker{display:none}
  /* The chevron is placed, not flowed: a long title that wraps must not
     leave it alone on a line of its own. */
  details.drawer>summary::before,details.sec>summary::before{content:"";position:absolute;
    left:calc(var(--pad) + 2px);top:22px;width:8px;height:8px;border-right:1.6px solid var(--ink3);
    border-bottom:1.6px solid var(--ink3);transform:rotate(-45deg)}
  details.drawer[open]>summary::before{transform:rotate(45deg)}
  .drawer-hint{font:400 var(--t-meta)/1.3 var(--text);color:var(--ink3)}
  .ans{padding:var(--s4) var(--pad) var(--s4) calc(var(--pad) + var(--numcol) + var(--s3));
    border-top:1px solid var(--rule)}
  .ans .aq{color:var(--ink2);max-width:var(--measure);overflow-wrap:anywhere}
  .ans .ac{display:flex;gap:var(--s2);align-items:flex-start;margin-top:var(--s1);
    font:600 var(--t-body)/1.45 var(--text);max-width:var(--measure)}
  .ans .ac::before{content:"";flex:none;width:11px;height:6px;margin-top:7px;
    border-left:2px solid var(--green);border-bottom:2px solid var(--green);transform:rotate(-45deg)}
  /* The owner's own line breaks are kept, and a very long answer scrolls in
     its box instead of setting the height of the page. */
  .chosetxt{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:380px;overflow-y:auto}
  .ans .an{margin-top:var(--s2);color:var(--ink3);max-width:var(--measure);overflow-wrap:anywhere}
  .ans .when{margin-top:var(--s1);font:400 var(--t-meta)/1.3 var(--text);color:var(--ink3)}
  .trunc{margin-top:var(--s2);padding:var(--s2) var(--s3);border:1px dashed var(--warn);border-radius:8px;
    color:var(--warn);font-size:var(--t-meta)}
  .showall{display:block;margin:0 var(--pad) var(--s3) calc(var(--pad) + var(--numcol) + var(--s3))}

  /* ── Workstreams: the register ───────────────────────────────────── */
  .ws-top{padding:var(--s4) var(--pad);border-bottom:1px solid var(--rule)}
  .meter{display:flex;gap:2px;height:8px}
  .meter i{display:block;min-width:8px;border-radius:2px;background:var(--cs,var(--ink3))}
  .filters{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
  .fchip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:var(--s1) var(--s3);
    border:1px solid var(--rule2);border-radius:999px;background:var(--sheet);color:var(--ink2);
    font:600 var(--t-meta)/1 var(--text)}
  .fchip svg{color:var(--cs,var(--ink3))}
  .fchip b{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
  .fchip:hover{border-color:var(--ink)}
  .fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
  .fchip[aria-pressed="true"] b,.fchip[aria-pressed="true"] svg{color:var(--sheet)}
  /* The note above the list is one line by the skill. When an agent writes a
     page into it, two lines show and the list still starts on the first
     screen. */
  .ws-note{margin:var(--s3) 0 0;color:var(--ink2);max-width:var(--measure);overflow-wrap:anywhere}
  .ws-top .linkish{display:block}
  .warnnote{margin:var(--s3) 0 0;padding:var(--s2) var(--s3);border:1px dashed var(--warn);border-radius:8px;
    background:var(--warn-bg);color:var(--warn);font:500 var(--t-meta)/1.45 var(--text);overflow-wrap:anywhere}
  .ws-group{border-bottom:1px solid var(--rule)}
  .ws-group:last-child{border-bottom:0}
  /* More space above a group's name than below it: the name belongs to the
     rows that follow. */
  .ws-group h3{margin:0;padding:var(--s5) var(--pad) var(--s2);font:600 var(--t-body)/1.3 var(--text);
    color:var(--ink2)}
  .ws-gnote{margin:0 var(--pad) var(--s2);color:var(--ink3);max-width:var(--measure);overflow-wrap:anywhere}
  .gnote-more{margin:calc(-1 * var(--s2)) var(--pad) var(--s1)}
  .ws-list{list-style:none;margin:0;padding:0}
  .ws{border-top:1px solid var(--rule)}
  .ws.k-waiting{box-shadow:inset 4px 0 0 var(--mark)}
  .ws.open{background:var(--sunk)}
  /* round 2. The ground under the pointer is a theme colour as it is, so it
     is opaque: the row draws the amber bar of a waiting workstream itself, or
     the bar would go out under the pointer. */
  .ws.k-waiting .ws-row:hover{box-shadow:inset 4px 0 0 var(--mark)}
  .ws-row{display:grid;grid-template-columns:var(--idcol) minmax(0,1fr) auto var(--chev);gap:var(--s1) var(--s3);
    align-items:start;width:100%;text-align:left;background:none;border:0;border-radius:0;
    padding:var(--s4) var(--pad)}
  .ws-id{font:700 var(--t-row)/1.4 var(--disp);font-variant-numeric:tabular-nums;color:var(--ink3);
    overflow-wrap:anywhere}
  .ws-name{font:600 var(--t-row)/1.4 var(--text);overflow-wrap:anywhere}
  .ws-next{grid-column:2/4;color:var(--ink2);line-height:1.45;max-width:var(--measure);overflow-wrap:anywhere}
  .ws-next b,.ws-detail dt{font:600 var(--t-meta)/1.4 var(--text);color:var(--ink3)}
  .ws-next b{margin-right:var(--s2)}
  .ws-crew{grid-column:2/4;display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s1)}
  .wchip{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;padding:3px 10px;
    border:1px solid var(--rule2);border-radius:999px;background:var(--sheet);
    font:400 var(--t-meta)/1.4 var(--text);color:var(--ink2)}
  .wchip b{font-weight:600;color:var(--ink)}
  .ws.open .ws-next{-webkit-line-clamp:unset;display:none}
  .ws-detail{margin:0;padding:0 var(--pad) var(--s5) calc(var(--pad) + var(--idcol) + var(--s3));
    display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s3)}
  .ws-detail div{min-width:0}
  .ws-detail dd{margin:2px 0 0;color:var(--ink);max-width:var(--measure);overflow-wrap:anywhere}
  .ws-detail .quiet{color:var(--ink3)}

  /* status: always the word, with a shape and a colour beside it. It is not
     a button, so it is not drawn as one: no box, no fill. */
  .status{display:inline-flex;align-items:center;gap:6px;font:600 var(--t-meta)/1.7 var(--text);
    color:var(--c);white-space:nowrap}
  .status svg{color:var(--ck)}
  .status svg,.fchip svg{width:11px;height:11px;flex:none;fill:currentColor}
  /* --c: the word, on a plain ground. --ck: its mark. --cs: the same hue as a
     bare shape (dots, the meter, the filters). */
  .k-active{--c:var(--blue);--ck:var(--blue);--cs:var(--blue)}
  .k-waiting{--c:var(--ink);--ck:var(--mark);--cs:var(--mark)}
  .k-ready{--c:var(--teal);--ck:var(--teal);--cs:var(--teal)}
  .k-blocked{--c:var(--red);--ck:var(--red);--cs:var(--red)}
  .k-todo{--c:var(--grey);--ck:var(--grey);--cs:var(--rule2)}
  .k-parked{--c:var(--violet);--ck:var(--violet);--cs:var(--violet)}
  .k-done{--c:var(--green);--ck:var(--green);--cs:var(--green)}
  .k-other{--c:var(--ink2);--ck:var(--ink3);--cs:var(--ink3)}
  .fchip.k-waiting svg{color:var(--warn)}

  /* ── second rank: everything else the board holds ────────────────── */
  .more{min-width:0}
  .more-title{font:600 var(--t-title)/1.2 var(--disp);color:var(--ink2);margin:0 0 var(--s4)}
  .more-grid{display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr);align-items:start}
  @media(min-width:1100px){
    .layout.duo .more-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4) var(--gap)}
  }
  @media(min-width:1800px){ .layout.duo .more-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
  details.sec{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;min-width:0}
  details.sec>summary{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:var(--s1) var(--s3);
    cursor:pointer;list-style:none;position:relative;min-height:56px;
    padding:var(--s4) var(--pad) var(--s4) calc(var(--pad) + 26px);font:600 var(--t-row)/1.4 var(--disp);
    color:var(--ink)}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec[open]>summary::before{transform:rotate(45deg)}
  details.sec[open]>summary{border-bottom:1px solid var(--rule)}
  .sec-label{min-width:0;overflow-wrap:anywhere}
  .sec-aside{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:var(--s1) var(--s2)}
  .sec-aside:empty{display:none}
  .sec-aside .count{font-size:var(--t-meta)}
  .sec-body{padding:var(--s4) var(--pad) var(--s5)}
  .agechip{font:400 var(--t-meta)/1.2 var(--text);color:var(--ink3);white-space:nowrap}
  .agechip.stale{color:var(--warn);font-weight:600}
  .agechip.plain.stale{color:var(--ink3);font-weight:400}

  .card{border:1px solid var(--rule);border-radius:10px;padding:var(--s4);margin-bottom:var(--s3);
    background:var(--sheet);min-width:0}
  .card:last-child{margin-bottom:0}
  .card .t{font:600 var(--t-row)/1.4 var(--text);max-width:var(--measure);overflow-wrap:anywhere}
  .card .t .agechip{margin-left:var(--s2);white-space:normal}
  .card .d{margin-top:var(--s2);color:var(--ink2);max-width:var(--measure);overflow-wrap:anywhere}
  .card .n{margin-top:var(--s2);color:var(--ink3);max-width:var(--measure);overflow-wrap:anywhere}
  .card.unconfirmed{border-color:var(--warn);border-style:dashed}
  /* A severity is a word with a mark, like a status, and for the same reason. */
  .sevtag{display:inline-flex;align-items:center;gap:6px;margin-right:var(--s3);vertical-align:1px;
    font:600 var(--t-meta)/1.4 var(--text);color:var(--c);white-space:nowrap}
  .sevtag::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--ck)}
  .shotlink{display:block;margin-top:var(--s3)}
  .shot{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--rule2);background:
      repeating-conic-gradient(rgba(130,120,109,.14) 0% 25%,transparent 0% 50%) 50%/16px 16px}
  .shotlink:hover .shot{border-color:var(--ink)}

  /* a handoff leaves the board for someone else; numbered, because the
     owner and the recipient will say "point 2" */
  .ho .to{font:600 var(--t-meta)/1.3 var(--text);color:var(--blue);margin-bottom:var(--s1)}
  .ho ol.pts{margin:var(--s3) 0 0;padding:0;list-style:none;counter-reset:ho}
  .ho ol.pts>li{counter-increment:ho;display:grid;grid-template-columns:var(--numcol) minmax(0,1fr);gap:var(--s2);
    padding:var(--s3) 0;border-top:1px solid var(--rule)}
  .ho ol.pts>li::before{content:counter(ho);font:700 var(--t-row)/1.4 var(--disp);color:var(--blue)}
  .ho .pt{font-weight:600;max-width:var(--measure);overflow-wrap:anywhere}
  .ho .pd{color:var(--ink2);margin-top:2px;max-width:var(--measure);overflow-wrap:anywhere}
  .ho .flag{margin-top:var(--s3);padding-left:var(--s3);border-left:3px solid var(--warn);color:var(--ink2);
    max-width:var(--measure);overflow-wrap:anywhere}
  .btn{min-height:44px;padding:var(--s2) var(--s4);border-radius:9px;border:1px solid var(--rule2);
    background:var(--sunk);font:600 var(--t-body)/1.2 var(--text)}
  .btn:hover{border-color:var(--ink)}
  .ho .send{margin-top:var(--s3);width:100%;max-width:var(--measure)}
  .ho.done{border-color:var(--green)}
  .ho.done .chose{margin-top:var(--s2)}
  .ho.done .when{margin-top:var(--s1);font:400 var(--t-meta)/1.3 var(--text);color:var(--ink3)}

  .commits{list-style:none;margin:0;padding:0}
  .commits li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s3);padding:var(--s2) 0;
    border-bottom:1px solid var(--rule);color:var(--ink2);overflow-wrap:anywhere}
  .commits li:last-child{border-bottom:0}
  .commits .sha{font:14px/1.7 var(--mono);color:var(--ink)}
  .why{margin-top:var(--s3);padding-left:var(--s3);border-left:3px solid var(--rule2);color:var(--ink3);
    max-width:var(--measure)}

  .spine{list-style:none;margin:0;padding:0}
  .rung{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px var(--s4);align-items:start;
    padding:var(--s3) 0;border-bottom:1px solid var(--rule)}
  .rung:last-child{border-bottom:0}
  .rung .nm{color:var(--ink2);max-width:var(--measure);overflow-wrap:anywhere}
  .rung.running .nm,.rung.held .nm{color:var(--ink)}
  .rung.shipped .nm{color:var(--ink3)}

  .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s2) var(--s4);margin:0}
  .kv dt{color:var(--ink3)}
  .kv dd{margin:0;text-align:right;font:14px/1.7 var(--mono);overflow-wrap:anywhere}
  .kv dd.ok{color:var(--green)}
  .kv dd.warn{color:var(--warn);font-weight:600}

  /* backlog: the one part of the board the owner writes */
  .bl-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
  .bl-head p{margin:0;flex:1;color:var(--ink3)}
  .compose{display:none;margin-bottom:var(--s4);max-width:var(--measure)}
  .compose.open{display:block}
  .compose input,.compose textarea,.compose select{width:100%;background:var(--sheet);
    border:1px solid var(--rule2);border-radius:8px;padding:var(--s2) var(--s3);margin-bottom:var(--s2)}
  .compose textarea{resize:vertical;min-height:72px}
  .compose .row{display:flex;gap:var(--s2)}
  .compose .row button{flex:1}
  .btn.go{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
  .btn.go:hover{filter:brightness(1.15)}
  .compose .err{color:var(--red);font-size:var(--t-meta);min-height:1em;margin-bottom:var(--s1)}
  /* A group is named by what its items wait on, with its count in a box
     like every other count, not typed after a comma. */
  .grp{display:flex;align-items:flex-start;gap:var(--s2);font:600 var(--t-body)/1.4 var(--text);color:var(--ink2);
    margin:var(--s5) 0 0;max-width:var(--measure)}
  .grp:first-of-type{margin-top:0}
  .grp .count{font-size:var(--t-meta);margin-top:1px}
  .bl{list-style:none;margin:0;padding:0}
  .bl li{padding:var(--s3) 0;border-bottom:1px solid var(--rule)}
  .bl li:last-child{border-bottom:0}
  .bl .ttl{max-width:var(--measure);overflow-wrap:anywhere}
  .bl li.mine .ttl{font-weight:600}
  .bl .note{margin-top:2px;color:var(--ink3);max-width:var(--measure);overflow-wrap:anywhere;--fold:2}
  .bl .meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s3);margin-top:var(--s1);
    font:400 var(--t-meta)/1.45 var(--text);color:var(--ink3);min-width:0;overflow-wrap:anywhere}
  .bl .meta:empty{display:none}
  .bl .code{border:1px solid var(--rule2);border-radius:4px;padding:0 5px;font:14px/1.4 var(--mono)}
  .bl .from{color:var(--blue);font-weight:600}
  .bl .donebtn{margin-left:auto;background:none;border:0;min-height:36px;padding:var(--s2) var(--s1);color:var(--ink2);
    font:600 var(--t-meta)/1 var(--text);text-decoration:underline;text-underline-offset:3px}
  .bl .donebtn:hover{color:var(--green)}

  /* ── confirmation: the page's own gate on anything but the pill ──── */
  dialog.confirm{border:1px solid var(--rule2);border-radius:14px;padding:0;background:var(--sheet);
    color:var(--ink);width:min(560px,92vw);font:var(--t-body)/1.5 var(--text);box-shadow:var(--shade)}
  dialog.confirm::backdrop{background:rgba(0,0,0,.6)}
  dialog.confirm form{margin:0}
  dialog.confirm .cbody{padding:var(--s5) var(--s5) var(--s1)}
  dialog.confirm .ceyebrow{font:600 var(--t-row)/1.3 var(--text);color:var(--warn);margin:0 0 var(--s3)}
  dialog.confirm .cq{color:var(--ink2);margin:0 0 var(--s4);overflow-wrap:anywhere}
  dialog.confirm .ca{font:600 var(--t-row)/1.4 var(--text);margin:0 0 var(--s4);padding:var(--s3) var(--s4);
    background:var(--sunk);border-radius:8px;border-left:4px solid var(--mark);overflow-wrap:anywhere}
  dialog.confirm .cnote{color:var(--ink3);font-size:var(--t-meta);margin:0}
  dialog.confirm .cinput{display:block;width:100%;font:inherit;background:var(--sunk);
    border:1px solid var(--rule2);border-radius:8px;padding:var(--s3) var(--s4);margin:0 0 var(--s3);
    resize:vertical;min-height:96px}
  dialog.confirm .cinput:focus{outline:2px solid var(--blue);outline-offset:1px}
  dialog.confirm .cbtns{display:flex;gap:var(--s3);justify-content:flex-end;flex-wrap:wrap;
    padding:var(--s5)}
  dialog.confirm button[disabled]{opacity:.45;cursor:not-allowed}
  @keyframes confirmIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:no-preference){
    dialog.confirm[open]{animation:confirmIn 180ms cubic-bezier(.2,.8,.2,1) both}
  }

  /* A board that has closed itself to this tab: only the banner is on screen (see showClosed). */
  body.closed #work, body.closed #more, body.closed #tabs, body.closed #lede, body.closed #crew, body.closed #stamp{display:none !important}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:40;
    max-width:min(92vw,560px);text-align:center;background:var(--green);color:var(--sheet);
    padding:var(--s3) var(--s5);border-radius:10px;font:600 var(--t-body)/1.4 var(--text);opacity:0;
    transition:opacity .18s;pointer-events:none;box-shadow:var(--shade)}
  .toast.on{opacity:1}
  /* The one toast that means "what you just did did not happen". */
  .toast.err{background:var(--red)}

  /* ── a panel by its own width ──────────────────────────────────────
     Narrow (Orca's pane, or half of an 1100px window): give the margin back
     to the words. The status goes under the name; the open question and the
     open workstream lose their indent. */
  @container pane (max-width:460px){
    .q-body{padding-left:var(--pad)}
    .ans{padding-left:var(--pad)}
    .showall{margin-left:var(--pad)}
    .ws-row{grid-template-columns:var(--idcol) minmax(0,1fr) var(--chev)}
    .ws-row .status{grid-column:2;grid-row:2;justify-self:start;white-space:normal}
    .ws-next,.ws-crew{grid-column:2}
    .ws-detail{padding-left:var(--pad)}
  }
  /* Where an option is too narrow for its label and the pill side by side,
     the pill goes under the label. */
  @container act (max-width:480px){
    .opt.rec{grid-template-columns:auto minmax(0,1fr)}
    .opt.rec .pick{grid-column:2;justify-self:start;margin:var(--s1) 0 2px}
    .opt .rsn{grid-column:2}
  }
  /* Wide (a window of about 1900px and up): the open question sets its
     reasoning beside its options instead of above them, so the card is half
     as tall and the width holds text instead of air. */
  @container pane (min-width:860px){
    .q-body:has(.q-read){display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0 var(--s6);align-items:start}
    .q-why.clamp{-webkit-line-clamp:8}
    .q-act>.opts:first-child,.q-act>.choicerow:first-child{margin-top:0}
    .ws-detail div{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:0 var(--s4)}
    .ws-detail dt{padding-top:2px}
    .ws-detail dd{margin:0}
  }
  /* Wider still (about 2200px and up): each list becomes a table. A closed
     question is the question and my pick side by side; a workstream is its
     name, its status and its next step in columns that can be read down. */
  @container pane (min-width:1040px){
    .q:not(.open):not(.recorded) .q-head{grid-template-columns:var(--numcol) minmax(0,1.2fr) minmax(0,1fr) var(--chev);
      gap:0 var(--s5)}
    .q:not(.open):not(.recorded) .q-meta{grid-column:3;grid-row:1;margin-top:0}
    .ws-row{grid-template-columns:var(--idcol) minmax(0,.85fr) 9.5em minmax(0,1.35fr) var(--chev);gap:var(--s1) var(--s4)}
    .ws-row .status{grid-column:3;grid-row:1;white-space:normal}
    .ws-next{grid-column:4;grid-row:1 / span 2}
    .ws-crew{grid-column:2}
  }
  @media(max-width:560px){
    .crew-row{grid-template-columns:minmax(0,1fr) auto}
    .crew-row .moved{grid-column:1/-1}
    details.drawer>summary{padding-left:calc(var(--pad) + 26px)}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">

    <span class="proj" id="project">…</span>
    <span class="live" id="tick">live</span>

  </div>

<main class="page">
  <div class="hero">
    <div class="hero-main">
      <h1 id="headline">…</h1>
      <div id="lede"></div>
      <p class="stamp" id="stamp"></p>
    </div>
    <details class="crew" id="crew" data-sec="crew" hidden><summary></summary><div class="body"></div></details>
  </div>
  <div id="alert"></div>

  <div class="tabs" id="tabs" role="group" aria-label="Which of the two lists to show"></div>

  <div class="layout" id="layout">
    <div class="work" id="work" data-view="needs">
      <section class="pane" id="pane-needs" aria-label="Needs you">
        <div id="needs-main"></div>
        <details class="drawer" id="answered" data-sec="answered" hidden><summary></summary><div class="body"></div></details>
      </section>
      <section class="pane" id="pane-ws" aria-label="Workstreams"></section>
    </div>
    <section class="more" id="more" aria-label="Also on this board">
      <h2 class="more-title" id="more-title" hidden>Also on this board</h2>
      <div class="more-grid">
        <details class="sec" id="sec-inflight" data-sec="inflight" hidden><summary></summary><div class="body sec-body"></div></details>
        <details class="sec" id="sec-handoffs" data-sec="handoffs" hidden><summary></summary><div class="body sec-body"></div></details>
        <details class="sec" id="sec-held" data-sec="held" hidden><summary></summary><div class="body sec-body"></div></details>
        <details class="sec" id="sec-findings" data-sec="findings" hidden><summary></summary><div class="body sec-body"></div></details>
        <details class="sec" id="sec-backlog" data-sec="backlog" hidden><summary></summary><div class="body sec-body"></div></details>
        <details class="sec" id="sec-pipeline" data-sec="pipeline" hidden><summary></summary><div class="body sec-body"></div></details>
        <details class="sec" id="sec-facts" data-sec="facts" hidden><summary></summary><div class="body sec-body"></div></details>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict'
const $ = id => document.getElementById(id)

// What the reader chose survives a re-render and, where it is a preference
// rather than a moment, a reload. One port per project, so localStorage is
// already per project.
const store = {
  get(k){ try { return localStorage.getItem('board.' + k) } catch (e) { return null } },
  set(k, v){ try { localStorage.setItem('board.' + k, v) } catch (e) {} },
}

// The board's token (2.4.0, version 2). A token for THIS board and THIS RUN of it, made by the opener from the board's key, is kept
// by this page in the store TOKEN_STORE_KIND names, under TOKEN_STORAGE, and is sent as the header X-Board-Token on every request the
// page makes to the board: the report, an answer, and the two writes of the backlog. The store is sessionStorage (this tab only:
// a program that takes the port of a stopped board and loads its address in another tab finds none, and what
// this tab holds is the token of a run that has ended once the board has stopped) unless localStorage is chosen (every tab of the origin);
// it is one constant, and the server's storing page has the same one (serve.py, TOKEN_STORE_KIND; a test says they agree). Neither
// is a cookie: a cookie goes to every port of the host. The board answers 401 with `code: 'key'` when it has none or a bad one
// (including the token of an earlier run), and the page says so (see poll). Nothing else of the page changes.
const TOKEN_STORAGE = 'board-token'
const TOKEN_STORE_KIND = 'sessionStorage'
const tokenStore = () => { try { return window[TOKEN_STORE_KIND] } catch (e) { return null } }
const readToken = () => { try { return tokenStore().getItem(TOKEN_STORAGE) || '' } catch (e) { return '' } }
const writeToken = t => { try { tokenStore().setItem(TOKEN_STORAGE, t) } catch (e) {} }
const dropToken = () => { try { tokenStore().removeItem(TOKEN_STORAGE) } catch (e) {} }
const boardFetch = (url, opts = {}) => {
  const token = readToken()
  return fetch(url, token ? { ...opts, headers: { ...(opts.headers || {}), 'X-Board-Token': token } } : opts)
}

// Quotes are escaped too, not just tag characters: esc() output goes into
// HTML *attributes* (data-q="...", data-a="..."), where a raw `"` in a
// question or option label terminates the attribute early. Found live
// (11 Aug 2026): a decision whose question contained a quoted phrase
// recorded its answer under a truncated key — cut at the first inner
// quote — which the answered-filter then couldn't match, so the card
// never left "Needs you" on its own.
const esc = s => String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]))
// A few rules, applied to text that is ALREADY escaped — every character this
// function inserts into the DOM is either a literal tag we wrote ourselves
// (`<code>`, `<strong>`, `<em>`, `<a>`) or a captured group of
// already-`esc()`-ed content. A narrative string containing a literal
// `<script>` becomes inert text.
//
// Code spans are parsed FIRST and their content is placeholder-protected
// before the bold pattern ever runs, so `` `a ** glob **` `` cannot have its
// asterisks read as emphasis. The placeholder is restored after the bold pass
// runs, so a code span always wins the argument over what it contains.
//
// One asterisk each side is emphasis, when the pair hugs its words: agents
// type `*register*` whatever the skill says, and the owner was reading the
// asterisks (14 Nov 2026: three in the first open question). The pair must
// touch a letter or a digit on the inside and close its word, so `2 * 3 * 4`,
// `*.py,*.js` and `*name*.py` stay as typed. Where the page is not sure, it
// shows the asterisks: it never removes a character that may mean something.
// (A code span or an address counts as a word: both are held as a NUL
// placeholder while this runs. `<` and `>` can only be the page's own
// `<strong>`, since the text is escaped.)
const EM_RE = /(^|[\s(\[{>]|&quot;|&#39;)\*([\p{L}\p{N}\u0000<](?:[^*\n]{0,78}[\p{L}\p{N}\u0000>])?)\*(?=$|\s|[.,;:!?)\]}]+(?:$|[\s<]|&quot;|&#39;)|<|&quot;|&#39;)/gu
// A web address becomes a link, in text that is not itself a button. It is
// matched in escaped text, so it stops at an escaped quote or bracket.
const URL_RE = /\bhttps?:\/\/(?:(?!&quot;|&#39;|&lt;|&gt;)[^\s<\u0000])+/g
// Where an address ends. The punctuation that ends a sentence is left
// outside it. So is a closing bracket, unless the address holds the bracket
// that opens it (`…/wiki/Foo_(bar)` is one address). So are the asterisks it
// ends with, unless it holds an asterisk before them: `**https://…**` is an
// address in bold, not an address that ends in two asterisks.
// One pass from the end, so a thousand brackets cost a thousand steps.
const countOf = (text, c) => text.split(c).length - 1
function splitAddress(m){
  const firstStar = m.indexOf('*')
  let end = m.length
  let round = countOf(m, ')') - countOf(m, '('), square = countOf(m, ']') - countOf(m, '[')
  while(end > 0){
    const c = m[end - 1]
    if('.,:!?'.includes(c) || (c === ';' && m.slice(end - 5, end) !== '&amp;')) end -= 1
    else if(c === ')' && round > 0){ end -= 1; round -= 1 }
    else if(c === ']' && square > 0){ end -= 1; square -= 1 }
    else if(c === '*'){
      let run = end
      while(run > 0 && m[run - 1] === '*') run -= 1
      if(firstStar < run) break
      end = run
    }
    else break
  }
  return [m.slice(0, end), m.slice(end)]
}
// A NUL char can't occur in text an agent authors into JSON, so it is a
// safe placeholder delimiter — never a plain string like a space or a
// digit, which ordinary prose ("step 0", a decimal) could collide with.
const NUL = String.fromCharCode(0)
const KEPT_RE = new RegExp(NUL + '(\\d+)' + NUL, 'g')
// The marks of a text, in the order that decides who wins. Code spans first,
// then addresses: what is inside either is never read as a mark, and each
// goes back whole at the end. Then bold. `perLine` is for text of several
// lines: a bold run that crosses a line break is closed and opened again at
// the break, so that it can be cut into lines afterwards.
const mdMarks = (s, perLine) => {
  const kept = []
  const keep = piece => NUL + (kept.push(piece) - 1) + NUL
  const text = esc(s == null ? '' : s)
    .replace(/`([^`]+)`/g, (_, inner) => keep({ code: inner }))
    .replace(URL_RE, m => { const [url, tail] = splitAddress(m); return keep({ url }) + tail })
    .replace(/\*\*([^*]+?)\*\*/g, (_, inner) => !perLine ? `<strong>${inner}</strong>`
      : inner.split('\n').map(row => row && `<strong>${row}</strong>`).join('\n'))
  return [text, kept]
}
const mdEm = text => text.replace(EM_RE, '$1<em>$2</em>')
const mdPut = (text, kept, links, breaks) => text.replace(KEPT_RE, (_, i) => {
  const piece = kept[+i]
  if(!piece) return ''
  if(piece.url !== undefined) return links
    ? `<a href="${piece.url}" target="_blank" rel="noopener noreferrer">${piece.url}</a>` : piece.url
  return `<code>${breaks ? piece.code.replace(/\n/g, '<br>') : piece.code}</code>`
})
const mdInline = (s, links) => {
  const [text, kept] = mdMarks(s, false)
  return mdPut(mdEm(text), kept, links, false)
}
// `md` is for text inside a button or a summary, where a link would be a
// second target under the pointer: a question, an option, a row. `mdl` is the
// same with web addresses made into links, for text that is only read.
const md = s => mdInline(s, false)
const mdl = s => mdInline(s, true)
// Text of several lines. A line that starts with "- " is a list item and a
// line that starts with "1." keeps its number; the other line breaks stay
// line breaks. One line comes back exactly as `mdl` would give it.
// Code spans and bold are found over the whole text before it is cut into
// lines, as they were before the page knew lists: a span that crosses a line
// break is still one span.
const mdBlock = s => {
  const whole = String(s == null ? '' : s)
  if(!whole.includes('\n')) return mdl(whole)
  const [text, kept] = mdMarks(whole, true)
  const out = []
  let para = [], list = null
  const endPara = () => { if(para.length){ out.push(`<p class="mdp">${para.join('<br>')}</p>`); para = [] } }
  const endList = () => { if(list){ out.push(`<${list.tag} class="mdl">${list.items.join('')}</${list.tag}>`); list = null } }
  for(const raw of text.split('\n')){
    const line = raw.trim()
    const bullet = /^[-•]\s+(.*)$/.exec(line)
    const numbered = bullet ? null : /^(\d{1,3})[.)]\s+(.*)$/.exec(line)
    if(!bullet && !numbered){
      endList()
      if(line) para.push(mdEm(line)); else endPara()
      continue
    }
    endPara()
    const tag = bullet ? 'ul' : 'ol'
    if(list && list.tag !== tag) endList()
    if(!list) list = { tag, items: [] }
    list.items.push(bullet ? `<li>${mdEm(bullet[1])}</li>` : `<li value="${numbered[1]}">${mdEm(numbered[2])}</li>`)
  }
  endPara(); endList()
  return mdPut(out.join(''), kept, true, true)
}
const has = a => Array.isArray(a) && a.length
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`

const tone = v => {
  const s = String(v).toLowerCase()
  if(['clean','none','ok','passing','green'].includes(s)) return 'ok'
  if(/dirty|commits?$|not run|unknown|\?/.test(s)) return 'warn'
  return ''
}

// How old a thing is, in words. Always a point in the past, which is why it
// always ends in "ago". After a word that wants a plain span instead
// ("unconfirmed for 34 min") use `duration`, never this.
const ago = m => m == null ? null
  : m < 1.5 ? 'just now'
  : m < 60  ? `${Math.round(m)} min ago`
  : m < 1440 ? `${Math.round(m / 60)} h ago`
  : `${Math.round(m / 1440)} d ago`
const duration = m => m == null ? null
  : m < 1.5 ? 'under a minute'
  : m < 60  ? `${Math.round(m)} min`
  : m < 1440 ? `${Math.round(m / 60)} h`
  : `${Math.round(m / 1440)} d`
const minsSince = iso => {
  if(!iso) return null
  const t = Date.parse(iso)
  return Number.isNaN(t) ? null : (Date.now() - t) / 60000
}
const clock = ms => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })

// "Running now" is the only present-tense claim an agent types, and nothing
// makes it false when the agent stops. So it expires visually: past this many
// minutes with no rewrite the card stops asserting and says it is unconfirmed.
const UNCONFIRMED_AFTER_MIN = 20
// A handoff is a human errand; "still on my list" is normal for half a day.
const HANDOFF_STALE_AFTER_MIN = 240
// A state section unchanged this long is the defect the chip exists to show.
const SECTION_STALE_AFTER_MIN = 240

// One source of truth for an age chip's words and staleness, used by tick()
// for every chip on the page. The fresh and stale forms take different
// grammar: "started 4 min ago" names a point, "unconfirmed for 34 min" a span.
const AGE_KINDS = {
  inflight: { thresholdMin: UNCONFIRMED_AFTER_MIN, freshPrefix: 'started ', stalePrefix: 'unconfirmed for ' },
  handoff:  { thresholdMin: HANDOFF_STALE_AFTER_MIN, freshPrefix: 'logged ', stalePrefix: 'waiting ' },
  section:  { thresholdMin: SECTION_STALE_AFTER_MIN, freshPrefix: 'updated ', stalePrefix: 'unchanged for ' },
  // The workstream list is a copy of a register that can sit for days, so an
  // old list is not a fault: same words, no amber (`.plain` in the CSS).
  list:     { thresholdMin: SECTION_STALE_AFTER_MIN, freshPrefix: 'list updated ', stalePrefix: 'list unchanged for ' },
}
function ageChipState(kind, since){
  const m = minsSince(since)
  if(m == null || !AGE_KINDS[kind]) return null
  const { thresholdMin, freshPrefix, stalePrefix } = AGE_KINDS[kind]
  const old = m > thresholdMin
  return { old, text: old ? `${stalePrefix}${duration(m)}` : `${freshPrefix}${ago(m)}` }
}
// A chip is written empty and filled by tick(), every poll. Its words change
// with the clock, and text that changes with the clock must not be part of
// what decides whether a section is repainted.
const ageChip = (kind, since) => minsSince(since) == null ? ''
  : `<span class="agechip${kind === 'list' ? ' plain' : ''}" data-since="${esc(since)}" data-kind="${kind}"></span>`
const sectionChip = (r, key, kind = 'section') => {
  const iso = r.freshness && r.freshness.sections && r.freshness.sections[key]
  return iso ? ageChip(kind, iso) : ''
}

// A picture, when prose cannot carry the thing. `shot` is a bare filename in
// the board's own shots/ directory, never a path: see send_shot() in serve.py.
// 2.4.0: a picture, and the link that opens it in a tab, cannot send the token header, so the report gives each picture a signed
// address (`shotLinks`: shot/<name>?s=<expires>.<digest>, valid ten minutes). The markup is drawn with the address of that moment;
// an address that has expired by the time the browser loads the picture (a lazy one, scrolled to late) or the link is pressed is
// replaced by the newest one the poll has (see the two listeners after `poll`).
const shotUrl = name => (current && current.shotLinks && current.shotLinks[name]) || `shot/${encodeURIComponent(name)}`
const shot = (name, alt) => name
  ? `<a class="shotlink" data-shot="${esc(name)}" href="${esc(shotUrl(name))}" target="_blank" rel="noopener">
       <img class="shot" data-shot="${esc(name)}" src="${esc(shotUrl(name))}" loading="lazy"
            alt="${esc(alt || 'screenshot')}"></a>`
  : ''

const inFlightLabel = list => has(list) && list.some(x => {
  const m = minsSince(x.since)
  return m != null && m > UNCONFIRMED_AFTER_MIN
}) ? 'Running now. Some of this is unconfirmed' : 'Running now'

// ── what the reader has open, chosen or just done ────────────────────
const ui = {
  tab: store.get('tab'),          // 'needs' | 'ws' | null (not chosen yet)
  openQ: undefined,               // undefined until the first report, then the open question's text, or null
  pillHeldUntil: 0,               // until then a hit on the pill asks to confirm instead of recording
  whyOpen: new Set(),             // questions whose reasoning is unfolded
  ledeOpen: false,
  recent: new Map(),              // question -> { answer, at, index }: recorded in this page session
  sending: new Set(),             // questions with an answer on its way to the server
  wsOpen: new Set(),              // workstreams unfolded
  noteOpen: new Set(),            // group notes unfolded
  listNoteOpen: false,            // the note above the workstream list
  unfolded: new Set(),            // long card and backlog texts the reader asked to see whole
  wsFilter: store.get('wsFilter') || '',
  all: new Set(),                 // long lists the reader asked to see whole
}
let current = null                 // the last report
const RECENT_FOR_MS = 15 * 60 * 1000
const SHORT_LIST = 8

// Only what changed is written to the page: a section whose HTML is the same
// as last time is left alone, so the reader's scroll position, text selection
// and half-read card survive a poll that changed something else.
const painted = new WeakMap()
function paint(el, html){
  if(!el || painted.get(el) === html) return false
  el.innerHTML = html
  painted.set(el, html)
  return true
}

// Long text in a list of cards is folded to a few lines, with the rest one
// tap away, so eight cards can be read down as eight cards. Nothing is
// dropped, and the control shows only where text is actually cut.
const fold = (key, html, cls) => {
  const open = ui.unfolded.has(key)
  return `<div class="${cls} fold${open ? '' : ' clamp'}" data-clamp="fold">${html}</div>
    <button class="linkish" data-fold="${esc(key)}"${open ? '' : ' hidden'}>${open ? 'Show less' : 'Read all of it'}</button>`
}

// ── headline ──────────────────────────────────────────────────────────
// The headline is a display line. When an agent writes a paragraph into it,
// the first sentence is set as the headline, on two lines at most, and one
// line of the rest follows as ordinary text; the remainder is one tap away.
// Nothing is dropped. (Until 14 Nov 2026 a long first sentence ran to three
// lines of 36px and the two lists started a third of the way down.)
const HEADLINE_MAX = 110
function splitHeadline(text){
  const s = String(text || '').trim()
  if(s.length <= HEADLINE_MAX) return [s, '']
  const re = /[.!?。]\s+/g
  let m
  while((m = re.exec(s))){
    const cut = m.index + 1
    if(cut < 20) continue
    if(cut > 220) break
    const head = s.slice(0, cut)
    // Never cut inside a code span or a bold run: each half would then print
    // its unmatched mark as a literal character.
    if((head.match(/`/g) || []).length % 2 || (head.match(/\*\*/g) || []).length % 2) continue
    return [head, s.slice(m.index + m[0].length)]
  }
  return [s, '']
}

// ── who is at work ────────────────────────────────────────────────────
const LIVE_STATES = ['working', 'monitoring', 'waiting']
const WARM_MIN = 5
// A row from Orca carries a state. A row derived from a transcript does not,
// and counts as at work if it moved in the last few minutes.
const isLive = t => t.state ? LIVE_STATES.includes(t.state) : (t.lastMin != null && t.lastMin < WARM_MIN)
const agentKind = s => s === 'working' || s === 'monitoring' ? 'active'
  : s === 'waiting' ? 'waiting'
  : s === 'done' ? 'done'
  : ['failed', 'stopped', 'abandoned'].includes(s) ? 'blocked'
  : 'todo'
const dot = t => {
  const live = isLive(t)
  const kind = t.state ? agentKind(t.state) : (live ? 'active' : 'todo')
  return `<span class="dot k-${kind}${t.state === 'working' ? ' pulse' : ''}${live || kind === 'done' || kind === 'blocked' ? '' : ' hollow'}"></span>`
}
const movedSpan = t => `<span class="moved" data-moved="${esc(t.id || t.who)}"></span>`
// "coordinator, worker ×5, critic": eight workers named alike read as a list
// of the same word, so a repeated name is counted instead.
const tally = names => [...names.reduce((seen, n) => seen.set(n, (seen.get(n) || 0) + 1), new Map())]
  .map(([name, n]) => n > 1 ? `${name} ×${n}` : name).join(', ')

function crewParts(r){
  const team = r.team || []
  const note = r.orca && r.orca.note
  if(!team.length && !note) return ['', '']
  const live = team.filter(isLive)
  const lead = team.find(t => t.kind === 'coordinator' || t.kind === 'lead')
  const rows = team.map(t => {
    const ws = (t.ws || []).map(id => `<button class="wslink" data-goto="${esc(id)}">${esc(id)}</button>`).join('')
    const extra = ws || t.title || t.where || t.for
    return `<li class="crew-row${isLive(t) ? ' live' : ''}">
      <span class="cw-who">${dot(t)}<b>${esc(t.who)}</b>${t.kind && t.kind !== t.who ? `<span class="cw-kind">${esc(t.kind)}</span>` : ''}</span>
      <span class="cw-state">${esc(t.state || t.model || '')}</span>
      ${movedSpan(t)}
      ${extra ? `<span class="cw-title">${ws}${esc(t.title || '')}${t.where ? ` <i>in ${esc(t.where)}</i>` : ''}${t.for ? ` <i>for ${esc(t.for)}</i>` : ''}</span>` : ''}
    </li>`
  }).join('')
  return [
    `<span class="crew-n">${live.length ? `${live.length} at work` : 'Nobody at work'}</span>
      <span class="crew-names">${esc(tally(live.map(t => t.who)))}</span>
      ${lead ? `<span class="crew-lead">${esc(lead.who)} ${movedSpan(lead)}</span>` : ''}`,
    `${rows ? `<ul class="crew-rows">${rows}</ul>` : ''}${note ? `<p class="crew-note">${esc(note)}</p>` : ''}`,
  ]
}

// ── Needs you ─────────────────────────────────────────────────────────
// An option is either a plain string, or {label, recommend, why} when there
// is a reason to prefer one.
//
// The clipboard payload, used only when recording fails, carries the QUESTION
// as well as the answer, and names the project: a bare option label forces the
// reader on the other end to work out what it was an answer to.
const replyText = (project, question, answer) =>
  `[${project} board] Re: ${question}\n→ ${answer}`

// This page appends a free-text way out to every question, always. An agent
// that also writes one into narrative.json therefore renders it twice, and
// the authored copy is an inert button that records its own label as the
// answer. The built-in one wins.
// The two failure modes are not symmetric. Leaving a duplicate is visible and
// merely untidy. Filtering a real option is SILENT: it removes a choice the
// owner was supposed to see. So this matches narrowly and under-reaches on
// purpose: a missed duplicate costs a redundant button, a false positive
// costs a decision.
const OTHER_PREFIXES = [
  'somethingelse', 'noneofthese', 'noneoftheabove', 'writemyown', 'letmewrite',
]
const normalise = s => String(s || '').toLowerCase().replace(/[^a-z]/g, '')
const isEscapeHatch = label => {
  const n = normalise(label)
  // 40 normalised characters is comfortably past "somethingelseletmewriteit"
  // (25) and short of any real sentence an author would write.
  return n.length <= 40 && OTHER_PREFIXES.some(p => n.startsWith(p))
}
const asOption = raw => typeof raw === 'string' ? { label: raw }
  : raw && typeof raw === 'object' && !Array.isArray(raw) ? raw
  : { label: raw == null ? '' : String(raw) }
// `options` that is not a list is no options at all: the question still shows,
// with the free-text answer the page always adds.
const authoredOptions = q => (Array.isArray(q.options) ? q.options : [])
  .filter(raw => !isEscapeHatch(asOption(raw).label || ''))

// The whole question, for thinking about away from the screen or forwarding
// to someone else. Options are numbered so they can be referred to by number,
// and the recommendation is carried across: it is part of the question.
const questionText = (project, q) => [
  `[${project} board] ${q.q}`,
  ...(q.why ? ['', q.why] : []),
  '',
  'Options:',
  ...authoredOptions(q).map((raw, i) => {
    const o = asOption(raw)
    const mark = o.recommend ? '  ← my pick' : ''
    const why = o.recommend && o.why ? `\n   ${o.why}` : ''
    return `${i + 1}. ${o.label}${mark}${why}`
  }),
].join('\n').trim()

// An image-bearing question splits looking from choosing. `optReview` is
// pure information: nothing in it records an answer. The buttons under it
// are the same `.opt` a text-only question uses, so one handler, one pill
// rule and one confirmation gate cover both.
function optReview(opts){
  return `<ol class="optreview">${opts.map((raw, i) => {
    const o = asOption(raw)
    const id = i + 1
    return `<li>
      <span class="optid${o.recommend ? ' rec' : ''}">${id}</span>
      <div class="optreview-body">
        <div class="optreview-lab">${md(o.label)}${o.recommend ? '<span class="rectag">My pick</span>' : ''}</div>
        ${o.why ? `<div class="rsn">${md(o.why)}</div>` : ''}
        ${o.shot ? `<a class="optshotlink" data-shot="${esc(o.shot)}" href="${esc(shotUrl(o.shot))}" target="_blank" rel="noopener">
          <img class="optshot" data-shot="${esc(o.shot)}" src="${esc(shotUrl(o.shot))}" loading="lazy" alt="${esc(o.label || '')}">
          <span class="optshot-badge${o.recommend ? ' rec' : ''}">${id}</span>
        </a>` : ''}
      </div>
    </li>`
  }).join('')}</ol>`
}

// Question and answer ride as separate attributes and are joined on click:
// a newline inside an HTML attribute does not survive reliably.
function optButtons(q, opts, project, brief){
  const busy = ui.sending.has(q.q) ? ' disabled' : ''
  return `<div class="opts">${opts.map((raw, i) => {
    const o = asOption(raw)
    return `<button class="opt${o.recommend ? ' rec' : ''}"${busy}
        data-project="${esc(project)}" data-q="${esc(q.q)}" data-a="${esc(o.label == null ? '' : o.label)}"
        data-rec="${o.recommend ? '1' : '0'}">
      <span class="optid">${i + 1}</span>
      <span class="lab">${md(o.label)}</span>
      ${o.recommend ? '<span class="pick" title="Records at once. The only tap that skips the confirmation.">I&rsquo;d pick this</span>' : ''}
      ${!brief && o.why ? `<span class="rsn">${md(o.why)}</span>` : ''}
    </button>`
  }).join('')}${q.other === false ? '' : `<button class="opt other"${busy} data-rec="0" data-other="1"
      data-project="${esc(project)}" data-q="${esc(q.q)}" data-a="">
    <span class="optid" aria-hidden="true">+</span>
    <span class="lab">Write my own answer</span>
    <span class="rsn hint">None of these fit, or the real answer is a qualification rather than a choice.</span>
  </button>`}</div>`
}

function questionBody(q, opts, project){
  const hasShots = opts.some(raw => asOption(raw).shot)
  const hasRec = opts.some(raw => asOption(raw).recommend)
  const whyOpen = ui.whyOpen.has(q.q)
  // Two blocks: what to read, and what to tap. In a narrow panel they stack;
  // in a wide one they sit side by side, and the card is half as tall.
  const read = `${q.why ? `<div class="q-why${whyOpen ? '' : ' clamp'}" data-clamp="why">${mdBlock(q.why)}</div>
      <button class="linkish" data-why="${esc(q.q)}"${whyOpen ? '' : ' hidden'}>${whyOpen ? 'Show less' : 'Read the full reasoning'}</button>` : ''}${hasShots ? optReview(opts) : ''}`
  return `<div class="q-body">
    ${read ? `<div class="q-read">${read}</div>` : ''}
    <div class="q-act">${hasShots
      ? `<div class="choicerow"><p class="choicerow-label">Your choice</p>${optButtons(q, opts, project, true)}</div>`
      : optButtons(q, opts, project, false)}
    <p class="q-hint">${hasRec
      ? 'The amber pill records your answer at once. Anything else asks you to confirm first.'
      : 'I have no pick here, so every answer asks you to confirm first.'}</p>
    <button class="linkish" data-copyq="${esc(q.q)}">Copy the question with all ${plural(opts.length, 'option')}</button>
    </div>
  </div>`
}

function needsHtml(r){
  const project = r.project || 'project'
  for(const [key, rec] of ui.recent) if(Date.now() - rec.at > RECENT_FOR_MS) ui.recent.delete(key)
  const open = (r.decisions || []).filter(q => q && q.q && !ui.recent.has(q.q))

  // The page opens a question by itself exactly once: the first one, on the
  // first report of this page load. The choice is then PINNED. Until 13 Nov
  // 2026 it was recomputed on every render, so "the open card" meant
  // "whatever is first now": an agent that put a new question first, or
  // removed the first one, swapped the question under the open card, and with
  // it the answer under the pill, without the owner touching anything (found
  // in review). Now the open question changes only when the owner taps a
  // header. If it leaves the list it closes, and nothing opens in its place.
  if(ui.openQ === undefined) ui.openQ = open.length ? open[0].q : null
  else if(ui.openQ !== null && !open.some(q => q.q === ui.openQ)) ui.openQ = null
  const openKey = ui.openQ

  // A question answered a moment ago keeps its place in the list, stamped,
  // so the row the owner just tapped does not vanish from under their eyes.
  const rows = open.map((q, i) => ({ q, n: i + 1 }))
  for(const [key, rec] of ui.recent) rows.splice(Math.min(rec.index, rows.length), 0, { key, rec })

  const list = rows.map(row => {
    if(row.rec){
      const fresh = Date.now() - row.rec.at < 1500
      return `<li class="q recorded">
        <div class="q-head">
          <span class="q-num" aria-hidden="true">✓</span>
          <span class="q-text">${md(row.key)}</span>
          <span class="q-ans"><span class="stampmark${fresh ? ' fresh' : ''}">Recorded ${esc(clock(row.rec.at))}</span>${md(row.rec.answer)}</span>
        </div>
      </li>`
    }
    const q = row.q
    const opts = authoredOptions(q)
    const isOpen = q.q === openKey
    const rec = opts.map(asOption).find(o => o.recommend)
    const meta = rec
      ? `<span class="q-meta"><span class="q-pick">I&rsquo;d pick</span>${md(rec.label)}</span>`
      : `<span class="q-meta">${plural(opts.length, 'option')}, no pick from me</span>`
    return `<li class="q${isOpen ? ' open' : ''}">
      <button class="q-head" data-openq="${esc(q.q)}" aria-expanded="${isOpen}">
        <span class="q-num">${row.n}</span>
        <span class="q-text">${md(q.q)}</span>
        <span class="q-chev" aria-hidden="true"></span>
        ${isOpen ? '' : meta}
      </button>
      ${isOpen ? questionBody(q, opts, project) : ''}
    </li>`
  }).join('')

  const answered = r.answered || []
  return `<header class="pane-head">
      <span class="pane-title"><h2>Needs you</h2><span class="count${open.length ? ' hot' : ''}">${open.length}</span></span>
    </header>
    ${rows.length ? `<ol class="queue">${list}</ol>` : `<p class="empty"><b>Nothing needs you right now.</b>${answered.length ? 'Your earlier answers are below.' : 'A question for you will appear here.'}</p>`}
    ${r.unreadableDecisions ? `<p class="warnnote" style="margin:12px var(--pad)">${plural(r.unreadableDecisions, 'entry', 'entries')} in <code>decisions</code> could not be shown: each needs a <code>q</code>, written as text.</p>` : ''}`
}

// Answered questions stay within reach and out of the way: one line under
// the queue, the latest few when opened, all of them on request.
//
// "The latest few" needs an order the page can trust, and the order entries
// were written in is not one (12 Nov 2026: the two newest rulings sat at the
// end of a list of 77). Entries dated with a full timestamp are sorted newest
// first, and the ones dated in free text ("chat, 2 Nov ~15:30") follow them in
// the order they were written: the page cannot place those, and says how many
// there are. If most entries are dated in free text the list is left exactly
// as written, and the page does not claim an order it cannot check.
const stampOf = a => { const t = Date.parse(a.at || (/^\d{4}-\d\d-\d\dT/.test(a.when || '') ? a.when : '')); return Number.isNaN(t) ? null : t }
// A full timestamp is shown the way a person writes one; anything else is
// shown as it was written.
const whenText = a => {
  const t = stampOf(a)
  return t === null ? String(a.when || '')
    : new Date(t).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
}
function newestFirst(list){
  const dated = list.filter(a => stampOf(a) !== null)
  if(dated.length * 2 < list.length) return [list, '']
  const loose = list.filter(a => stampOf(a) === null)
  return [[...dated.sort((x, y) => stampOf(y) - stampOf(x)), ...loose],
    loose.length ? `newest first, then ${loose.length} without a full date` : 'newest first']
}
function answeredParts(r){
  const [answered, sorted] = newestFirst(r.answered || [])
  if(!answered.length) return ['', '']
  const shown = ui.all.has('answered') ? answered : answered.slice(0, SHORT_LIST)
  return [
    `<span>Answered</span><span class="count">${answered.length}</span>
      <span class="drawer-hint">your rulings so far${sorted ? ', ' + sorted : ''}</span>`,
    `${shown.map(a => `<div class="ans">
      <div class="aq">${mdl(a.q)}</div>
      <div class="ac"><span class="chosetxt">${mdl(a.chose)}</span></div>
      ${a.from === 'unmarked' ? `<div class="when">(not marked as sent by a browser)</div>` : a.from === 'network' ? `<div class="when">(sent from another device, by the network token)</div>` : ''}
      ${a.truncated ? `<div class="trunc">Cut at ${esc(String(a.truncatedAt))} of
        ${esc(String(a.originalLength))} characters. This is not the whole
        answer: read it from <code>answers.json</code>.</div>` : ''}
      ${a.note ? `<div class="an">${mdBlock(a.note)}</div>` : ''}
      ${whenText(a) ? `<div class="when">${esc(whenText(a))}</div>` : ''}
    </div>`).join('')}
    ${answered.length > shown.length ? `<button class="linkish showall" data-all="answered">Show all ${answered.length}</button>` : ''}`,
  ]
}

// ── Workstreams ───────────────────────────────────────────────────────
// A status is shown by its own word, as written. The word also picks a shape
// and a colour, so the list can be read down its right edge; an unknown word
// still renders, in a plain tag.
const STATUS_KINDS = [
  ['active',  /^(active|running|in[ -]progress|working)$/],
  ['waiting', /^(waiting|waiting (on|for) .+|awaiting .+|needs you|needs (a )?decision)$/],
  ['ready',   /^(ready|ready to start|queued)$/],
  ['blocked', /^(blocked|blocked (on|by) .+|stuck)$/],
  ['todo',    /^(not started|todo|to do|planned|backlog)$/],
  ['parked',  /^(parked|paused|on hold|held|deferred)$/],
  ['done',    /^(done|complete|completed|shipped|closed|accepted|finished)$/],
]
const KIND_ORDER = ['active', 'waiting', 'ready', 'blocked', 'todo', 'parked', 'done', 'other']
// A row with no status still needs a key of its own: the empty string is the
// "All" filter, and a chip that shared it would show everything.
const statusKey = word => String(word || '').trim().toLowerCase() || '(none)'
const statusKind = word => {
  const w = statusKey(word)
  for(const [kind, re] of STATUS_KINDS) if(re.test(w)) return kind
  return 'other'
}
const GLYPH = {
  active:  '<svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4.2"/></svg>',
  waiting: '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 .4 9.6 5 5 9.6.4 5z"/></svg>',
  ready:   '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.6.8 9.4 5 1.6 9.2z"/></svg>',
  blocked: '<svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="1.2"/></svg>',
  todo:    '<svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="3.3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>',
  parked:  '<svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1.4" y="1" width="2.6" height="8" rx=".7"/><rect x="6" y="1" width="2.6" height="8" rx=".7"/></svg>',
  done:    '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.1 5.5 3.9 8.2 8.9 2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  other:   '<svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1.4" y="4" width="7.2" height="2" rx="1"/></svg>',
}
const statusTag = word => {
  const kind = statusKind(word)
  return `<span class="status k-${kind}">${GLYPH[kind]}${esc(String(word || '').trim() || 'No status')}</span>`
}
const wsKey = item => item.id || item.name

function statusStats(items){
  const seen = new Map()
  for(const item of items){
    const key = statusKey(item.status)
    const row = seen.get(key) || { key, word: String(item.status || '').trim() || 'No status', kind: statusKind(item.status), n: 0 }
